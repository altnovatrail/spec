syntax = "proto3";

// The observation: what AI read in a learner's work, answer slot by answer slot, before any check
// runs. A reader of `tutor` gives one; `module-kit` joins the observations of two readers into one
// and gives the verdict on it. What the messages mean, how two observations are joined and which
// verdict an observation gives are the rules of contracts/README.md, section 10.
package novatrail.observation.v1;

// What AI read in a work: one reader's observation, or the one that `module-kit` joins from two.
message Observation {
  // Every answer slot whose answer AI reads, each once, in the task's order: items by their place,
  // and answer slots by their place in the item. On a handwriting sheet these are the slots bound
  // `anywhere`, `zone` and `sheet`; on a workbook, every box. A slot bound `choice` is tapped, not
  // read, and is not here.
  repeated AnswerSlotObservation answer_slots = 1;
}

// What was read in one answer slot.
message AnswerSlotObservation {
  // The answer slot.
  AnswerSlotPlace answer_slot = 1;
  // What the reading gives: a value, or why it gives none.
  oneof read {
    // The value as it is written, never empty: the reader does not normalize it
    // (contracts/README.md, section 10). In a slot bound `sheet`, the text of the essay.
    string value = 2;
    // Why the reading gives no value.
    Unreadable unreadable = 3;
  }
  // Where the value stands on the crop: only in a slot bound `anywhere`, only beside a value, and
  // only when the reader names a valid box. In every other slot the place is the answer slot
  // itself.
  CropBox crop_box = 4;
}

// An answer slot by its place, which has no ID: its item's place among the task's items, and its
// place among the item's answer slots, each from 1. On a workbook an answer slot is a box.
message AnswerSlotPlace {
  // The item's place among the task's items, from 1.
  int32 item = 1;
  // The answer slot's place among the item's answer slots, from 1.
  int32 slot = 2;
}

// Why a reading gives an answer slot no value. In a slot whose check gives a verdict, each makes
// the verdict `unreadable`, with the reason named as the value is, in lower case and without its
// prefix; an essay that is blank or illegible does not reach the assessment by its rubric
// (contracts/README.md, section 10).
enum Unreadable {
  // No reason: never sent. An observation that holds it, or a reason its reader does not know, is
  // not valid.
  UNREADABLE_UNSPECIFIED = 0;
  // Nothing is written in the slot. On a workbook, a box that sends no crop.
  UNREADABLE_BLANK = 1;
  // Something is written, and it cannot be read.
  UNREADABLE_ILLEGIBLE = 2;
  // What is written can be read more than one way: a digit written mirrored, a value with another
  // reading, or two readers who read it differently.
  UNREADABLE_AMBIGUOUS = 3;
  // In a slot bound `anywhere`: the work holds no final answer.
  UNREADABLE_NO_FINAL_ANSWER = 4;
  // In a slot bound `anywhere`: the work holds more than one final answer.
  UNREADABLE_SEVERAL_FINAL_ANSWERS = 5;
}

// A box on the crop the device sent, in whole thousandths of the crop's height and width, from 0
// to 1000, as [ymin, xmin, ymax, xmax]: ymin < ymax and xmin < xmax (R53).
message CropBox {
  // The top edge, in thousandths of the crop's height.
  int32 ymin = 1;
  // The left edge, in thousandths of the crop's width.
  int32 xmin = 2;
  // The bottom edge, in thousandths of the crop's height.
  int32 ymax = 3;
  // The right edge, in thousandths of the crop's width.
  int32 xmax = 4;
}
