syntax = "proto3";

// A task from the learner's paper in the contract between `app` and `api` (R162): the tasks found
// on the photo of a page, and the attempts of the tasks picked. Each attempt is then checked and
// hinted by `AttemptService`, its work a `PaperWork`. What each message means, and what `api` keeps
// of the page and of the attempts, are the rules of contracts/README.md, section 15.
package novatrail.api.v1;

import "novatrail/api/v1/attempt.proto";
import "novatrail/api/v1/cause.proto";
import "novatrail/observation/v1/observation.proto";

// The requests of a task from paper, from a learner's session: each method is a learning request,
// with the right `can_learn`, open to every profile. Every method carries the token of the sign-in
// service and may get the refusals of every request with a token, which the comment of
// `AccountService` names with what `app` does on each; a profile that is not the account's gets
// `CAUSE_NO_PROFILE`, a request of a profile whose consent is not confirmed `CAUSE_NO_CONSENT`, one
// of a profile whose age is to be given again `CAUSE_AGE_NEEDED`, and a request whose form the
// contract refuses the code `invalid_argument` with no `Refusal`. The server keeps no photo and no
// crop, not even as a stored work (R09; R113).
service PaperService {
  // Finds the tasks on the photo of a page: one call of AI, the capability `task_finding`, whose
  // answer is the task frames alone, and no text of the page; each sum or equation that says by
  // itself what to do, as each of a column under one instruction, is a task of its own. With the
  // learner's request about the page, the call gets it as data, with the frames on the page now,
  // and its frames replace those found before; it gives none that repeats a frame the learner
  // drew. It makes no call without the reserve of the quota. Refusals: `CAUSE_QUOTA`, `CAUSE_PLATFORM_LIMIT` and `CAUSE_NOT_ADMITTED`, on
  // platform AI; `CAUSE_NOT_ADMITTED` on the own key too; `CAUSE_KEY_NOT_FOR_PROFILE`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A call of AI that gives no frames is no
  // refusal: the answer names the outcome, and the learner frames the tasks by hand. A repeat with
  // the same idempotency key gets an answer `repeated` without frames, with no AI: the server keeps
  // none.
  rpc FindTasks(FindTasksRequest) returns (FindTasksResponse);
  // Begins the attempts of the tasks picked on a page, one for each, in the order of the tasks. It
  // closes the open attempts of tasks from paper that the profile has, those of an earlier page,
  // `CLOSE_REASON_LEFT`, and leaves the open attempt of a task of a module as it is. Refusals:
  // `CAUSE_QUOTA`, `CAUSE_PLATFORM_LIMIT` and `CAUSE_NOT_ADMITTED`, on platform AI, as
  // `LearningService.BeginAttempt` meets them; `CAUSE_KEY_NOT_FOR_PROFILE`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the same attempts.
  rpc BeginPaperAttempts(BeginPaperAttemptsRequest) returns (BeginPaperAttemptsResponse);
}

// The photo of a page, for its tasks to be found, and the learner's request about them.
message FindTasksRequest {
  // The profile.
  string profile_id = 1;
  // The idempotency key of this action of the learner.
  string idempotency_key = 2;
  // The photo of the page, as the camera of `app` took it or as the learner picked it, a JPEG or a
  // PNG of at most 4 MiB, without the metadata of its file (privacy 6): `app` scales it down to
  // fit.
  bytes photo = 3;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 4;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 5;
  // The learner's request about the page, in their own words: which tasks to take and how to split
  // them, as "only the first column, each example a task of its own". At most 200 code points,
  // with no control character, not spaces alone; empty finds the tasks as the finding's rule alone gives them. It
  // goes to the AI as data, never as an instruction, and the server keeps none of it (R165).
  string request = 6;
  // The frames the AI found on the page and that are on it now, at most 20, in the order of the
  // page: with a request alone.
  repeated TaskFrame found = 7;
  // The frames the learner drew on the page, at most 40, in the order of the page: with a request
  // alone. The answer repeats none of them.
  repeated TaskFrame drawn = 8;
}

// The tasks found on a page.
message FindTasksResponse {
  // The frame of each task found, in the order of the page, top to bottom: empty when AI found
  // none, or gave no answer.
  repeated TaskFrame frames = 1;
  // What the call of AI came to, when it gave no frames: a failure of AI, or of the own key its
  // limit reached or the key refused.
  Outcome outcome = 2;
  // The answer of a repeat with the same idempotency key, which holds no frames: the server keeps
  // none.
  bool repeated = 3;
}

// A rectangle round one task on the photo of a page, by which `app` cuts the task's crop on the
// device (concepts 8).
message TaskFrame {
  // The frame, in whole thousandths of the photo's height and width, as a box on a crop is written.
  novatrail.observation.v1.CropBox box = 1;
}

// The beginning of the attempts of the tasks picked on a page.
message BeginPaperAttemptsRequest {
  // The profile.
  string profile_id = 1;
  // The idempotency key of this action of the learner.
  string idempotency_key = 2;
  // How many tasks were picked, those the AI found and those framed by hand: from 1 to 20.
  int32 tasks = 3;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that `api` checks no
  // quota. Empty on platform AI. Each later request on an attempt that calls AI goes by the
  // `own_key` it carries, or on platform AI without one (R84).
  string own_key_provider = 4;
}

// The attempts begun.
message BeginPaperAttemptsResponse {
  // The ID of each attempt, in the order of the tasks.
  repeated string attempt_ids = 1;
}
