syntax = "proto3";

// The account and its profiles in the contract between `app` and `api`: the account and the list of
// its profiles, by which `app` erases on the device what was deleted elsewhere; the profile of the
// account's owner and a child's profile, which a consent comes before; how a consent is given,
// confirmed by a parent's signed form, withdrawn and taken back, and the age given again; the PIN
// of the section for adults; the voicing a learner sets; the storage of works; the own key checked
// when it is connected; the share of the quota of platform AI; deletion and export. What each
// message means, and what `app` does on each refusal, are the rules of contracts/README.md,
// section 15.
package novatrail.api.v1;

import "google/protobuf/timestamp.proto";
import "novatrail/api/v1/attempt.proto";
import "novatrail/api/v1/cause.proto";
import "novatrail/api/v1/learning.proto";
import "novatrail/api/v1/legal.proto";

// The requests on the account and its profiles, from the section for adults and from a learner's
// session. Every method carries the ID token of the sign-in service in the header `Authorization`,
// as `Bearer <token>`, and every one may get the refusals of every request with a token:
// `unauthenticated` with no `Refusal`, when the token has expired, is revoked or its user is
// disabled; `CAUSE_ACCOUNT_GONE`; `CAUSE_NO_ACCESS`, but for `CreateAccount`; and `unavailable`
// with no `Refusal`, when the token could not be checked. A method on a profile names the right it
// needs, `can_manage`, `can_learn` or `can_view`; a method on the account itself needs the account
// of the token alone: it is an action of an adult, and the PIN in front of it is a barrier of the
// interface (R04 api). A request without the right it needs
// gets the code `permission_denied` with no `Refusal`, and a request whose form the contract
// refuses the code `invalid_argument` with no `Refusal`. `app` reads the cause of a refusal before
// it refreshes any token:
// - `unauthenticated` with no `Refusal`: it refreshes the token and repeats the request, and opens
//   the sign-in window only if the refresh failed. Signing in again is signing in as the same
//   user, without signing out: signing out erases everything of the account on the device;
// - `CAUSE_FRESH_SIGN_IN_NEEDED`: it signs in again by the window, on a press, and repeats the
//   action. Whether a sign-in is fresh it reads by the `authTime` of a token it has just
//   refreshed, against that token's `issuedAtTime`, not against the clock of the device; on
//   `auth/user-mismatch` it asks `GetAccount`;
// - `CAUSE_ACCOUNT_GONE`: it erases everything of the account and signs out, without refreshing
//   the token;
// - `CAUSE_NO_ACCESS` while the registry of the device holds an account: another account has
//   signed in, and `app` erases what is left of the one before it opens anything;
// - `unavailable`: it repeats the request after a growing pause, for a short while.
service AccountService {
  // The account and its profiles, each with its fields, its open attempt and its open lesson runs,
  // and the consents that have no profile yet. `app` reads it when it starts and after signing in,
  // and erases the databases of the profiles that the list does not hold: only by an answer that
  // came, and for the account the registry of the device names; a failure of the network erases
  // nothing. By the open attempt and runs a device that keeps no state of them finds them. A user
  // with no account gets `CAUSE_NO_ACCESS`, and `app` asks for an invite code.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // Creates the account of the user signed in, by an invite code, the owner's statement that they
  // are 18 or older, and the versions of the privacy policy and the terms of use the owner
  // accepted. Refusals: `CAUSE_ALREADY_EXISTS`, when the user has an account already, checked
  // before the code, so that a repeat gets it rather than a code redeemed; `app` then reads the
  // account by `GetAccount`. And `CAUSE_CODE_NOT_ACCEPTED` and `CAUSE_TEXT_NOT_CURRENT`. It carries
  // no idempotency key: it repeats by the account's state.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // Sets the PIN of the section for adults, while the account has none. Refusals:
  // `CAUSE_PIN_ALREADY_SET`, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the
  // same idempotency key gets the same answer.
  rpc SetPin(SetPinRequest) returns (SetPinResponse);
  // Checks a PIN. A wrong one counts toward closing the input, and the answer says how many wrong
  // PINs are left before it closes, and when it opens, once it has closed. Refusals:
  // `CAUSE_PIN_LOCKED`, `CAUSE_NO_PIN`, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat
  // with the same idempotency key gets the same check, and counts nothing again. The PIN is a
  // barrier of the interface, not of the server: when to ask for it `app` decides, and no request
  // carries proof that it was asked (R04 api).
  rpc VerifyPin(VerifyPinRequest) returns (VerifyPinResponse);
  // Changes the PIN by the PIN before it. A wrong PIN before counts toward closing the input as
  // `VerifyPin` counts it, and changes nothing. Refusals: `CAUSE_PIN_LOCKED`, `CAUSE_NO_PIN`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the same check: a PIN changed already is not counted as wrong.
  rpc ChangePin(ChangePinRequest) returns (ChangePinResponse);
  // Changes a forgotten PIN by a fresh sign-in: it sets the new PIN, whether there was one or not,
  // and opens the input if it was closed. Refusals: `CAUSE_FRESH_SIGN_IN_NEEDED`, checked last,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the same answer.
  rpc ResetPin(ResetPinRequest) returns (ResetPinResponse);
  // Creates the profile of the account's owner, of the age category `adult` by the owner's
  // statement, with no age asked. Refusals: `CAUSE_COUNTRY_NOT_ACCEPTED` and
  // `CAUSE_ALREADY_EXISTS`, when the owner has a profile already; `app` then reads the account. It
  // carries no idempotency key: it repeats by the account's state.
  rpc CreateOwnerProfile(CreateOwnerProfileRequest) returns (CreateOwnerProfileResponse);
  // The first of a child's profile's two steps: the owner gives the child's age in years and the
  // child's country, and `api` works out the age category and records a consent that waits, with
  // the category and the country alone: no pseudonym and no other field of the profile. The age in
  // years `api` keeps nowhere. Below the age of digital consent of the country the consent is a
  // parent's, with the code of the request that the signed form names; from it on, the learner's
  // own, which they give in their profile (R116; R136). Refusals: `CAUSE_COUNTRY_NOT_ACCEPTED`,
  // `CAUSE_TOO_MANY_CONSENTS`, checked after the key, `CAUSE_TEXT_NOT_CURRENT`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the same consent, at the limit too.
  rpc RequestChildConsent(RequestChildConsentRequest) returns (RequestChildConsentResponse);
  // Sends the scan of a parent's signed form, a photo or a PDF, for a consent of a parent that
  // waits: `api` keeps it apart from its database, where the operator checks it against the code of
  // the request and confirms the consent or does not accept the form (R116). A form sent again
  // takes the place of the one before. Refusals: `CAUSE_NOT_FOUND`, `CAUSE_ALREADY_EXISTS` when
  // the consent is confirmed, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the
  // same idempotency key gets the same consent.
  rpc SendConsentForm(SendConsentFormRequest) returns (SendConsentFormResponse);
  // Takes back a consent with no profile, waiting or confirmed: one that waits `api` erases with
  // its form, and keeps nothing of it; one confirmed leaves its minimal record and its form for
  // their term, as a withdrawal does (R117). Either no longer counts toward the limit. Refusals:
  // `CAUSE_NOT_FOUND`, which is the answer of a repeat too: `app` reads it as taken back already.
  // It carries no idempotency key: it repeats by the consent's state.
  rpc CancelChildConsent(CancelChildConsentRequest) returns (CancelChildConsentResponse);
  // The second step: creates a child's profile by its consent, once a parent's consent is
  // confirmed, or at once by a consent that the learner gives themselves, which the profile then
  // waits for. Refusals: `CAUSE_NOT_FOUND`, `CAUSE_NO_CONSENT` while a parent's consent waits, and
  // `CAUSE_ALREADY_EXISTS`, when the consent has its profile already; `app` then reads the account.
  // It carries no idempotency key: it repeats by the consent's state.
  rpc CreateChildProfile(CreateChildProfileRequest) returns (CreateChildProfileResponse);
  // The learner's own consent, in their profile, before their first work: a learner from the age
  // of digital consent of their country gives it, and one who reached that age confirms by it the
  // consent a parent gave (R116). A learning request with the right `can_learn`, by the text
  // `teen-consent`. Refusals: `CAUSE_NO_PROFILE`, `CAUSE_ADULT_NEEDED` at a profile below that age,
  // and `CAUSE_TEXT_NOT_CURRENT`. It carries no idempotency key: it repeats by the profile's state,
  // and a consent given already is the answer.
  rpc GiveOwnConsent(GiveOwnConsentRequest) returns (GiveOwnConsentResponse);
  // Withdraws the learner's own consent, as easily as it was given: a learning request with the
  // right `can_learn`, which deletes the profile and everything of it, as `DeleteProfile` does, and
  // leaves the minimal record of the consent and the reports of a problem, as `DeleteProfile` does
  // (R117; R132). `app` offers the export first. Neither `CAUSE_NO_CONSENT` nor `CAUSE_AGE_NEEDED`
  // refuses it, nor `GiveOwnConsent`, nor the learner's `ExportProfile`. A learner who reached the
  // age of digital consent of their country while a parent's consent stands, whose profile waits for
  // their own consent, withdraws that consent by it too, instead of confirming it (R116; R141).
  // Refusals: `CAUSE_ADULT_NEEDED` at a profile whose consent an adult gave and that waits for no
  // consent of the learner — the adult withdraws it by `DeleteProfile` —, and `CAUSE_NO_PROFILE`,
  // which is the answer of a repeat too. It carries no
  // idempotency key: it repeats by the profile's state.
  rpc WithdrawOwnConsent(WithdrawOwnConsentRequest) returns (WithdrawOwnConsentResponse);
  // The age and the country of a profile given again, by an action of an adult with the right
  // `can_manage`: once the country raised its age of digital consent (`CAUSE_AGE_NEEDED`), at the
  // yearly refinement of the category, and with a new country (privacy 3.3; R134). The owner's
  // profile gives its country alone. `api` works out the category again, as `RequestChildConsent`
  // does, and keeps the age nowhere. A category that needs another consent leaves the profile
  // waiting for it: the learner's own, or a parent's, asked for with a new code of the request.
  // Refusals: `CAUSE_NO_PROFILE`, `CAUSE_COUNTRY_NOT_ACCEPTED`, `CAUSE_TEXT_NOT_CURRENT`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the same profile.
  rpc RestateAge(RestateAgeRequest) returns (RestateAgeResponse);
  // Changes a profile's settings, by an action of an adult with the right `can_manage`: the fields
  // sent change, and the others stay as they are. Refusals: `CAUSE_NO_PROFILE`.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Sets the voicing of a profile, whether it is on and its speed, and nothing else, from the
  // screen of a task: a learning request with the right `can_learn`. Refusals:
  // `CAUSE_NO_PROFILE`.
  rpc SetVoicing(SetVoicingRequest) returns (SetVoicingResponse);
  // Switches the storage of a profile's works on the server on or off (R113). Switching it on is a
  // consent by the text `storage-consent`, which the one who consents for the learner gives: an
  // action of an adult with the right `can_manage`, and at a profile whose learner gave their own
  // consent, the learner's learning request with the right `can_learn`. Switching it off records
  // when, and erases the copies on the server, and so goes while the profile waits for a consent
  // too; switching it on then gets `CAUSE_NO_CONSENT`. At a profile whose learner gave their own
  // consent, the learner switching on a storage that an adult switched on is no repeat: it records
  // the learner's own consent by `storage-consent`, the learner its giver, in place of the
  // adult's (R141). Refusals: `CAUSE_NO_PROFILE`, `CAUSE_TEXT_NOT_CURRENT`, `CAUSE_ADULT_NEEDED`
  // and `CAUSE_LEARNER_DECIDES`. It carries no idempotency key: it repeats by the profile's state.
  rpc SetWorkStorage(SetWorkStorageRequest) returns (SetWorkStorageResponse);
  // Deletes a profile and everything of it, by an action of an adult with the right `can_manage`
  // and a fresh sign-in, checked last. For a child it is the withdrawal of the parent's consent,
  // and leaves its minimal record (R117; R132). The reports of a problem stay to their term without
  // the IDs of the account, the profile and the attempt (R123). It deletes a profile whose learner
  // gave their own consent too: the owner holds the account (R21 api). The profile of the owner is
  // deleted the same way, and the last profile leaves the account without profiles. The answer is
  // "deleted", and `app` erases the profile's database. Refusals: `CAUSE_FRESH_SIGN_IN_NEEDED`, and
  // `CAUSE_NO_PROFILE`, which is the answer of a repeat too: `app` reads it as deleted already. It
  // carries no idempotency key: it repeats by the profile's state.
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  // Deletes the account and everything of it, with the user of the sign-in service, by a fresh
  // sign-in, checked last; the reports of a problem stay to their term without the IDs of the
  // account, the profile and the attempt (R123). The answer is "deleted", and `app` erases
  // everything of the account on the device and signs out, without refreshing the token. Other
  // devices learn of it by `CAUSE_ACCOUNT_GONE`. Refusals: `CAUSE_FRESH_SIGN_IN_NEEDED`; a repeat
  // gets `CAUSE_ACCOUNT_GONE`. It carries no idempotency key: it repeats by the account's state.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // The part of a profile's export that `api` holds, by an action of an adult with the right
  // `can_manage`, with no fresh sign-in, and at a profile whose learner gave their own consent, by
  // the learner's learning request with the right `can_learn` too (R136). `app` makes the file of
  // the export of it and of what the device holds. Refusals: `CAUSE_NO_PROFILE` and
  // `CAUSE_ADULT_NEEDED`.
  rpc ExportProfile(ExportProfileRequest) returns (ExportProfileResponse);
  // The part of the account's export that `api` holds: the fields of the account and the parts of
  // every profile, with no fresh sign-in.
  rpc ExportAccount(ExportAccountRequest) returns (ExportAccountResponse);
  // Checks a key of the owner's at its provider, when it is connected, by a request with nothing of
  // a learner's: on the page where the key is entered, an action of an adult with the right
  // `can_manage` on the owner's profile of the age category `adult` (R84). A provider that gave no
  // answer is an outcome. Refusals: `CAUSE_NO_PROFILE` and `CAUSE_KEY_NOT_FOR_PROFILE`.
  rpc CheckOwnKey(CheckOwnKeyRequest) returns (CheckOwnKeyResponse);
  // The providers that the admission function opens to an own key at a profile, so that `app`
  // builds no list in: empty at a profile whose age category is not `adult`. An action of an adult
  // with the right `can_manage`. Refusals: `CAUSE_NO_PROFILE`.
  rpc ListOwnKeyProviders(ListOwnKeyProvidersRequest) returns (ListOwnKeyProvidersResponse);
  // The share of the family day's quota of platform AI that a profile has spent, never a sum in
  // dollars: a learning action with the right `can_learn` gets the share of its own profile alone,
  // where the learner begins their work, and an action of an adult with the right `can_view` the
  // account's share too, in the section for adults, so that a child never sees what the family
  // spends (concepts 14; R11 api). Beside either, whether a cap is reached and when the next family
  // day begins. The own key spends none of it. A learning request of a profile whose consent is not
  // confirmed gets `CAUSE_NO_CONSENT`, and one of a profile whose age is to be given again
  // `CAUSE_AGE_NEEDED`. Refusals: `CAUSE_NO_PROFILE`. It carries no idempotency key: it repeats
  // by the state of the quota.
  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);
}

// A request for the account: the user is the token's.
message GetAccountRequest {}

// The account.
message GetAccountResponse {
  // The account, its profiles and its consents that have no profile yet.
  Account account = 1;
}

// The creation of an account.
message CreateAccountRequest {
  // The invite code, as it was given.
  string invite_code = 1;
  // The owner's statement that they are 18 or older: true, or the request is refused
  // `invalid_argument`. `api` keeps it with its date (privacy 9, П-6).
  bool adult_stated = 2;
  // The versions of `privacy-policy` and `terms-of-use` that the owner accepted, as
  // `GetLegalTexts` gave them: each of the two that has a current version, and no other text.
  repeated LegalTextRef accepted_texts = 3;
}

// The account created.
message CreateAccountResponse {
  // The account, with no profile.
  Account account = 1;
}

// An account of `api`, by the token of its user.
message Account {
  // The ID of the account in `api`: not the user's ID at the sign-in service, which another way of
  // signing in would change. The registry of the device holds it, and another ID after a sign-in
  // is another account.
  string account_id = 1;
  // Whether the PIN of the section for adults is set.
  bool pin_set = 2;
  // The account's profiles: the owner's, when the owner learns, and the children's.
  repeated Profile profiles = 3;
  // The consents for a child that have no profile yet: waiting, or confirmed and waiting for the
  // profile. A consent taken back or withdrawn is not here: nothing of it is left but the minimal
  // record, which names no account (R117).
  repeated ChildConsent child_consents = 4;
}

// A profile, a learner in the account (concepts 13), as `api` keeps it, with its open attempt and
// its open lesson runs. Its date of the age given and its last activity stay in `api`; its
// interests come only once the module format gives a task a look by interests (concepts 13; R51).
message Profile {
  // The ID of the profile.
  string profile_id = 1;
  // Whether this is the profile of the account's owner.
  bool owner = 2;
  // The pseudonym the owner made up for the learner: never a real name.
  string pseudonym = 3;
  // The code of a picture of the set of `app`: no picture is uploaded. Empty when none was chosen;
  // a code its build does not know `app` shows as its own picture.
  string avatar = 4;
  // The age category, by its code: "under_13", "from_13_to_consent", "from_consent_to_18" or
  // "adult" (R46).
  string age_category = 5;
  // The learner's country, ISO 3166-1 alpha-2.
  string country = 6;
  // How the platform speaks and shows: what of it changes the words goes to AI, and nothing else.
  PresentationStyle presentation_style = 7;
  // The default mode, which the learner switches on the screen of a task until the end of the
  // attempt. It goes to no AI.
  Mode default_mode = 8;
  // The language of the interface, a tag of BCP 47: absent when none is set, and then `app` speaks
  // the language of the device. It goes to no AI (R92).
  optional string interface_language = 9;
  // The grade, from 1 to 12, as a module with grades asks for it (R49): absent when none is given.
  optional int32 grade = 10;
  // A child's setting, which an adult sets: the solution is shown by an action of an adult.
  // Always false on a profile of the category `adult`.
  bool ask_before_showing = 11;
  // The profile's open attempt: absent when it has none. A profile has one open attempt at most.
  OpenAttemptRef open_attempt = 12;
  // The profile's open lesson runs, one at most for each lesson.
  repeated LessonRunRef open_lesson_runs = 13;
  // Whose consent the profile learns by, and what it waits for before its next work.
  ProfileConsent consent = 14;
  // Whether a year has passed since the age was given: `app` asks the adult for the age again,
  // `RestateAge`, and until then the category stays as it is (privacy 3.3).
  bool age_check_due = 15;
  // Whether the storage of the profile's works on the server is on (R113).
  bool work_storage = 16;
}

// The consent of a profile.
message ProfileConsent {
  // Who gave it.
  ConsentGiver giver = 1;
  // What the profile waits for before its next work: `CONSENT_NEED_NONE` when it learns.
  ConsentNeed need = 2;
  // Beside `CONSENT_NEED_PARENT`: the parent's consent that the profile waits for, with the code
  // of its request.
  ChildConsent waiting = 3;
}

// Who gave a consent. A giver its build does not know `app` reads as a parent.
enum ConsentGiver {
  // Not named: never sent.
  CONSENT_GIVER_UNSPECIFIED = 0;
  // The owner of the account, of their own profile, by the statement that they are 18 or older.
  CONSENT_GIVER_OWNER = 1;
  // A parent, by the signed form (R116).
  CONSENT_GIVER_PARENT = 2;
  // The learner themselves, from the age of digital consent of their country (R116; R134).
  CONSENT_GIVER_LEARNER = 3;
}

// What a profile waits for before its next work. A need its build does not know `app` reads as a
// profile that may not learn now, and says so.
enum ConsentNeed {
  // Not named: never sent.
  CONSENT_NEED_UNSPECIFIED = 0;
  // Nothing: the profile learns.
  CONSENT_NEED_NONE = 1;
  // The learner's own consent, `GiveOwnConsent`.
  CONSENT_NEED_OWN = 2;
  // A parent's consent, by a signed form for the code of the request.
  CONSENT_NEED_PARENT = 3;
  // The age given again, `RestateAge`: the country raised its age of digital consent.
  CONSENT_NEED_AGE = 4;
}

// The presentation style of a profile. What else it holds comes with what a module may say of it
// (product 13, О-23).
message PresentationStyle {
  // The voicing: the tutor's words and the open texts of a module read aloud by the device. It
  // goes to no AI.
  Voicing voicing = 1;
}

// The voicing of a profile. The voice is chosen on the device, and the contract carries none.
message Voicing {
  // Whether it is on. In a request, absent leaves it as it is, and a new profile's takes the
  // default of its category.
  optional bool enabled = 1;
  // Its speed. In a request, `VOICING_SPEED_UNSPECIFIED` leaves the speed as it is, and a new
  // profile's is normal.
  VoicingSpeed speed = 2;
}

// The speed of the voicing. A speed its build does not know `app` reads as normal.
enum VoicingSpeed {
  // Not named: in a request, the speed stays as it is.
  VOICING_SPEED_UNSPECIFIED = 0;
  // Normal.
  VOICING_SPEED_NORMAL = 1;
  // Slow.
  VOICING_SPEED_SLOW = 2;
}

// A mode of the screen of a task (concepts 10). A mode its build does not know `app` reads as "by
// steps".
enum Mode {
  // Not named: in a request, the mode stays as it is, and a new profile's is "by steps".
  MODE_UNSPECIFIED = 0;
  // "By steps": the app leads through the module's solving steps.
  MODE_BY_STEPS = 1;
  // "Self": the app waits until the learner calls.
  MODE_SELF = 2;
}

// The settings of a profile that an adult sets, when a profile is created or changed. A field sent
// is set; a field left out stays as it is, and on a new profile takes its default: the mode "by
// steps", the voicing on at the category `under_13` and off at the others, at normal speed, and on
// a child's profile "ask before showing" on. `app` sends only what changed, so it never writes back
// a value its build does not know. A field whose form the contract refuses gets the code
// `invalid_argument`.
message ProfileSettings {
  // The pseudonym: from 1 to 30 Unicode code points once the spaces at its ends are trimmed.
  // Needed when a profile is created.
  optional string pseudonym = 1;
  // The code of a picture of the set of `app`, up to 64 ASCII characters; empty clears it.
  optional string avatar = 2;
  // The voicing.
  Voicing voicing = 3;
  // The default mode: `MODE_UNSPECIFIED` leaves it as it is.
  Mode default_mode = 4;
  // The language of the interface, a well-formed tag of BCP 47, which `api` keeps with no list of
  // its own (R92); empty clears it. On a new profile `app` sends the language of the section for
  // adults.
  optional string interface_language = 5;
  // The grade, from 1 to 12; 0 clears it.
  optional int32 grade = 6;
  // "Ask before showing" the solution: a child's alone, and on a profile of the category `adult`
  // the request is refused `invalid_argument`.
  optional bool ask_before_showing = 7;
}

// A consent for a child: what `api` records before the child's profile exists.
message ChildConsent {
  // The ID of the consent, by which the child's profile is created.
  string consent_id = 1;
  // The age category that `api` worked out of the age and the country, by its code.
  string age_category = 2;
  // The child's country, ISO 3166-1 alpha-2.
  string country = 3;
  // Where the consent stands.
  ConsentState state = 4;
  // Who gives it: a parent, or the learner themselves in their profile.
  ConsentGiver giver = 5;
  // The code of the request, which the parent writes on the signed form and the operator checks the
  // scan by: ten characters of Crockford's base32 in two groups of five, as "ABCDE-FGHJK", unique
  // among the consents that wait. Empty at a consent that the learner gives (R116).
  string request_code = 6;
  // Where the parent's form stands; `FORM_STATE_UNSPECIFIED` at a consent that the learner gives.
  FormState form = 7;
}

// Where the scan of a parent's signed form stands. A state its build does not know `app` reads as
// a form sent.
enum FormState {
  // Not named: a consent with no form.
  FORM_STATE_UNSPECIFIED = 0;
  // No form is sent yet.
  FORM_STATE_NOT_SENT = 1;
  // A form is sent: the operator checks it, or accepted it once the consent is confirmed.
  FORM_STATE_SENT = 2;
  // The operator did not accept the form — it is not legible, or does not name the code of the
  // request —, and a new one is sent.
  FORM_STATE_NOT_ACCEPTED = 3;
}

// Where a consent for a child stands. A state its build does not know `app` reads as waiting.
enum ConsentState {
  // Not named: never sent.
  CONSENT_STATE_UNSPECIFIED = 0;
  // It waits: the parent's form is not confirmed yet, or the learner has not given it yet.
  CONSENT_STATE_WAITING = 1;
  // It is confirmed, and the child's profile may be created.
  CONSENT_STATE_CONFIRMED = 2;
}

// The setting of the PIN.
message SetPinRequest {
  // The PIN: from 4 to 6 digits.
  string pin = 1;
  // The idempotency key of this action of the adult.
  string idempotency_key = 2;
}

// The PIN set.
message SetPinResponse {}

// A PIN to check.
message VerifyPinRequest {
  // The PIN: from 4 to 6 digits.
  string pin = 1;
  // The idempotency key of this action of the adult.
  string idempotency_key = 2;
}

// What a check of the PIN gave.
message VerifyPinResponse {
  // The check.
  PinCheck check = 1;
}

// The change of the PIN.
message ChangePinRequest {
  // The PIN before it: from 4 to 6 digits.
  string pin = 1;
  // The new PIN: from 4 to 6 digits.
  string new_pin = 2;
  // The idempotency key of this action of the adult.
  string idempotency_key = 3;
}

// What a change of the PIN gave.
message ChangePinResponse {
  // The check of the PIN before it: the PIN is changed when it matches.
  PinCheck check = 1;
}

// A check of a PIN, which `app` words in the language of its screen: what went wrong and what to
// do. The counter is the server's alone: one on the device would part from it.
message PinCheck {
  // Whether the PIN matches the one set.
  bool matches = 1;
  // Beside a wrong PIN: how many wrong PINs are left before the input closes; 0 when this one
  // closed it.
  int32 attempts_left = 2;
  // Beside a wrong PIN that closed the input: when it opens.
  google.protobuf.Timestamp locked_until = 3;
}

// The change of a forgotten PIN.
message ResetPinRequest {
  // The new PIN: from 4 to 6 digits.
  string new_pin = 1;
  // The idempotency key of this action of the adult.
  string idempotency_key = 2;
}

// The new PIN set.
message ResetPinResponse {}

// The creation of the owner's profile.
message CreateOwnerProfileRequest {
  // The owner's country, ISO 3166-1 alpha-2.
  string country = 1;
  // The settings of the profile: the pseudonym at least.
  ProfileSettings settings = 2;
}

// The owner's profile created.
message CreateOwnerProfileResponse {
  // The profile.
  Profile profile = 1;
}

// The first step of a child's profile: the consent asked for.
message RequestChildConsentRequest {
  // The idempotency key of this action of the owner.
  string idempotency_key = 1;
  // The child's age in years, from 0 to 17, which `api` keeps nowhere: a learner of 18 or older is
  // the owner of an account of their own. Needed: absent, the request is refused
  // `invalid_argument`.
  optional int32 age_years = 2;
  // The child's country, ISO 3166-1 alpha-2.
  string country = 3;
  // The version of `parent-consent` that `app` shows with the form, as `GetLegalTexts` gave it:
  // `app` sends it whenever the text has a current version, whoever the category makes give the
  // consent, since only `api` works it out; `api` records it with a parent's consent alone.
  LegalTextRef parent_consent_text = 4;
}

// The consent recorded.
message RequestChildConsentResponse {
  // The consent, which waits.
  ChildConsent consent = 1;
}

// The scan of a parent's signed form.
message SendConsentFormRequest {
  // The consent, a parent's that waits: of the account, or one that a profile waits for.
  string consent_id = 1;
  // The idempotency key of this action of the adult.
  string idempotency_key = 2;
  // The scan: up to 10 MiB.
  bytes form = 3;
  // Its media type: "image/jpeg", "image/png" or "application/pdf".
  string media_type = 4;
}

// The form received.
message SendConsentFormResponse {
  // The consent, with its form sent.
  ChildConsent consent = 1;
}

// A consent taken back.
message CancelChildConsentRequest {
  // The consent, which has no profile: waiting or confirmed.
  string consent_id = 1;
}

// "Taken back": nothing of the consent is left but, of one confirmed, its minimal record.
message CancelChildConsentResponse {}

// The second step: a child's profile created by its consent.
message CreateChildProfileRequest {
  // The consent, confirmed.
  string consent_id = 1;
  // The settings of the profile: the pseudonym at least.
  ProfileSettings settings = 2;
}

// The child's profile created.
message CreateChildProfileResponse {
  // The profile, of the consent's age category and country.
  Profile profile = 1;
}

// The learner's own consent.
message GiveOwnConsentRequest {
  // The learner's profile.
  string profile_id = 1;
  // The version of `teen-consent` the learner read, as `GetLegalTexts` gave it: absent while the
  // text has no current version, and needed once it has.
  LegalTextRef text = 2;
}

// The consent given.
message GiveOwnConsentResponse {
  // The profile, whose consent is the learner's.
  Profile profile = 1;
}

// The withdrawal of the learner's own consent.
message WithdrawOwnConsentRequest {
  // The learner's profile.
  string profile_id = 1;
}

// "Withdrawn": the profile and everything of it are gone.
message WithdrawOwnConsentResponse {}

// The age and the country given again.
message RestateAgeRequest {
  // The profile.
  string profile_id = 1;
  // The idempotency key of this action of the adult.
  string idempotency_key = 2;
  // The learner's age in years, from 0 to 17, which `api` keeps nowhere: needed at a child's
  // profile, and absent at the owner's.
  optional int32 age_years = 3;
  // The learner's country, ISO 3166-1 alpha-2.
  string country = 4;
  // The version of `parent-consent` that `app` shows, sent as at `RequestChildConsent` whenever the
  // text has a current version: `api` records it with a parent's consent that the new category
  // asks for.
  LegalTextRef parent_consent_text = 5;
}

// The profile with its age given again.
message RestateAgeResponse {
  // The profile, of its new category, and what its consent waits for.
  Profile profile = 1;
}

// A change of a profile's settings.
message UpdateProfileRequest {
  // The profile.
  string profile_id = 1;
  // The settings that change.
  ProfileSettings settings = 2;
}

// The profile changed.
message UpdateProfileResponse {
  // The profile.
  Profile profile = 1;
}

// The voicing set from the screen of a task.
message SetVoicingRequest {
  // The profile.
  string profile_id = 1;
  // The voicing.
  Voicing voicing = 2;
}

// The profile with its voicing.
message SetVoicingResponse {
  // The profile.
  Profile profile = 1;
}

// The storage of works switched on or off.
message SetWorkStorageRequest {
  // The profile.
  string profile_id = 1;
  // Whose action it is: `ACTION_ADULT`, or `ACTION_LEARNING` at a profile whose learner gave their
  // own consent. `ACTION_UNSPECIFIED` is refused `invalid_argument`.
  Action action = 2;
  // Whether it is on.
  bool enabled = 3;
  // Beside switching on: the version of `storage-consent` that the person read, as
  // `GetLegalTexts` gave it; absent while the text has no current version.
  LegalTextRef text = 4;
}

// The profile with its storage of works.
message SetWorkStorageResponse {
  // The profile.
  Profile profile = 1;
}

// The deletion of a profile.
message DeleteProfileRequest {
  // The profile.
  string profile_id = 1;
}

// "Deleted": the profile and everything of it are gone.
message DeleteProfileResponse {}

// The deletion of the account: the account is the token's.
message DeleteAccountRequest {}

// "Deleted": the account is gone, and what its deletion has still to do `api` finishes itself.
message DeleteAccountResponse {}

// A request for a profile's part of the export.
message ExportProfileRequest {
  // The profile.
  string profile_id = 1;
  // Whose action it is: `ACTION_ADULT`, or `ACTION_LEARNING` at a profile whose learner gave their
  // own consent. `ACTION_UNSPECIFIED` is read as `ACTION_ADULT`: a request of a build before the
  // field was there names none.
  Action action = 2;
}

// The part of a profile's export that `api` holds.
message ExportProfileResponse {
  // The part, `api.zip` of the export format — `export/` of `spec` (R135) —, which `app` puts into
  // the file of the export as it is, without reading it.
  bytes part = 1;
  // The version of the export format the part is written in: the integer of `export/VERSION`, in
  // decimal, such as "1".
  string export_format_version = 2;
}

// A request for the account's part of the export: the account is the token's.
message ExportAccountRequest {}

// The part of the account's export that `api` holds.
message ExportAccountResponse {
  // The part, `api.zip` of the export format — `export/` of `spec` (R135) —, which `app` puts into
  // the file of the export as it is, without reading it.
  bytes part = 1;
  // The version of the export format the part is written in: the integer of `export/VERSION`, in
  // decimal, such as "1".
  string export_format_version = 2;
}

// The check of an own key, when it is connected.
message CheckOwnKeyRequest {
  // The owner's profile, of the category `adult`.
  string profile_id = 1;
  // The key and its provider.
  OwnKey own_key = 2;
}

// What the check of an own key gave.
message CheckOwnKeyResponse {
  // What the provider said of the key, or that the provider is closed to it at the profile:
  // `OWN_KEY_CHECK_UNSPECIFIED` when the provider gave no answer.
  OwnKeyCheck check = 1;
  // Beside `OWN_KEY_CHECK_UNSPECIFIED`: `CAUSE_AI_FAILURE`, the provider gave no answer.
  Outcome outcome = 2;
}

// What the check of an own key gave (R84). A value its build does not know `app` words as a check
// that did not go through.
enum OwnKeyCheck {
  // No check: the provider gave no answer, and the outcome says so.
  OWN_KEY_CHECK_UNSPECIFIED = 0;
  // The key is accepted.
  OWN_KEY_CHECK_ACCEPTED = 1;
  // The key is not valid, or was revoked.
  OWN_KEY_CHECK_INVALID = 2;
  // The key is valid, but has no right to the models it is needed for.
  OWN_KEY_CHECK_NO_PERMISSION = 3;
  // The admission function does not open the provider to an own key at this profile, or the
  // admission table does not know the provider: no call went.
  OWN_KEY_CHECK_PROVIDER_CLOSED = 4;
}

// A request for the providers of an own key.
message ListOwnKeyProvidersRequest {
  // The profile.
  string profile_id = 1;
}

// The providers of an own key at a profile.
message ListOwnKeyProvidersResponse {
  // The providers open to an own key, in the order of the admission table.
  repeated OwnKeyProvider providers = 1;
}

// An AI provider open to an own key.
message OwnKeyProvider {
  // The provider's code in the admission table: "openai", "anthropic".
  string provider = 1;
  // The provider's name in the admission table, which `app` shows as it is.
  string name = 2;
}

// A request for the share of the quota of platform AI.
message GetQuotaRequest {
  // The profile.
  string profile_id = 1;
  // Whose action it is: the learner's, where the learner begins their work, or an adult's, in the
  // section for adults. `ACTION_UNSPECIFIED` is refused `invalid_argument`.
  Action action = 2;
}

// The share of the quota.
message GetQuotaResponse {
  // The share of the profile, and beside an action of an adult the account's.
  QuotaShare share = 1;
}

// The share of the family day's quota of platform AI that a profile and its account have spent: a
// share of a cap, never a sum in dollars and no cap (concepts 14; R11 api). The caps are the
// account's tariff's; the tariff itself comes with what is decided of tariffs (product 13, О-14).
message QuotaShare {
  // The share of the profile's cap that the profile's spending of the family day takes, as its calls
  // were settled, without the reserves of calls still going, so that within a day it only grows: in
  // whole percent from 0 to 100, rounded down, so that 100 is the cap reached; spending past the cap
  // is 100 too. Absent when the account's tariff has no caps: platform AI is closed to it (R11 api).
  optional int32 profile_percent = 1;
  // Beside an action of an adult: the same share of the account's cap, which every profile of the
  // account spends. Absent beside a learning action, so that a child never sees what the family
  // spends, and when the tariff has no caps.
  optional int32 account_percent = 2;
  // Whether the settled spending of the profile or of the account has reached its cap, so that no
  // request of the profile on platform AI goes until the next family day: false when the tariff has
  // no caps. Beside a learning action it tells what a refusal `CAUSE_QUOTA` of a beginning tells
  // with no call of AI, that the quota is closed to the profile, and gives no share of the account.
  bool cap_reached = 3;
  // When the next family day begins, and a new quota with it: by the day that `api` keeps with the
  // account, since the request carries no clock offset.
  google.protobuf.Timestamp next_family_day = 4;
}
