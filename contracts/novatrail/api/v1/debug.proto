syntax = "proto3";

// The debug mode in the contract between `app` and `api`: which models serve the calls of
// AI of a task from paper, past the admission list, and what each call of a model made for the
// account returned and cost, wherever it was made — a task from paper, a task of a module, an
// essay, the tutor's words, grown-up mode —, for an account with the right of the mode. A method from an account without the right answers
// `permission_denied` with no `Refusal`, and on a run with the stub of `tutor` `unimplemented`;
// `app` then shows no debug button. Its rules are those of contracts/README.md for
// the contract between `app` and `api`.
package novatrail.api.v1;

import "google/protobuf/timestamp.proto";
import "novatrail/api/v1/attempt.proto";
import "novatrail/api/v1/cause.proto";
import "novatrail/paper/v1/key.proto";

// The debug mode, from a session of an account with its right. Every method carries the token of
// the sign-in service and may get the refusals of every request with a token, which the comment of
// `AccountService` names; it needs the account of the token alone, with the right. The choice and the calls are the
// account's, in the memory of the process of `api`, and go with it: `api` writes neither to its
// log nor to its database.
service DebugService {
  // The models that can be chosen, with their prices, and the choice now.
  rpc GetDebug(GetDebugRequest) returns (GetDebugResponse);
  // Sets the models of the account's calls of a task from paper, from its next call on. A model
  // the list does not name, an effort it does not take, or thinking off where the model or the
  // effort keeps it on, get the code `invalid_argument` with no `Refusal`.
  rpc SetDebugModels(SetDebugModelsRequest) returns (SetDebugModelsResponse);
  // Gives the account's actions since the last take, each with its calls, oldest first, and
  // forgets them: every request of the account that called a model, each call with its cost and
  // what it came to.
  rpc TakeDebugCalls(TakeDebugCallsRequest) returns (TakeDebugCallsResponse);
}

// The request of the debug mode's state.
message GetDebugRequest {}

// The debug mode's state.
message GetDebugResponse {
  // The models that can be chosen: those of the adapters of `tutor` with a key on this run, in
  // the order of their prices.
  repeated DebugModel models = 1;
  // The choice now.
  DebugChoice choice = 2;
  // The models of each call of a task from paper by the admission list of `tutor`, for an adult on
  // platform AI, one for each model in the order of their attempts: what serves the call
  // with no first model. A call the list admits no model for is absent.
  repeated DebugAdmitted admitted = 3;
}

// A model the admission list gives a call.
message DebugAdmitted {
  // The call.
  DebugCallKind kind = 1;
  // Its model, with how it is called.
  DebugModelChoice model = 2;
}

// A model that can be chosen.
message DebugModel {
  // The model's ID at its provider, as `claude-haiku-5-5`.
  string id = 1;
  // The model's name, as `Haiku 5.5`.
  string name = 2;
  // The provider, as the admission table names it, as `anthropic`.
  string provider = 3;
  // The price of a million input tokens, in micro-dollars, by the prices of `tutor`.
  int64 input_micro_usd = 4;
  // The price of a million output tokens, in micro-dollars, by the prices of `tutor`.
  int64 output_micro_usd = 5;
  // The efforts it takes.
  repeated DebugEffort efforts = 6;
  // The efforts at which its thinking may be off: none for a model that always thinks.
  repeated DebugEffort thinking_off_efforts = 7;
}

// The effort of a call, as the provider names it.
enum DebugEffort {
  // Not named: `app` reads it as `medium`.
  DEBUG_EFFORT_UNSPECIFIED = 0;
  // `low`.
  DEBUG_EFFORT_LOW = 1;
  // `medium`.
  DEBUG_EFFORT_MEDIUM = 2;
  // `high`.
  DEBUG_EFFORT_HIGH = 3;
  // `xhigh`.
  DEBUG_EFFORT_XHIGH = 4;
  // `max`.
  DEBUG_EFFORT_MAX = 5;
}

// Which models serve the calls of a task from paper.
message DebugChoice {
  // The model of every call of a task from paper — the tasks found, the statement read, the Check
  // and the words of "explain differently" —, one attempt each: absent, each call has its models
  // of the admission list of `tutor`, in turn.
  DebugModelChoice first = 1;
  // Not used: the Check is one call of one model, and reads the work with no second reader. `api`
  // ignores it, and gives it absent.
  DebugModelChoice second = 2;
}

// One model chosen, with how it is called.
message DebugModelChoice {
  // The model's ID at its provider, one of `GetDebugResponse.models`.
  string model = 1;
  // The effort.
  DebugEffort effort = 2;
  // Whether the model thinks: off only at an effort of its `thinking_off_efforts`.
  bool thinking = 3;
}

// The choice to set.
message SetDebugModelsRequest {
  // The choice.
  DebugChoice choice = 1;
}

// The choice set.
message SetDebugModelsResponse {
  // The choice, as `api` holds it now.
  DebugChoice choice = 1;
}

// The request of the calls since the last take.
message TakeDebugCallsRequest {}

// The calls since the last take.
message TakeDebugCallsResponse {
  // The actions, oldest first.
  repeated DebugAction actions = 1;
}

// One request that called a model, and the calls it made.
message DebugAction {
  // Which request.
  DebugActionKind kind = 1;
  // The attempt, beside `DEBUG_ACTION_KIND_CHECK` and `DEBUG_ACTION_KIND_WORDS`.
  string attempt_id = 2;
  // When `api` took the request.
  google.protobuf.Timestamp at = 3;
  // Its calls, in the order they ended.
  repeated DebugCall calls = 4;
  // Not used: always false. The two readers of a sheet are told apart by `DebugCall.reader`.
  bool readers_differ = 5;
}

// Which request.
enum DebugActionKind {
  // Not named.
  DEBUG_ACTION_KIND_UNSPECIFIED = 0;
  // `FindTasks`.
  DEBUG_ACTION_KIND_FIND_TASKS = 1;
  // A request that reads or judges the work: `SubmitWork` of an attempt of a task from paper,
  // its one call of the Check, or of a task of a module, the reading of its sheet by each reader;
  // `SubmitEssay`, the essay read and assessed by its rubric; `ReadStatement`, the statement
  // read by "Recognise".
  DEBUG_ACTION_KIND_CHECK = 2;
  // A request for the tutor's words that calls AI, or for grown-up mode: on an attempt of a task
  // from paper `GetOpeningWords`, whose call is a Check, `ExplainDifferently`, or `AskTutor`, a
  // Check first while the attempt keeps none and then the words, `GetRungWords` calling none; on
  // an attempt of a task of a module `GetRungWords`, `ExplainDifferently` and
  // `GetCorrectAnswerWords`; on either `AskGrownUp`, the drawing.
  DEBUG_ACTION_KIND_WORDS = 3;
}

// One call of a request, of a model.
message DebugCall {
  // What the call does.
  DebugCallKind kind = 1;
  // Of the reading of a sheet of a task of a module, `DEBUG_CALL_KIND_WORK_READING`, the
  // reader's place among the models that read it: 1 the first, 2 the second of a pair. 0 for any
  // other call, the one reader of an essay among them.
  int32 reader = 2;
  // The model's ID as the provider gave it back.
  string model = 3;
  // The effort it was called with.
  DebugEffort effort = 4;
  // Whether it was called with thinking on.
  bool thinking = 5;
  // What it returned, as it returned it: the model's JSON — the Check's hidden solution and
  // answer, or what a reader read of the learner's work —, which the debug mode alone shows. Empty
  // when it returned nothing.
  string answer = 6;
  // The input tokens, without those of the cache.
  int64 input_tokens = 7;
  // The tokens written to the cache.
  int64 cache_write_tokens = 8;
  // The tokens read from the cache.
  int64 cache_read_tokens = 9;
  // The output tokens, thinking among them.
  int64 output_tokens = 10;
  // The thinking tokens.
  int64 thinking_tokens = 11;
  // How long the call took, in milliseconds.
  int64 duration_ms = 12;
  // How long until its first token, in milliseconds: 0 when none came.
  int64 first_token_ms = 13;
  // How many times the call was repeated.
  int32 retries = 14;
  // Its cost in micro-dollars, as `api` charges the quota: by the prices of `tutor`, or the worst
  // when the provider's bill is not whole.
  int64 cost_micro_usd = 15;
  // Whether the provider's bill of the call is whole.
  bool billed = 16;
  // What the call came to when it gave no answer that was read: as `Outcome` names it.
  Cause failure = 17;
  // The model's place among the attempts of its call, 1, 2 or 3: a later one is asked only when
  // the one before did not do. 1 for a model the debug mode chose, and for a call with no cascade.
  int32 attempt = 18;
}

// What a call does.
enum DebugCallKind {
  // Not named.
  DEBUG_CALL_KIND_UNSPECIFIED = 0;
  // The tasks found on the photo, `task_finding`.
  DEBUG_CALL_KIND_TASK_FINDING = 1;
  // The statement read, `statement_reading`, by "Recognise".
  DEBUG_CALL_KIND_STATEMENT_READING = 2;
  // The solver of `module-kit`, with no AI: no longer recorded, since a task from paper has no
  // key.
  DEBUG_CALL_KIND_SOLVER = 3;
  // The AI's solution for a key: no longer recorded, since the Check judges the work in one call.
  DEBUG_CALL_KIND_TASK_SOLVING = 4;
  // The work read, `handwriting_reading`: the sheet of a task of a module, by each reader, whose
  // place `DebugCall.reader` gives, and the handwriting of an essay, by its one reader. A task from
  // paper has none: its Check reads the work itself.
  DEBUG_CALL_KIND_WORK_READING = 5;
  // The tutor's words: on a task from paper those of "explain differently", a rung in other words,
  // or of an answer to the learner's question, `AskTutor`, `hint` without the work — its opening
  // question and a rung's words come from the Check's ladder —; on a task of a module those of a
  // rung, of "explain differently" and after a correct answer, with the work or without it.
  DEBUG_CALL_KIND_TUTOR_WORDS = 6;
  // The Check, `task_checking`: the work judged in one call — each task's verdict, what was read,
  // the place of each mistake, the tutor's words and the ladder of hints.
  DEBUG_CALL_KIND_TASK_CHECKING = 7;
  // The drawing of grown-up mode, `drawing`: the tutor's act on the sheet as a grown-up asks.
  DEBUG_CALL_KIND_DRAWING = 8;
  // The text of an essay assessed by the criteria of its rubric, `rubric_assessment`.
  DEBUG_CALL_KIND_ESSAY_ASSESSMENT = 9;
}

// A Check of a task from paper as the debug mode exports it, a case of the set of a task from
// paper of the eval runner of `tutor`: the pictures its calls saw, what they gave, and the truth as
// the developer says it. `app` writes it as the JSON of this message, a file a case; `tutor-eval`
// reads a folder of such files as a set, whose truth is the developer's.
message DebugCase {
  // The work as the Check sent it: the task's crop, the crop of the work and the crop of the
  // instruction, the three images the model saw.
  PaperWork work = 1;
  // Each task the crop holds, from 1 to 20, in the order of the page, as the attempt's items: the
  // work is `correct` when every task is.
  repeated DebugTask tasks = 2;
  // What the developer saw, in their words; may be empty.
  string note = 3;
  // The Check as the debug mode took it: its calls, what each returned and cost.
  DebugAction action = 4;
}

// One task of a case of the debug mode: the truth as the developer says it, and what the Check
// answered for the task's slot.
message DebugTask {
  // The task's statement as printed, at most 200 bytes, as "Recognise" read it; empty when the
  // attempt has no reading.
  string statement = 5;
  // Not used by a case of the Check, which has no key: empty.
  string formula = 1;
  // Not used by a case of the Check, which has no key: absent.
  novatrail.paper.v1.Answer key = 2;
  // The truth: the value of the answer the work holds for the task, as written; empty where the
  // work holds none.
  string read = 3;
  // The truth: the verdict the task's item should get.
  DebugOutcome outcome = 4;
  // The verdict the Check gave the task's slot, as the model wrote it: "correct", "incorrect",
  // "unreadable" or "no_answer"; empty when no Check answered.
  string check_verdict = 6;
  // What the Check read as the task's answer, as written; empty when it read none.
  string check_read = 7;
}

// The verdict a case of the debug mode should get, as the set of a task from paper names it.
enum DebugOutcome {
  // Not named: no case.
  DEBUG_OUTCOME_UNSPECIFIED = 0;
  // `correct`.
  DEBUG_OUTCOME_CORRECT = 1;
  // `not_yet`.
  DEBUG_OUTCOME_NOT_YET = 2;
  // `unreadable`.
  DEBUG_OUTCOME_UNREADABLE = 3;
  // `unchecked`: no verdict, as a Check that read nothing of a solution gives.
  DEBUG_OUTCOME_UNCHECKED = 4;
  // `so_far_correct`: no answer yet, and a solution with no error.
  DEBUG_OUTCOME_SO_FAR_CORRECT = 5;
}
