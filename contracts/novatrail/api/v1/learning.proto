syntax = "proto3";

// The way from a module to a task in the contract between `app` and `api`: the engine's choice, the
// beginning of an attempt and the open attempt, and lessons, which `api` leads by lesson runs. What
// each message means is the rule of contracts/README.md for the contract
// between `app` and `api`.
package novatrail.api.v1;

import "google/protobuf/timestamp.proto";
import "novatrail/api/v1/attempt.proto";
import "novatrail/api/v1/cause.proto";
import "novatrail/api/v1/package.proto";

// The way from a module to a task, from a learner's session: each method is a learning request,
// with the right `can_learn`. Every method carries the token of the sign-in service and may get the
// refusals of every request with a token, which the comment of `AccountService` names with what
// `app` does on each; a profile that is not the account's gets `CAUSE_NO_PROFILE`, a request of a
// profile whose consent is not confirmed `CAUSE_NO_CONSENT`, one of a profile whose age is to be
// given again `CAUSE_AGE_NEEDED`, and a request whose form the contract refuses the code
// `invalid_argument` with no `Refusal`. A profile has one open attempt of a task of a module: a new
// one closes the one before `CLOSE_REASON_LEFT`, and leaves as they are the open attempts of tasks
// from paper, which `PaperService` begins. A lesson run goes on the package it began on, and
// every attempt of its task segments too. `app` keeps the place in a lesson and the state of its
// demos by the key "lesson's full ID, package digest", beside the ID of the run: the state of
// another run under the same key it drops, and it erases the state of the lesson at every end of
// the run, in an answer or in a refusal. An engine's choice that an answer or a refusal gives goes
// by the route to AI that the request names, the own key's by `own_key_provider` or platform AI's
// without it, so that it gives nothing that `BeginAttempt` by the same route would refuse; a
// profile not of the category `adult` that names a provider gets `CAUSE_KEY_NOT_FOR_PROFILE`.
service LearningService {
  // The engine's choice of what comes next, when the learner asks for it. With a module, Solve on
  // the tile of its tasks: a task of that module alone, on its task skill when it has one, and no
  // lesson; a choice made so keeps the module, and every choice after it that an answer gives —
  // the end of an attempt of the task — keeps it too. Without one, the choice is among all the
  // modules connected and gives a lesson or a task. It closes the open attempt of a task of a
  // module `CLOSE_REASON_LEFT`, and `app` warns beforehand that the attempt cannot be gone back to.
  // The choice gives a lesson or a task, or nothing, with the outcome that says why, by the route
  // the request names; with a module, a task skill on which its pool holds no task gives nothing,
  // with no outcome. Refusals: `CAUSE_NOT_FOUND`, a module not connected or a skill named that no
  // module connected has, `CAUSE_NO_CURRENT_VERSION`, a module with no current version for the
  // learner, `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`; a
  // module solved on the sheet, or a module and a skill both named, get `invalid_argument`. A
  // repeat with the same idempotency key gets the same choice.
  rpc ChooseNext(ChooseNextRequest) returns (ChooseNextResponse);
  // Begins an attempt: by an engine's choice of a task, on a task segment of a lesson run, or the
  // same task again. It closes the open attempt of a task of a module `CLOSE_REASON_LEFT`. A choice
  // begins one attempt: once it has, another request by it gets `CAUSE_ALREADY_EXISTS`, and `app`
  // reads the open attempt of the profile; a choice of a lesson gets `invalid_argument`. An attempt
  // on a segment of a run whose package the image no longer gives ends the run
  // `RUN_END_REASON_UNCHECKED` and gets `CAUSE_RUN_ENDED`, and `app` then asks `CheckPackages`. The
  // answer is the attempt with the open view of its task, of an instance when the task is a
  // template; the seed of the attempt never goes to the device. Refusals: `CAUSE_QUOTA`,
  // `CAUSE_PLATFORM_LIMIT` and `CAUSE_NOT_ADMITTED`, when platform AI checks the task, and a lesson
  // run stays open on them; `CAUSE_NOT_SUITABLE`, `CAUSE_NO_CURRENT_VERSION`,
  // `CAUSE_PACKAGE_UNKNOWN`, `CAUSE_RUN_ENDED`, `CAUSE_SEGMENT_UNAVAILABLE`,
  // `CAUSE_ALREADY_EXISTS`, `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_NOT_FOUND`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the same attempt and its open view.
  rpc BeginAttempt(BeginAttemptRequest) returns (BeginAttemptResponse);
  // The open attempt, by which the learner goes on with it, on another device too, with a clean
  // sheet: the strokes stay on the device that wrote them, but for a work another device put by
  // `WorkService.PutWork`, which `GetWork` gives back. Refusals: `CAUSE_NOT_FOUND`,
  // `CAUSE_ATTEMPT_CLOSED` with its close reason, and `CAUSE_PACKAGE_UNKNOWN`. An attempt of a task
  // from paper gets `invalid_argument`: it has no open view, and only the device that holds its
  // page goes on with it. It repeats by the state of the attempt.
  rpc GetOpenAttempt(GetOpenAttemptRequest) returns (GetOpenAttemptResponse);
  // Opens a lesson: of an engine's choice, or the one the learner chose on the lessons of its
  // module, by its full ID. It gives the open run of the lesson, when the profile has one, or else a
  // new run on the package of the module's current version; a lesson the learner chose opens with
  // a choice of its own, `REASON_CODE_LESSON_CHOSEN`, which the run names. A choice opens one run:
  // once it has ended, the choice gets `CAUSE_RUN_ENDED`, and a new run takes a new choice, or the
  // lesson by its ID again; a lesson passed opens a new run. Before the
  // answer `api` checks that the module is connected and has a current version for the learner,
  // and that the lesson and each of its tasks suit the age category of the profile — on the
  // package of the run when it is open; a run that fails ends `RUN_END_REASON_NOT_SUITABLE`, and
  // a run whose package the image no longer gives `RUN_END_REASON_UNCHECKED`, after which `app`
  // asks `CheckPackages`. A choice of a task, or a request that names both a choice and a lesson
  // or neither, gets `invalid_argument`. Refusals: `CAUSE_NOT_SUITABLE`,
  // `CAUSE_NO_CURRENT_VERSION`, `CAUSE_PACKAGE_UNKNOWN`, `CAUSE_RUN_ENDED`,
  // `CAUSE_KEY_NOT_FOR_PROFILE` and `CAUSE_NOT_FOUND`; a lesson by its ID with no open run that
  // the current version does not have gets `CAUSE_NO_CURRENT_VERSION`, as a new run of it would.
  // It carries no idempotency key: it repeats by the state of the run.
  rpc OpenLesson(OpenLessonRequest) returns (OpenLessonResponse);
  // The lessons of a connected module, for its tile and its page of lessons: those of its current
  // version that suit the learner whole, in the author's order, each with its state, and the
  // lesson the tile shows. It reads and writes nothing else: no run changes, none ends, and no
  // choice is made. Refusals: `CAUSE_NOT_FOUND`, a module not connected, and
  // `CAUSE_NO_CURRENT_VERSION`; a module solved on the sheet gets `invalid_argument`. It repeats
  // by the state of the profile.
  rpc ListLessons(ListLessonsRequest) returns (ListLessonsResponse);
  // An open lesson run again, by its ID: after a restart, and on another device. `api` checks it as
  // `OpenLesson` does. Refusals: `CAUSE_RUN_ENDED`, with how the run ended, and the engine's choice
  // when this request ended it; `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_NOT_FOUND` and
  // `CAUSE_PACKAGE_UNKNOWN`. It repeats by the state of the run.
  rpc GetLessonRun(GetLessonRunRequest) returns (GetLessonRunResponse);
  // "Lesson done": `app` sends it when the learner presses "Continue" on the last segment, and
  // repeats it until `api` answers. It ends the run `RUN_END_REASON_PASSED` once every task segment
  // has ended, and the answer holds the engine's choice; a repeat on a run that ended so gets the
  // same answer. Refusals: `CAUSE_SEGMENTS_NOT_ENDED`, with the places of the task segments that
  // have ended, `CAUSE_RUN_ENDED` with another reason, `CAUSE_KEY_NOT_FOR_PROFILE` and
  // `CAUSE_NOT_FOUND`. It carries no idempotency key: it repeats by the state of the run.
  rpc CompleteLesson(CompleteLessonRequest) returns (CompleteLessonResponse);
}

// A request for the engine's choice.
message ChooseNextRequest {
  // The profile.
  string profile_id = 1;
  // The idempotency key of this action of the learner.
  string idempotency_key = 2;
  // The full ID of a skill, "novatrail/olympiad-math/skill/counting-gaps", for a choice among all
  // the modules on it: empty when the engine leads. `app` sends none: the skill the learner chose
  // is the task skill of its module, `ModuleService.SetTaskSkill`, which a choice with the module
  // reads.
  string skill = 3;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that `api` judges the
  // engine's pool, and a choice of nothing, by that route, as `BeginAttempt` by the same route
  // would begin a task, though the request calls no AI. Empty on platform AI.
  string own_key_provider = 4;
  // The module whose tasks alone the choice is among, by its ID: Solve on the tile of its tasks.
  // Empty for a choice among all the modules connected.
  string module_id = 5;
}

// The engine's choice.
message ChooseNextResponse {
  // The choice.
  EngineChoice choice = 1;
}

// The beginning of an attempt.
message BeginAttemptRequest {
  // The profile.
  string profile_id = 1;
  // The idempotency key of this action of the learner.
  string idempotency_key = 2;
  // What the attempt begins by.
  oneof start {
    // An engine's choice of a task, `CHOICE_KIND_TASK`: the task, on the current version of its
    // module.
    string choice_id = 3;
    // A task segment of an open lesson run, on the run's package: every task segment before it has
    // ended, and it has not.
    SegmentPlace segment = 4;
    // The same task again, outside a lesson, on the current version of its module: the ID of an
    // earlier attempt of it, open or closed. A template gives a new seed, and maybe another
    // instance.
    string previous_attempt_id = 5;
  }
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the task by its own key, so that `api` chooses the
  // route to AI for the checks of the beginning, and checks no quota; an engine's choice that a
  // refusal `CAUSE_RUN_ENDED` gives goes by the same route. Empty when platform AI checks it. Each
  // later request on the attempt that calls AI goes by the `own_key` it carries, or on platform AI
  // without one, and meets the quota there as an outcome.
  string own_key_provider = 6;
}

// The attempt begun.
message BeginAttemptResponse {
  // The attempt.
  AttemptStart attempt = 1;
}

// A task segment of a lesson run.
message SegmentPlace {
  // The lesson run.
  string lesson_run_id = 1;
  // The segment's place among the segments of the lesson, from 1: a segment has no ID.
  int32 segment = 2;
}

// An attempt as it begins: what `app` shows the task by.
message AttemptStart {
  // The ID of the attempt.
  string attempt_id = 1;
  // The open view of the task, of the instance when the task is a template.
  OpenView task = 2;
  // The digest of the package the attempt goes on, by which `app` takes the open views of its
  // manifest and technique catalog.
  string package_digest = 3;
  // The task segment, when the attempt is one of a lesson run; absent outside a lesson.
  SegmentPlace segment = 4;
}

// A request for the open attempt.
message GetOpenAttemptRequest {
  // The profile.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
}

// The open attempt.
message GetOpenAttemptResponse {
  // The attempt.
  OpenAttempt attempt = 1;
}

// An open attempt, as the server keeps it: what lets the learner go on with it.
message OpenAttempt {
  // The attempt, as it began.
  AttemptStart start = 1;
  // The verdict of every item at the last submission with a verdict, in the task's order, and what
  // was read: empty before the first one, and on a task with a rubric.
  repeated ItemVerdict items = 2;
  // How many wrong answers the attempt has.
  int32 wrong_answers = 3;
  // The current rung and the words the attempt keeps for it, or its fallback text: absent before
  // the first wrong answer.
  RungHint rung = 4;
  // Whether "explain differently" was asked for on the current rung.
  bool explained_differently = 5;
  // No longer used: no screen leads a task's solving steps, so no step gives a technique. `api`
  // gives it empty.
  repeated string step_technique_ids = 6;
  // The IDs of the techniques given on request.
  repeated string requested_technique_ids = 7;
  // On a task with a rubric: each submission, in order, with how it ended and when, without the
  // text read and the words of the feedback, which are nowhere on the server.
  repeated EssaySubmission essay_submissions = 8;
  // The task's leading question as a hint asked for gave it, with the techniques, before the first
  // wrong answer or on a task with a rubric: empty when none was given, and when the task has none.
  // It is a closed field of the module format, so the open view of the task does not hold it, and
  // a device that goes on with the attempt shows it from here.
  string requested_leading_question = 9;
}

// A submission of an essay as the server keeps it.
message EssaySubmission {
  // When it came.
  google.protobuf.Timestamp submitted_at = 1;
  // How it ended.
  SubmissionEnd end = 2;
}

// The opening of a lesson: of an engine's choice, or by its full ID.
message OpenLessonRequest {
  // The profile.
  string profile_id = 1;
  // The engine's choice of the lesson, `CHOICE_KIND_LESSON`: empty beside `lesson`.
  string choice_id = 2;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that an engine's choice
  // that a refusal `CAUSE_RUN_ENDED` gives goes by that route, though the request calls no AI.
  // Empty on platform AI.
  string own_key_provider = 3;
  // The full ID of the lesson the learner chose, "novatrail/olympiad-math/lesson/counting-gaps-1":
  // empty beside `choice_id`.
  string lesson = 4;
}

// The lesson opened.
message OpenLessonResponse {
  // The lesson run.
  LessonRun run = 1;
}

// A request for the lessons of a module.
message ListLessonsRequest {
  // The profile.
  string profile_id = 1;
  // The module's ID.
  string module_id = 2;
}

// The lessons of a module.
message ListLessonsResponse {
  // The lessons, in the author's order: by the skill graph, a lesson after those whose skills its
  // own need, then by tier and by ID. The lesson of an open run that the current version does not
  // list, or that no longer suits the learner, comes after them, each in a group of its own, by
  // the run's package: its run goes on, as every run does on the package it began on.
  repeated ModuleLesson lessons = 1;
  // The full ID of the lesson the tile shows, one of `lessons`: the lesson of an open run, the
  // one begun last when there are several; else the first in the order that is not passed; else
  // the first. Empty when `lessons` is.
  string tile_lesson = 2;
}

// A lesson of a module, as its page of lessons lists it.
message ModuleLesson {
  // The full ID of the lesson.
  string lesson = 1;
  // What the lesson is called, in the module's explanation language.
  string title = 2;
  // How many segments the lesson has: on the package of its open run when it has one, else on the
  // current version.
  int32 segments = 3;
  // The place of its group in the order, from 0: the lessons of one group have no order between
  // them by the skill graph, and the page shows a group of more than one "in any order".
  int32 group = 4;
  // Its state for the profile.
  LessonState state = 5;
  // The places of the task segments of its open run that have ended, in order: beside
  // `LESSON_STATE_OPEN` alone.
  repeated int32 ended_segments = 6;
}

// The state of a lesson for a profile. A state its build does not know `app` reads as
// `LESSON_STATE_NEW`.
enum LessonState {
  // Not named: never sent.
  LESSON_STATE_UNSPECIFIED = 0;
  // New: no run of it is open, and none ended passed.
  LESSON_STATE_NEW = 1;
  // Open: a run of it is open.
  LESSON_STATE_OPEN = 2;
  // Passed: a run of it ended `RUN_END_REASON_PASSED`, on any version, and none is open.
  LESSON_STATE_PASSED = 3;
}

// A request for an open lesson run.
message GetLessonRunRequest {
  // The profile.
  string profile_id = 1;
  // The lesson run.
  string lesson_run_id = 2;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that an engine's choice
  // that a refusal `CAUSE_RUN_ENDED` gives goes by that route, though the request calls no AI.
  // Empty on platform AI.
  string own_key_provider = 3;
}

// The open lesson run.
message GetLessonRunResponse {
  // The lesson run.
  LessonRun run = 1;
}

// An open lesson run: what `app` leads the lesson by.
message LessonRun {
  // The ID of the run, which every answer about the lesson, an attempt of its segment, and "lesson
  // done" name.
  string lesson_run_id = 1;
  // The open view of the lesson, whole: its title and its segments, without its skills and age
  // categories.
  OpenView lesson = 2;
  // The digest of the package the run goes on.
  string package_digest = 3;
  // The places of the task segments that have ended, in order.
  repeated int32 ended_segments = 4;
  // The open attempt of a segment of the run, when there is one: `app` opens the lesson at the
  // later of it and the place it keeps.
  OpenAttemptRef open_attempt = 5;
}

// "Lesson done".
message CompleteLessonRequest {
  // The profile.
  string profile_id = 1;
  // The lesson run.
  string lesson_run_id = 2;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that the engine's choice
  // that the end of the run gives goes by that route, though the request calls no AI. Empty on
  // platform AI.
  string own_key_provider = 3;
}

// The lesson run ended "passed".
message CompleteLessonResponse {
  // How the run ended, `RUN_END_REASON_PASSED`, and the engine's choice.
  RunEnd end = 1;
}

// The open attempt of a profile, as the list of profiles names it.
message OpenAttemptRef {
  // The attempt, which `GetOpenAttempt` gives.
  string attempt_id = 1;
  // Its task segment, when it is an attempt of a lesson run; absent outside a lesson.
  SegmentPlace segment = 2;
}

// An open lesson run of a profile, as the list of profiles names it: what a device that keeps no
// state of the lesson finds it by.
message LessonRunRef {
  // The lesson run, which `GetLessonRun` gives.
  string lesson_run_id = 1;
  // The full ID of the lesson, "novatrail/olympiad-math/lesson/counting-gaps-1".
  string lesson = 2;
  // The digest of the package the run goes on.
  string package_digest = 3;
}
