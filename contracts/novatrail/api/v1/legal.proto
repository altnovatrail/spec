syntax = "proto3";

// The legal texts in the contract between `app` and `api`: the privacy policy, the terms of use
// and the consents that `app` shows as its own pages, each in its current version and its next
// one, with its gist in the language of the screen. The texts are those of the legal part,
// `legal/` of `spec`, or of a self-hosted copy's operator. What each message means is the rule of contracts/README.md,
// section 15.
package novatrail.api.v1;

// The legal texts that `app` shows (R130). The method goes without a token and without the ID of a
// profile, by Connect GET: the policy is read before signing in. It has the idempotency level
// `NO_SIDE_EFFECTS`, and `app` calls it with no header — no `Connect-Timeout-Ms` either, which
// would make the request not simple and send a preflight before it. It has no refusal of its own:
// a tag that is not a well-formed tag of BCP 47 gets `invalid_argument` with no `Refusal`.
service LegalService {
  // The current version of every text whose place is `app`, and its next version, each with its
  // body in English, its gist in the language asked when the passport has it, else in English, and
  // its translation into the language asked when the version has one.
  rpc GetLegalTexts(GetLegalTextsRequest) returns (GetLegalTextsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A request for the legal texts.
message GetLegalTextsRequest {
  // The language of the screen that shows the texts, a well-formed tag of BCP 47, a field of the
  // message and not the header `Accept-Language` (R92): the language the gists and the
  // translations come in. Empty asks for English.
  string interface_language = 1;
}

// The legal texts.
message GetLegalTextsResponse {
  // The current version of every text whose place is `app`, in the order of their IDs by code
  // units: its version in force with the highest number whose day has come, on the day of the
  // request in UTC. A text with no such version has none, and is absent: the list is empty while no
  // such text applies.
  repeated LegalText texts = 1;
  // The next version of every text whose place is `app` that has one, in the same order: the
  // version that becomes current on the nearest day still to come, its version in force with the
  // highest number among those of that day. `app` shows it before it
  // applies, as the version that will apply from its day (R130). No request names it in a
  // consent: a consent names the current version.
  repeated LegalText next_texts = 2;
}

// A legal text in a version in force: its current version or its next one.
message LegalText {
  // The ID of the text in the passport: lower-case Latin letters and digits in words joined by
  // hyphens, such as "privacy-policy".
  string id = 1;
  // The number of the version, from 1 on.
  int32 version = 2;
  // The day from which the version applies, `YYYY-MM-DD`, from 00:00 UTC: the day the author
  // approved it, or a later day, which comes with the version so that `app` shows it ahead.
  string in_force_since = 3;
  // The text of the version, in English, the one in force: Markdown, CommonMark with the tables of
  // GitHub's flavour, that begins with a heading of the first level, the text's title, and holds no
  // HTML, no image and no link.
  string body = 4;
  // The gist of the version, plain text with no Markdown, of at most 1000 characters: in the
  // language asked when the passport has it, found as the lookup of RFC 4647 finds it — the tag,
  // then the tag cut by its last subtag, with no regard to case — and else in English.
  string summary = 5;
  // The language the gist is in, its tag as the passport writes it, such as "en" or "ru".
  string summary_language = 6;
  // The translation of the version into the language asked, found as the gist is, when the version
  // has one (R141): Markdown as the body is, with no force of its own — the body in English is the
  // one in force, and a consent names the version, never its translation. Empty when the version
  // has no translation into that language, and when English is asked.
  string translation = 7;
  // The language the translation is in, its tag as the passport writes it, such as "ru"; empty when
  // there is no translation.
  string translation_language = 8;
}

// A version of a legal text that a person saw, which a request that gives a consent names and the
// record of the consent keeps (R130; R136): the current version that `GetLegalTexts` gave. A text
// with no version in force is named by no request, and a version that is not the current one gets
// `CAUSE_TEXT_NOT_CURRENT`.
message LegalTextRef {
  // The ID of the text in the passport, such as "parent-consent".
  string id = 1;
  // The number of the version, from 1 on.
  int32 version = 2;
}
