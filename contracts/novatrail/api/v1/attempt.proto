syntax = "proto3";

// The checking of an attempt in the contract between `app` and `api`: the submission of the work
// and the verdict, the tutor's words and marks, hints, the solution shown, and "Done" on a task
// with a rubric — of a task of a module, and of a task from the learner's paper, whose attempts
// `PaperService` begins. What each message means, what never reaches the device, and what a repeat
// with the same idempotency key answers are the rules of contracts/README.md for
// the contract between `app` and `api`.
package novatrail.api.v1;

import "google/protobuf/timestamp.proto";
import "novatrail/api/v1/cause.proto";
import "novatrail/observation/v1/observation.proto";

// The requests on an attempt of a task, as a learner and an adult act on it. Every method names
// the profile and the attempt; one of another profile, or none, gets `CAUSE_NOT_FOUND`, and a
// profile that is not the account's `CAUSE_NO_PROFILE`. A request whose form the contract refuses
// — a field it needs left out, a place the task does not have, a method the task's kind does not
// take — gets the code `invalid_argument` with no `Refusal`. Every method carries the token of the
// sign-in service and may get the refusals of every request with a token, which the comment of
// `AccountService` names with what `app` does on each; a request of a profile whose consent is not
// confirmed gets `CAUSE_NO_CONSENT`, and one of a profile whose age is to be given again
// `CAUSE_AGE_NEEDED`. An answer that closes the attempt by a correct answer, by the
// solution shown or by "Done" says what comes next, `next`: an attempt begins by
// `LearningService`. The engine's choice in `next` goes by the route to AI that the request
// names, the own key's by the provider of its `own_key` or by its `own_key_provider`, or platform
// AI's without either, as `ChooseNext` judges it. An attempt of a task from paper
// has an item with one answer slot for each task its crop holds, from 1 to 20, no `next`,
// no key and nothing to show: a model judges its work, one call of AI, the Check, the capability
// `task_checking`, and `api` keeps the Check's answer while the attempt is open, the model's own
// solution and answer among it, which never reach the device.
service AttemptService {
  // Sends the work of a task with a verdict for checking: the handwriting, the options tapped, or
  // both. The answer is the verdict of every item and answer slot, on the whole observation, and
  // what was read. On a task from paper each submission is one Check, which sends the work to the
  // model and gives each task's verdict as the model judged it, at the box of what it read, and the
  // tutor's words, `tutor_words`; it also gives the attempt its ladder of hints, which the attempt
  // keeps in place of the one before. A slot with no answer yet, a solution read and no error is
  // "so_far_correct", and counts no wrong answer. A Check in which the model read nothing of a
  // solution in any slot gets the outcome `CAUSE_NO_KEY`, and the next submission checks again.
  // Refusals:
  // `CAUSE_ATTEMPT_CLOSED`, `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and
  // `CAUSE_STILL_GOING`. A call of AI that gives no reading is no refusal: its slots get
  // "unchecked", and the answer names the outcome. A repeat with the same idempotency key gets the
  // verdicts and the reading recorded, with no AI.
  rpc SubmitWork(SubmitWorkRequest) returns (SubmitWorkResponse);
  // Sends the sheet of a task with a rubric, an essay, for its feedback: one request, reading and
  // assessment both. Refusals: `CAUSE_ATTEMPT_CLOSED`, before any call of AI,
  // `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with
  // the same idempotency key gets how the submission ended, without the text read and the words of
  // the feedback: they are nowhere on the server.
  rpc SubmitEssay(SubmitEssayRequest) returns (SubmitEssayResponse);
  // "Done" on a task with a rubric: the learner ends the attempt, which is closed
  // `CLOSE_REASON_DONE`, and the task is solved. Refusals: `CAUSE_NO_SUBMISSION`,
  // `CAUSE_ATTEMPT_CLOSED` with another close reason, and `CAUSE_KEY_NOT_FOR_PROFILE`; a repeat on
  // an attempt closed by "Done" gets the same answer. It carries no idempotency key: it repeats by
  // the attempt's state.
  rpc Done(DoneRequest) returns (DoneResponse);
  // Asks for the words of the rung that a wrong answer gave, sending the work again: the server
  // keeps no crop. On a task from paper it gives the rung of the ladder the attempt keeps, with no
  // call of AI and no work, and its marks: with "Show where", the wavy line under the box of the
  // first mistake the Check gave. Refusals: `CAUSE_NOT_CURRENT`, `CAUSE_NO_RUNG`,
  // `CAUSE_NO_MORE_WORDS`, `CAUSE_ATTEMPT_CLOSED`, `CAUSE_KEY_NOT_FOR_PROFILE`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A call of AI that gives no words is no
  // refusal: the answer holds the rung's fallback text and names the outcome. A repeat with the
  // same idempotency key, or a request for the same wrong answer, gets the words the attempt
  // keeps, with no AI and no marks.
  rpc GetRungWords(GetRungWordsRequest) returns (GetRungWordsResponse);
  // Asks for the tutor's words after a correct answer, sending the work again, on the attempt that
  // the answer has just closed. The right is one answer with words: `api` spends it when it gives
  // the words, and only then. An answer without words — a call of AI that gave none, or words that
  // failed a check — leaves it, and a request with a new idempotency key sends the work again and
  // calls AI again, bounded by the quota on platform AI and, on an own key, by its limit at its
  // provider. An answer with words that was lost has spent it: its repeat with the same
  // idempotency key gets an answer `repeated` without words, since the server keeps none.
  // Refusals: `CAUSE_NO_MORE_WORDS` once the words were given, also on an attempt that no correct
  // answer closed, and always on a task from paper, whose words after a correct answer are the
  // Check's `tutor_words`; `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and
  // `CAUSE_STILL_GOING`.
  rpc GetCorrectAnswerWords(GetCorrectAnswerWordsRequest) returns (GetCorrectAnswerWordsResponse);
  // "Explain differently": the words of the same rung in other words, one call of AI on a rung,
  // without the work, for the wrong answer it names. Refusals: `CAUSE_NOT_CURRENT`,
  // `CAUSE_ALREADY_ASKED`, `CAUSE_NO_RUNG`, `CAUSE_ATTEMPT_CLOSED`, `CAUSE_KEY_NOT_FOR_PROFILE`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`; on platform AI, `CAUSE_QUOTA`,
  // `CAUSE_PLATFORM_LIMIT` and `CAUSE_NOT_ADMITTED` too: it makes no call without the reserve of
  // the quota, and the right to it on the rung stays. A repeat with the same idempotency key gets
  // the words the attempt keeps, with no AI.
  rpc ExplainDifferently(ExplainDifferentlyRequest) returns (ExplainDifferentlyResponse);
  // "Hint", a hint the learner asks for, without the work and with no AI: before the first wrong
  // answer, and on a task with a rubric, the IDs of the task's techniques and its leading question,
  // when it has one, both empty on a task from paper, which has neither and asks
  // `GetOpeningWords` instead; after it, the words of the current rung. On a task from paper,
  // once a Check gave the attempt its ladder, it gives the current rung's words from that ladder,
  // the first rung while the attempt has no wrong answer. Refusals:
  // `CAUSE_ATTEMPT_CLOSED`. It carries no idempotency key: it repeats by the attempt's state.
  rpc GetHint(GetHintRequest) returns (GetHintResponse);
  // "Hint" on a task from paper while the attempt keeps no ladder, before its first Check: it sends
  // the work as it stands to the Check, one call of AI, and gives the first rung of the ladder the
  // Check gives, a question on how to begin the task, or the first of a frame of several. The
  // attempt keeps the Check's answer and its ladder, as after a submission, but its verdicts are
  // not shown and count no wrong answer. Refusals: `CAUSE_NOT_CURRENT` once the attempt keeps a
  // ladder, whose rung `GetHint` gives,
  // `CAUSE_ATTEMPT_CLOSED`, `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and
  // `CAUSE_STILL_GOING`; a task of a module gets `invalid_argument`. A call of AI that gives no
  // words is no refusal: the answer holds the opening question's fallback text and names the
  // outcome. The model's words the attempt keeps: a repeat with the same idempotency key, or a
  // request once it keeps them, gets them with no AI; a fallback text is not kept.
  rpc GetOpeningWords(GetOpeningWordsRequest) returns (GetOpeningWordsResponse);
  // A question of the learner's own about a task from paper, typed in the tutor's field or said
  // into it and read before Send: one call of AI, the words of a task from paper, which answers as
  // the tutor does — never with the answer or a step the learner has not written —, with the
  // tasks of the frame as the Check the attempt keeps gave them, the hints given, and the
  // conversation on the task so far as `app` holds it. The question and the conversation go to
  // the AI as data, never as instructions, and the server keeps neither, in no log and no record of
  // the key. While the attempt keeps no Check, the Check reads the work as it stands first, as
  // `GetOpeningWords` does, and the attempt keeps it with no verdict shown and no wrong answer
  // counted. Refusals: `CAUSE_ATTEMPT_CLOSED`, `CAUSE_KEY_NOT_FOR_PROFILE`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`; a task of a module, a question empty or
  // too long, gets `invalid_argument`. A call of AI that gives no words, the quota, the limit of
  // platform AI and no admission are no refusal: the answer holds the opening question's fallback
  // text and names the outcome, as do words that fail the leak check or the form check, with no
  // outcome. A repeat with the same idempotency key gets no words and `repeated`: the server keeps
  // none.
  rpc AskTutor(AskTutorRequest) returns (AskTutorResponse);
  // A request of a grown-up in grown-up mode on a task from paper, behind the grown-ups' PIN that
  // `app` asks: one call of AI, the drawing, which has none of the tutor's limits — it may give
  // the whole solution — and acts on the sheet as asked: writes on it, strikes out, circles,
  // hatches, erases. It reads the crop of the work and the strokes the crop shows, by their IDs and
  // points, the request and the conversation, all as data, never as instructions. The answer is
  // the tutor's words and its act on the sheet, whole: the strokes to write and the IDs of the
  // strokes to take off, in the crop's pixels. The server keeps neither the request, nor the
  // strokes, nor the answer, in no log and no record of the key; an attempt of a task from paper
  // gives no evidence, so the act changes no progress. Refusals: `CAUSE_ATTEMPT_CLOSED`,
  // `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`; a task of a
  // module, a request empty or too long, a stroke with too many points, gets `invalid_argument`.
  // A call of AI that gives no act, the quota, the limit of platform AI and no admission are no
  // refusal: the answer holds no words and no act, and names the outcome. A repeat with the same
  // idempotency key gets `repeated` alone: the server keeps nothing of the answer.
  rpc AskGrownUp(AskGrownUpRequest) returns (AskGrownUpResponse);
  // "Recognise" on a task from paper: the statement of each task the crop holds, as the page prints
  // it, for the learner to see it in clean print instead of the photo. It is the reading of the
  // statement, `statement_reading`, made on the learner's press, by the route of the attempt: the
  // attempt keeps the reading while it is open, and an attempt that keeps one gives its statements
  // with no AI. The Check takes none of it: the model reads the crop itself. The answer holds the
  // statements alone, never a formula. Refusals: `CAUSE_ATTEMPT_CLOSED`,
  // `CAUSE_KEY_NOT_FOR_PROFILE`, `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`; on platform
  // AI, `CAUSE_QUOTA`, `CAUSE_PLATFORM_LIMIT` and `CAUSE_NOT_ADMITTED` too: it makes no call
  // without the reserve of the quota. A task of a module gets `invalid_argument`. A call of AI that
  // gives no reading is no refusal: the answer names the outcome, holds no statement, and the next
  // press asks again.
  rpc ReadStatement(ReadStatementRequest) returns (ReadStatementResponse);
  // Begins a step of the task's solving steps whose `gives` gives techniques, in the mode "by
  // steps": the answer is the IDs of the task's techniques. "Step done" sends no request. Refusals:
  // `CAUSE_ATTEMPT_CLOSED`. It carries no idempotency key: it repeats by the attempt's state.
  rpc BeginStep(BeginStepRequest) returns (BeginStepResponse);
  // Shows the solution, by a learning action or by an action of an adult, and closes the attempt
  // `CLOSE_REASON_SOLUTION_SHOWN`; a task with a rubric and a task from paper have none to show,
  // `CAUSE_NO_SHOWING`. A learning action needs the right `can_learn`, and an action of
  // an adult `can_manage`: a request without it gets the code `permission_denied`. The PIN of the
  // section for adults is a barrier of the interface, not of the server. Refusals:
  // `CAUSE_ADULT_NEEDED`, `CAUSE_LADDER_NOT_PASSED`, by either kind of action,
  // `CAUSE_NO_SHOWING`, `CAUSE_ATTEMPT_CLOSED`, `CAUSE_KEY_NOT_FOR_PROFILE`,
  // `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency key gets
  // the solution again.
  rpc ShowSolution(ShowSolutionRequest) returns (ShowSolutionResponse);
  // Reports a problem with the tutor's words of the attempt, from the screen of the task: a
  // learning request with the right `can_learn`, on an open attempt or a closed one. Who sees it,
  // `app` decides (П-26). `api` keeps the report until the operator reviews it, within 3
  // days, and for a year after, by its own clock, and the operator follows the path of escalation.
  // Neither `CAUSE_NO_CONSENT` nor `CAUSE_AGE_NEEDED` refuses it. The report keeps
  // the words and the text as they were written, so `app` asks the person to write no name in it.
  // Refusals: `CAUSE_KEY_ALREADY_USED` and `CAUSE_STILL_GOING`. A repeat with the same idempotency
  // key gets the same report.
  rpc ReportProblem(ReportProblemRequest) returns (ReportProblemResponse);
}

// The submission of a task with a verdict.
message SubmitWorkRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The idempotency key of this action of the learner: `app` makes one for it, and sends it again
  // with every repeat of it.
  string idempotency_key = 3;
  // The handwriting for checking: absent when the task's answer slots are bound `choice` alone.
  Work work = 4;
  // The options tapped, one for each answer slot bound `choice` that the learner tapped one of, in
  // the task's order.
  repeated TappedChoice tapped_choices = 5;
  // The learner's own key and its provider: with a profile of its owner, when AI reads the work.
  // Its provider names the route of the engine's choice in `next` too.
  OwnKey own_key = 6;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 7;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, on a submission with no
  // `work`, which AI would read, and so with no `own_key`, so that the engine's choice in `next`
  // goes by that route. Empty on platform AI. A submission with it beside `work` or
  // `own_key` gets the code `invalid_argument`: there the route is that of `own_key`, or platform
  // AI's without one.
  string own_key_provider = 8;
  // On a task from paper, the language of the screens `app` shows the learner, a tag of BCP 47: the
  // tutor's words of the Check and its ladder of hints are written in it, and `app` voices them by
  // it. Empty: the profile's `interface_language`, else English. A tag that is not well-formed gets
  // the code `invalid_argument`. Not read on a task of a module.
  string words_language = 9;
}

// The verdict of a submission.
message SubmitWorkResponse {
  // Every item of the task, in the task's order, with its verdict.
  repeated ItemVerdict items = 1;
  // What the call of AI came to, when the answer slots that AI reads got "unchecked" by it: a
  // failure of AI, a quota or a limit, no admission, or a refusal of the own key. A slot bound
  // `choice` still has its verdict.
  Outcome outcome = 2;
  // How many wrong answers the attempt has, this submission's too: a wrong answer is a submission
  // with an answer slot "not_yet".
  int32 wrong_answers = 3;
  // The solved task, when every item is correct and the attempt is closed `CLOSE_REASON_CORRECT`:
  // empty on a task from paper, which has no key and shows no solution.
  SolvedTask solved = 4;
  // What comes next, beside `solved`: absent on a task from paper.
  Next next = 5;
  // On a task from paper, the tutor's words of the Check, once they passed the leak check, in the
  // language of the interface: after every verdict, a correct one too. Empty on a task of a
  // module, and when the Check gave none or came to an outcome.
  string tutor_words = 6;
}

// The submission of an essay.
message SubmitEssayRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The idempotency key of this action of the learner.
  string idempotency_key = 3;
  // The PNG of the crop of the sheet, without its `sheet_box`.
  bytes crop = 4;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 5;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 6;
}

// How a submission of an essay ended. No verdict: an item with a rubric has none.
message SubmitEssayResponse {
  // How the submission ended.
  SubmissionEnd end = 1;
  // The text read, as it is written, when the essay was read: beside the feedback, and beside
  // "unchecked" when the assessment gave none.
  optional string text = 2;
  // Why the essay could not be read, as a verdict's reason is written: "blank" or "illegible",
  // beside `SUBMISSION_END_UNREADABLE` alone, and empty beside the others. The learner writes the
  // sheet again.
  string reason = 3;
  // The words of the feedback, beside `SUBMISSION_END_FEEDBACK`: absent when they failed the leak
  // check or the rule of feedback, and then `app` shows its own phrase, "no feedback this time".
  optional string feedback = 4;
  // What the call of AI came to, beside `SUBMISSION_END_UNCHECKED`: absent when the assessment
  // assessed no criterion.
  Outcome outcome = 5;
  // Why the attempt was closed while this submission went: `CLOSE_REASON_UNSPECIFIED` when it is
  // still open. The feedback came all the same, from the memory of the request.
  CloseReason closed = 6;
  // The answer of a repeat with the same idempotency key: it holds neither the text read nor the
  // words of the feedback, which are nowhere on the server.
  bool repeated = 7;
}

// How a submission of an essay ended.
enum SubmissionEnd {
  // Not named: never sent.
  SUBMISSION_END_UNSPECIFIED = 0;
  // The essay was read and assessed by its rubric: the learner gets feedback.
  SUBMISSION_END_FEEDBACK = 1;
  // The sheet is blank, or the essay cannot be read as a whole: it does not reach the assessment.
  SUBMISSION_END_UNREADABLE = 2;
  // No check: a call of AI gave nothing, or the assessment assessed no criterion.
  SUBMISSION_END_UNCHECKED = 3;
}

// "Done" on a task with a rubric.
message DoneRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that the engine's choice
  // in `next` goes by that route, though the request calls no AI. Empty on platform AI.
  string own_key_provider = 3;
}

// What "Done" gives: the task solved.
message DoneResponse {
  // The criteria of the rubric and the solution, if the task has one.
  SolvedTask solved = 1;
  // What comes next.
  Next next = 2;
}

// A request for the words of a rung.
message GetRungWordsRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The idempotency key of this request.
  string idempotency_key = 3;
  // How many wrong answers the attempt had when the submission came that the words are asked for:
  // the `wrong_answers` of its answer.
  optional int32 wrong_answers = 4;
  // The work of that submission again: absent when the task's answer slots are bound `choice`
  // alone, and on a task from paper, whose rung comes from the ladder the attempt keeps.
  Work work = 5;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 6;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 7;
  // On a task from paper, the language of the screens `app` shows the learner, a tag of BCP 47: the
  // fallback text of a rung the Check gave no words for is in it, and `app` voices it by it. Empty:
  // the profile's `interface_language`, else English. A tag that is not well-formed gets the code
  // `invalid_argument`. Not read on a task of a module.
  string words_language = 8;
}

// The words of a rung.
message GetRungWordsResponse {
  // The rung, from 1 to 3.
  int32 rung = 1;
  // The tutor's words, whole, once they passed the leak check and the form check, or the rung's
  // fallback text.
  string words = 2;
  // The tutor's marks that the words come with, on the tutor's layer of the work sent.
  repeated Mark marks = 3;
  // Why the words are the fallback text, when a call of AI came to an outcome. Absent when the
  // model's words came, or when they failed a check.
  Outcome outcome = 4;
  // The answer of a repeat, or of a request for the same wrong answer: the words the attempt keeps,
  // without marks, which the server does not keep.
  bool repeated = 5;
}

// A request for the words after a correct answer.
message GetCorrectAnswerWordsRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt, which the correct answer has just closed.
  string attempt_id = 2;
  // The idempotency key of this request.
  string idempotency_key = 3;
  // The work of the correct submission again: absent when the task's answer slots are bound
  // `choice` alone.
  Work work = 4;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 5;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 6;
}

// The words after a correct answer.
message GetCorrectAnswerWordsResponse {
  // The tutor's words, whole, once they passed the leak check and the form check: absent when a
  // call of AI gave none, or they failed a check.
  optional string words = 1;
  // What the call of AI came to, when it gave no words.
  Outcome outcome = 2;
  // The answer of a repeat with the same idempotency key, which holds no words: the server keeps
  // none.
  bool repeated = 3;
}

// "Explain differently".
message ExplainDifferentlyRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The idempotency key of this action of the learner.
  string idempotency_key = 3;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 4;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 5;
  // How many wrong answers the attempt had when the words that the learner reads came: the
  // `wrong_answers` of the submission whose rung they are.
  optional int32 wrong_answers = 6;
  // On a task from paper, the language of the screens `app` shows the learner, a tag of BCP 47: the
  // words of the rung in other words are written in it, and `app` voices them by it. Empty: the
  // profile's `interface_language`, else English. A tag that is not well-formed gets the code
  // `invalid_argument`. Not read on a task of a module.
  string words_language = 7;
}

// The words of the same rung, in other words.
message ExplainDifferentlyResponse {
  // The tutor's words, whole, once they passed the leak check and the form check, or the rung's
  // fallback text.
  string words = 1;
  // What the call came to, when the words are not the model's: a failure of AI, a refusal of the
  // own key, or `CAUSE_NO_OTHER_WORDS` when they are the words the learner reads already.
  Outcome outcome = 2;
}

// "Hint".
message GetHintRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // On a task from paper, the language of the screens `app` shows the learner, a tag of BCP 47: the
  // fallback text of a rung the Check gave no words for is in it, and `app` voices it by it.
  // Empty: the profile's `interface_language`, else English. A tag that is not well-formed gets the
  // code `invalid_argument`. Not read on a task of a module.
  string words_language = 3;
}

// The opening question of a task from paper.
message GetOpeningWordsRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt, of a task from paper.
  string attempt_id = 2;
  // The idempotency key of this action of the learner.
  string idempotency_key = 3;
  // Not read: the task's crop goes in `work`, as `PaperWork.statement`, and this field is left
  // empty.
  bytes statement = 4;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 5;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 6;
  // The work as it stands, `paper` alone, which the Check reads as a submission's: its crop of the
  // work holds no stroke when the learner wrote none.
  Work work = 7;
  // On a task from paper, the language of the screens `app` shows the learner, a tag of BCP 47: the
  // opening question is written in it, and `app` voices it by it. Empty: the profile's
  // `interface_language`, else English. A tag that is not well-formed gets the code
  // `invalid_argument`. Not read on a task of a module.
  string words_language = 8;
}

// The tutor's opening question.
message GetOpeningWordsResponse {
  // The tutor's words, whole, once they passed the leak check and the form check, or the opening
  // question's fallback text.
  string words = 1;
  // Why the words are the fallback text, when a call of AI came to an outcome. Absent when the
  // model's words came, or when they failed a check.
  Outcome outcome = 2;
  // The answer of a repeat, or of a request once the attempt keeps the words: no AI was called.
  bool repeated = 3;
}

// A question of the learner's own about a task from paper.
message AskTutorRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt, of a task from paper.
  string attempt_id = 2;
  // The idempotency key of this question: `app` makes one for it, and sends it again with every
  // repeat of it.
  string idempotency_key = 3;
  // The question as the learner sent it: at most 500 code points, not empty, no control character
  // but a line break.
  string question = 4;
  // The conversation on the task before the question, oldest first, as `app` holds it in the
  // tab's memory: the learner's questions and the tutor's words — hints and answers —, at most 8
  // turns, each at most 1000 code points.
  repeated TutorTurn turns = 5;
  // The work as it stands, `paper` alone, as `GetOpeningWords` sends it: the Check reads it
  // while the attempt keeps no Check, and else it is not read.
  Work work = 6;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 7;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 8;
  // The language of the screens `app` shows the learner, a tag of BCP 47: the answer is written
  // in it, and `app` voices it by it. Empty: the profile's `interface_language`, else English. A
  // tag that is not well-formed gets the code `invalid_argument`.
  string words_language = 9;
}

// A turn of the conversation with the tutor on a task.
message TutorTurn {
  // Whether the learner said it; else the tutor did.
  bool learner = 1;
  // What was said.
  string text = 2;
}

// The tutor's answer to a question.
message AskTutorResponse {
  // The tutor's words, whole, once they passed the leak check and the form check, or the opening
  // question's fallback text. Empty on a repeat.
  string words = 1;
  // Why the words are the fallback text, when a call of AI came to an outcome or none was made.
  // Absent when the model's words came, or when they failed a check.
  Outcome outcome = 2;
  // The answer of a repeat with the same idempotency key, which holds no words: the server keeps
  // none.
  bool repeated = 3;
}

// A request of a grown-up in grown-up mode on a task from paper.
message AskGrownUpRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt, of a task from paper.
  string attempt_id = 2;
  // The idempotency key of this request: `app` makes one for it, and sends it again with every
  // repeat of it.
  string idempotency_key = 3;
  // The request as the grown-up sent it: at most 500 code points, not empty, no control character
  // but a line break.
  string question = 4;
  // The conversation on the task before the request, oldest first, as in `AskTutorRequest`: at
  // most 8 turns, each at most 1000 code points.
  repeated TutorTurn turns = 5;
  // The work as it stands, `paper` alone: the drawing reads its `statement`, and its `crop`, which
  // is the part of the sheet in sight, as the grown-up sees it, with room to write in — not the crop
  // of the Check, which ends at the strokes —, and may hold no stroke.
  Work work = 6;
  // The strokes the crop of the work shows, in the order of the sheet: at most 3000, each with at
  // most 128 points.
  repeated SheetStroke strokes = 7;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 8;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 9;
  // The language of the screens `app` shows, a tag of BCP 47, as in `AskTutorRequest`.
  string words_language = 10;
}

// A stroke the crop of the work shows, as data for the drawing: no time and no pressure.
message SheetStroke {
  // The stroke's ID on its sheet.
  int32 id = 1;
  // Its points across and down in pixels of the crop of the work, `PaperWork.crop`, in pairs:
  // x1, y1, x2, y2, …, as `app` thinned them to at most 128 points.
  repeated float points = 2;
}

// The tutor's answer in grown-up mode.
message AskGrownUpResponse {
  // The tutor's words about what it did, whole. Empty on a repeat, and when no act came.
  string words = 1;
  // The strokes to write, in the order to draw them.
  repeated TutorStroke strokes = 2;
  // The IDs of the strokes to take off, each one the request named.
  repeated int32 erase = 3;
  // Why no act came, when a call of AI came to an outcome or none was made. Absent when the act
  // came.
  Outcome outcome = 4;
  // The answer of a repeat with the same idempotency key, which holds nothing: the server keeps
  // nothing of the answer.
  bool repeated = 5;
}

// A stroke the tutor writes on the sheet in grown-up mode.
message TutorStroke {
  // Its points across and down in pixels of the crop of the work, in pairs: x1, y1, x2, y2, …, at
  // least two points.
  repeated float points = 1;
  // Its colour, `#rrggbb`.
  string color = 2;
  // The width of its line in pixels of the crop of the work.
  float width = 3;
}

// "Recognise" on a task from paper.
message ReadStatementRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt, of a task from paper.
  string attempt_id = 2;
  // The idempotency key of this action of the learner.
  string idempotency_key = 3;
  // The task's crop without the learner's strokes, as `PaperWork.statement`: a JPEG or a PNG of at
  // most 4 MiB.
  bytes statement = 4;
  // The learner's own key and its provider: with a profile of its owner.
  OwnKey own_key = 5;
  // The offset of the device's clock from UTC, in minutes: with a request on platform AI alone.
  optional int32 clock_offset_minutes = 6;
}

// The statements of a task from paper's crop.
message ReadStatementResponse {
  // Each task on the crop, from 1 to 20 in the order of the page, as the page prints it, at most
  // 200 bytes of UTF-8, as "□ − 3 = 7": "□" stands for each box the learner writes an answer in,
  // a fraction with a bar is LaTeX's "\frac{3}{17}", nested as printed, and a raised power "^{2}";
  // without the task's label, as "1)", or the sign that parts it from the next, as ";". Empty when
  // the reading found no task, or gave no answer.
  repeated string statements = 1;
  // What the call of AI came to, when it gave no reading: a failure of AI, or of the own key its
  // limit reached or the key refused.
  Outcome outcome = 2;
  // The answer of a request the attempt's reading answered: no AI was called.
  bool repeated = 3;
}

// What a hint asked for gives. "What is known and what to find" `app` shows from the open view of
// the task: they are open, and the server records nothing of them.
message GetHintResponse {
  // Before the first wrong answer, and on a task with a rubric, the task's techniques; after it,
  // the current rung's words.
  oneof hint {
    // The task's techniques.
    Techniques techniques = 1;
    // The current rung's words.
    RungHint rung = 2;
  }
  // With the techniques, the task's leading question, the leading_question of the module format, of
  // the instance that the attempt got: the author's question that breaks the task down, in the
  // module's explanation language. Empty when the task has none, and always empty with the rung's
  // words: after the first wrong answer it is no more given. The server records it as given only
  // when it is not empty, as it records a technique given on request.
  string leading_question = 3;
}

// The techniques of a task, which the server records as given at a step or on request.
message Techniques {
  // The IDs of the techniques, local IDs of the module's technique catalog: empty when the task
  // names none, which is the answer that there is nothing to hint.
  repeated string technique_ids = 1;
}

// A rung's words that a hint asked for gives again, with no AI.
message RungHint {
  // The rung, from 1 to 3.
  int32 rung = 1;
  // The words the attempt keeps for the rung, or the rung's fallback text.
  string words = 2;
}

// The beginning of a solving step.
message BeginStepRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The step's place among the task's solving steps, from 1.
  int32 step = 3;
}

// What the beginning of a step gives.
message BeginStepResponse {
  // The task's techniques.
  Techniques techniques = 1;
}

// A request to show the solution.
message ShowSolutionRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The idempotency key of this action.
  string idempotency_key = 3;
  // Whose action it is.
  Action action = 4;
  // The provider of the learner's own key, by its code in the admission table, without the key:
  // with a profile of its owner that checks the tasks by its own key, so that the engine's choice
  // in `next` goes by that route, though the request calls no AI. Empty on platform AI.
  string own_key_provider = 5;
}

// The solution shown.
message ShowSolutionResponse {
  // The solved task.
  SolvedTask solved = 1;
  // What comes next.
  Next next = 2;
}

// A report of a problem with the tutor's words.
message ReportProblemRequest {
  // The profile whose attempt it is.
  string profile_id = 1;
  // The attempt.
  string attempt_id = 2;
  // The idempotency key of this action.
  string idempotency_key = 3;
  // Which of the tutor's words the report is about.
  TutorReply reply = 4;
  // Beside the words of a rung and "explain differently": the rung, from 1 to 3.
  int32 rung = 5;
  // The tutor's words as `app` showed them, from 1 to 4000 Unicode code points: `api` keeps none of
  // the words of a correct answer and of the feedback of an essay, and the operator reads what
  // was said.
  string words = 6;
  // What is wrong with them, by a word of the closed set.
  ProblemKind kind = 7;
  // What the person writes beside it, up to 1000 Unicode code points; empty when nothing.
  string text = 8;
}

// The report received.
message ReportProblemResponse {
  // The ID of the report.
  string report_id = 1;
  // When the operator reviews it by: 3 days after it came.
  google.protobuf.Timestamp review_by = 2;
}

// Which of the tutor's words a report is about: the answer that brought them.
enum TutorReply {
  // Not named: the request is refused `invalid_argument`.
  TUTOR_REPLY_UNSPECIFIED = 0;
  // The words of a rung, `GetRungWords`, or the rung given by `GetHint` after a wrong answer.
  TUTOR_REPLY_RUNG = 1;
  // The words of "explain differently", `ExplainDifferently`.
  TUTOR_REPLY_EXPLAINED_DIFFERENTLY = 2;
  // The words after a correct answer, `GetCorrectAnswerWords`.
  TUTOR_REPLY_CORRECT_ANSWER = 3;
  // The feedback of an essay, `SubmitEssay`.
  TUTOR_REPLY_ESSAY_FEEDBACK = 4;
  // The opening question of a task from paper, `GetOpeningWords`.
  TUTOR_REPLY_OPENING = 5;
  // The tutor's answer to the learner's question on a task from paper, `AskTutor`.
  TUTOR_REPLY_ANSWER = 6;
}

// What is wrong with the tutor's words: the closed set the person picks one word of.
enum ProblemKind {
  // Not named: the request is refused `invalid_argument`.
  PROBLEM_KIND_UNSPECIFIED = 0;
  // Wrong: the words say what is not so.
  PROBLEM_KIND_WRONG = 1;
  // Unclear: the learner could not follow them.
  PROBLEM_KIND_UNCLEAR = 2;
  // Not for the learner's age.
  PROBLEM_KIND_NOT_FOR_AGE = 3;
  // Harmful or dangerous, or upsetting.
  PROBLEM_KIND_HARMFUL = 4;
  // The words ask for, or speak of, something personal.
  PROBLEM_KIND_PERSONAL = 5;
  // Something else, which the text says.
  PROBLEM_KIND_OTHER = 6;
}

// Whose action a request is: the server tells kinds of action apart, not people.
enum Action {
  // Not named: never sent.
  ACTION_UNSPECIFIED = 0;
  // A learning action, by the learner's session.
  ACTION_LEARNING = 1;
  // An action of an adult, behind the PIN of the section for adults.
  ACTION_ADULT = 2;
}

// The work for checking: a sheet's crop, the crops of a workbook's filled boxes, or the work of a
// task from paper. Nothing of the writing history, of the context of the submission, of the groups
// of strokes or of the text of an item goes with it. An attempt of a task from paper takes `paper`
// alone, and an attempt of a task of a module never takes it: another gets `invalid_argument`.
message Work {
  // Where the work was written.
  oneof surface {
    // A handwriting sheet.
    SheetWork sheet = 1;
    // A page of a workbook.
    WorkbookWork workbook = 2;
    // A dotted sheet under the crop of a task from paper, as tracing paper.
    PaperWork paper = 3;
  }
}

// The work of a handwriting sheet.
message SheetWork {
  // The PNG of the crop of the visible strokes, without its `sheet_box`.
  bytes crop = 1;
}

// The work of a page of a workbook.
message WorkbookWork {
  // Each filled box, in the task's order. A box left empty sends nothing, and the draft, the
  // writing outside the boxes, goes nowhere.
  repeated BoxCrop boxes = 1;
}

// The work of a task from paper: the three images of the Check — the task's crop as printed, the
// crop of what the learner wrote, and the crop of the instruction above the task. Every request
// that carries the work of a task from paper carries them all: the server keeps no crop.
message PaperWork {
  // The task's crop as `app` cut it from the photo of the page by its frame, without the learner's
  // strokes: a JPEG or a PNG of at most 4 MiB.
  bytes statement = 1;
  // The PNG of the crop of the work, without its `sheet_box`: the tracing paper at its place, with
  // the strokes on it, and the sheet's visible strokes, whether the tracing paper is shown or
  // hidden. A box of a mark is a box on this crop.
  bytes crop = 2;
  // The crop of the instruction printed above the task, as `app` cut it from the photo of the page
  // by `TaskFrame.instruction`, without the learner's strokes: a JPEG or a PNG of at most 4 MiB.
  // Empty when the finding gave the task no instruction.
  bytes instruction = 3;
}

// The crop of one filled box.
message BoxCrop {
  // The box, by its place.
  novatrail.observation.v1.AnswerSlotPlace answer_slot = 1;
  // The PNG of the crop of the box's strokes.
  bytes crop = 2;
}

// An option the learner tapped.
message TappedChoice {
  // The answer slot bound `choice`.
  novatrail.observation.v1.AnswerSlotPlace answer_slot = 1;
  // The text of the option tapped, as the open view of the task writes it.
  string value = 2;
}

// The learner's own key at its provider, which the server holds in the memory of the request alone.
message OwnKey {
  // The provider, by its code in the admission table: "openai", "anthropic".
  string provider = 1;
  // The key, as the provider gave it.
  string key = 2;
}

// The verdict of an item.
message ItemVerdict {
  // The item's verdict, made of its answer slots': "correct", "not_yet", "unreadable",
  // "unchecked" or, on a task from paper, "so_far_correct".
  string verdict = 1;
  // Every answer slot of the item, in order.
  repeated AnswerSlotVerdict answer_slots = 2;
}

// The verdict of an answer slot, and what was read in it. The trap that a value shows is not here:
// the tutor's words alone get it, in `api`.
message AnswerSlotVerdict {
  // The answer slot.
  novatrail.observation.v1.AnswerSlotPlace answer_slot = 1;
  // "correct", "not_yet", "unreadable" or "unchecked"; or, on a task from paper alone,
  // "so_far_correct": the slot has no answer yet, and the Check read a solution with no error in
  // it. It is no verdict: it counts no wrong answer, closes nothing, and `app` draws no mark for
  // it.
  string verdict = 2;
  // Why the verdict is "unreadable": "blank", "notation", "illegible", "ambiguous",
  // "no_final_answer" or "several_final_answers". Empty beside the others.
  string reason = 3;
  // What was read in the slot, as the learner sees it, "Read: 6": the value of the observation, or
  // the text of the option tapped. Absent when nothing was read.
  optional string value = 4;
  // Where on the crop the answer was read, in whole thousandths of the crop's height and width:
  // on a task from paper alone, the box of what the Check read, and only when it read something,
  // so that `app` puts the slot's verdict by the answer.
  novatrail.observation.v1.CropBox crop_box = 5;
}

// What reaches the device once the task is solved: its attempt closed by a correct answer, by the
// solution shown, or by "Done".
message SolvedTask {
  // The key of each answer slot that has one, in the task's order: a slot whose check is a
  // predicate or a rubric has none.
  repeated AnswerSlotKey keys = 1;
  // The task's solution, the value of its field `solution` as JSON of the module format, of the
  // instance when the task is a template: empty when the task has none.
  bytes solution = 2;
  // The version of the module format the solution is written in, MAJOR.MINOR.
  string module_format_version = 3;
  // The criteria of a rubric, each its text, in order: on a task with a rubric alone, without the
  // marks of the assessment.
  repeated string criteria = 4;
}

// What comes next once an attempt is closed by a correct answer, by the solution shown or by
// "Done". A repeat gets the same: of `SubmitWork` and `ShowSolution` with the same idempotency key,
// and of `Done` by the state of the attempt.
message Next {
  // In a lesson, the segment that comes next; outside a lesson, the engine's choice.
  oneof next {
    // In a lesson: the place of the next segment, from 1.
    int32 segment = 1;
    // In a lesson: no segment is left after the one that ended. The lesson run stays open until
    // "lesson done", `CompleteLesson`, which `app` sends when the learner presses "Continue".
    bool segments_ended = 2;
    // Outside a lesson: the engine's choice, by the route to AI that the request names.
    EngineChoice choice = 3;
  }
}

// The key of an answer slot.
message AnswerSlotKey {
  // The answer slot.
  novatrail.observation.v1.AnswerSlotPlace answer_slot = 1;
  // The key as the module format writes it, of the instance when the task is a template.
  string key = 2;
}

// A mark of the tutor on its layer of the canvas, over the learner's work. The program places it;
// `app` gives it its name, which a screen reader reads, and it belongs to the words that bring it.
message Mark {
  // What the mark is.
  MarkKind kind = 1;
  // Where the mark stands. A group's label comes only if the frames of the groups go with the work
  // (Т-31).
  oneof place {
    // An answer slot by its place: on a workbook, the box, framed with its strokes.
    novatrail.observation.v1.AnswerSlotPlace answer_slot = 2;
    // A box on the crop the device sent, in whole thousandths: on a handwriting sheet and on a task
    // from paper alone.
    novatrail.observation.v1.CropBox crop_box = 3;
  }
}

// What a mark is.
enum MarkKind {
  // Not named: never sent.
  MARK_KIND_UNSPECIFIED = 0;
  // A frame round the place.
  MARK_KIND_FRAME = 1;
  // A wavy line under the place of the first mistake: on a task from paper alone, at the box of the
  // first mistake the Check gave, on the crop, and only while the profile's hint mode is
  // `HINT_MODE_SHOW_WHERE`.
  MARK_KIND_WAVY_LINE = 2;
}
