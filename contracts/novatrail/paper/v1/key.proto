syntax = "proto3";

// The key of a task from paper as the solver of `module-kit` computes it, the answer a program
// compares a reading with, and where it came from; and the reading of a task's statement that
// "Recognise" gives, which `api` keeps on the attempt while it is open. A task from paper is not
// checked by a key: its verdict is the model's, by the Check of check.proto, and `api` keeps no
// key on its attempts. The messages of the key stay for the solver of `module-kit` and its test
// vectors. The formula, the solver and the verdict by a key are the rules of contracts/README.md
// for the solver of `module-kit`.
package novatrail.paper.v1;

// An answer of a task from paper: a number or an option, of the check kinds `number` and `choice`
// of the module format.
message Answer {
  // The kind of the answer and what it holds.
  oneof kind {
    // A number.
    Number number = 1;
    // An option of the ones the statement prints.
    Choice choice = 2;
  }
}

// An answer that is a number.
message Number {
  // The number, in the notation of the check kind `number`: an integer, a decimal with a point or a
  // simple fraction, at most 16 characters, such as "7", "-3", "2.5" or "3/4".
  string value = 1;
  // The words that may follow the number in the answer, as "cm" and "centimetres" in "12 cm", as
  // the `units` of the check kind `number`; none when the answer takes none.
  repeated string units = 2;
  // The letter of the unknown, such as "x", when the learner may write the answer as "x = 4"; empty
  // otherwise.
  string unknown = 3;
}

// An answer that is one of the options the statement prints.
message Choice {
  // The labels of the options as the statement prints them, without their brackets, such as "A",
  // "B", "C" and "D", in the statement's order.
  repeated string options = 1;
  // The label of the right option, one of `options`.
  string key = 2;
}

// Where a key of a task from paper came from.
enum Provenance {
  // Not given: no key has it.
  PROVENANCE_UNSPECIFIED = 0;
  // The solver of `module-kit` computed it from the formula AI read of the statement.
  PROVENANCE_SOLVER = 1;
  // AI derived it, by solving the task from its crop.
  PROVENANCE_AI = 2;
}

// The key of the tasks on a crop, as each of a column of sums framed together, each with its own
// key, as the solver of `module-kit` gives it. `api` keeps none on an attempt of a task from paper,
// which the Check judges.
message Key {
  // The tasks on the crop, from 1 to 20, in the order of the page: top to bottom, and left to
  // right in a row. The task at the place n is the item n.
  repeated TaskKey tasks = 1;
}

// One task on the crop of a task from paper, and its key.
message TaskKey {
  // The task as the page prints it, at most 200 bytes of UTF-8, as "□ − 3 = 7", a fraction and a
  // power written as in `ReadStatementResponse.statements`: the reading of the work is given it, to
  // tell which task each answer is of. It is the printed statement alone, never the learner's
  // writing.
  string statement = 1;
  // Where the key came from; not given when the task has none.
  Provenance provenance = 2;
  // The answer, or none when the task has no one answer a program can compare: its item is
  // unchecked.
  Answer answer = 3;
}

// The reading of the statement of a task from paper's crop, which `api` keeps on the attempt while
// it is open, from the learner's "Recognise", so that a later press gives it with no call of AI:
// the statements alone reach the device, never the formulas. The Check does not take it: the model
// reads the crop itself.
message Reading {
  // The tasks on the crop, from 1 to 20, in the order of the page, as the key lists them.
  repeated ReadTask tasks = 1;
}

// One task of a reading.
message ReadTask {
  // The task as the page prints it, as `TaskKey.statement`.
  string statement = 1;
  // The formula the statement holds, one line of ASCII of at most 200 bytes, as the solver of
  // `module-kit` takes it; empty when the statement holds none.
  string formula = 2;
}
