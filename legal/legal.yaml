# The passport of the legal texts (section 4 of the legal text). Every version is a draft until
# T97, T98 and T99 of RUN.md write its words and the author approves it (R112).
format: 2
texts:
  privacy-policy:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "NovaTrail collects only what it needs to teach: a pseudonym, never a name; an age category, never a date of birth; and what the learner has done and learned. The learner's work stays on the device unless the adult, or a learner who consents themselves, switches on keeping works on our server. To be checked, a picture of it goes, with no name or ID, to OpenAI or Anthropic, which reads it and words the tutor's replies. A program, not AI, decides whether an answer is right. A child has no account: the adult creates the child's profile — below the age of digital consent only after a parent's consent is checked; from that age on, the learner consents in their own profile. The data lies in the United States, with Google, Neon and the AI providers, under contracts that make them our processors. No advertising, no selling of data, no links out of the app. You can export or delete the data in one step; the policy lists what remains, and for how long. The operator is ALT EdTech LLC, in Texas."
          ru: "NovaTrail собирает только то, без чего не учит: псевдоним, а не имя; возрастную категорию, а не дату рождения; что ученик сделал и чему научился. Работа ученика остаётся на устройстве, если хранение работ на нашем сервере не включит взрослый или ученик, который сам даёт согласие. На проверку её картинка, без имени и идентификаторов, уходит поставщику ИИ — OpenAI или Anthropic, — который её читает и подбирает слова наставника. Верен ли ответ, решает программа, а не ИИ. У ребёнка нет аккаунта: профиль ребёнка заводит взрослый — ниже возраста цифрового согласия только после проверенного согласия родителя, а с этого возраста ученик соглашается сам, в своём профиле. Данные лежат в США — у Google, Neon и поставщиков ИИ, по договорам, которые делают их нашими обработчиками. Нет рекламы, продажи данных и ссылок наружу. Выгрузить и удалить данные можно в один шаг; что остаётся и на какой срок, политика называет. Оператор — ALT EdTech LLC, Техас."
      - version: 2
        status: in_force
        in_force_since: "2026-11-11"
        translations:
          - ru
        summary:
          en: "NovaTrail collects only what it needs to teach: a pseudonym, never a name; an age category, never a date of birth; and what the learner has done and learned. The learner's work stays on the device unless the adult, or a learner who consents themselves, switches on keeping works on our server. To be checked, a picture of it goes, with no name or ID, to OpenAI or Anthropic, which reads it and words the tutor's replies. A program, not AI, decides whether an answer is right. A child has no account: the adult creates the child's profile — below the age of digital consent only after a parent's consent is checked. The data lies in the United States, with our processors. No advertising, no selling of data, no training of AI on it. You can export, correct or delete the data; in the United States you can also appeal a refusal. The operator is ALT EdTech LLC, in Texas; its email is Gmail, so write no details of a child there."
          ru: "NovaTrail собирает только то, без чего не учит: псевдоним, а не имя; возрастную категорию, а не дату рождения; что ученик сделал и чему научился. Работа ученика остаётся на устройстве, если хранение работ на нашем сервере не включит взрослый или ученик, который сам даёт согласие. На проверку её картинка, без имени и идентификаторов, уходит OpenAI или Anthropic, который её читает и подбирает слова наставника. Верен ли ответ, решает программа, а не ИИ. У ребёнка нет аккаунта: профиль ребёнка заводит взрослый — ниже возраста цифрового согласия только после проверенного согласия родителя. Данные лежат в США, у наших обработчиков. Нет рекламы, продажи данных и обучения ИИ на них. Данные можно выгрузить, исправить и удалить, а в США — ещё и обжаловать отказ. Оператор — ALT EdTech LLC, Техас; его почта — Gmail, поэтому не пишите туда о ребёнке."
  terms-of-use:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "The agreement between the adult who owns a NovaTrail account and its operator, ALT EdTech LLC. You must be 18 or older, and of age to make it where you live. You may create a profile for yourself and for each child you are the parent or guardian of, a child's below the age of digital consent only after a parent's consent, and a learner from that age on consents in their own profile. Until representatives are named, no learner from the EU, the EEA or the UK is accepted. A program checks the answers; AI reads the work and words the tutor's replies, and can be wrong. For now NovaTrail is free and by invitation, and the platform's AI has a daily limit. A key of your own to an AI provider is for your own profile only, and the provider's terms are your contract with it. You can delete the account at any time; an account unused for 12 months is deleted. Texas law governs, and a dispute goes to the courts in Bexar County, Texas, unless the law where you live lets you bring it there."
          ru: "Договор взрослого, у которого аккаунт NovaTrail, с её оператором — ALT EdTech LLC. Вам должно быть 18 или больше, и по закону места, где вы живёте, вы вправе его заключить. Профиль можно завести себе и каждому ребёнку, чей вы родитель или опекун, — ребёнку ниже возраста цифрового согласия — только после согласия родителя, а ученик с этого возраста соглашается сам, в своём профиле. Пока не названы представители, учеников из ЕС, ЕЭЗ и Великобритании платформа не принимает. Ответы проверяет программа; ИИ читает работу и подбирает слова наставника и может ошибаться. Пока NovaTrail бесплатна и только по приглашению, а у ИИ платформы есть дневной предел. Свой ключ поставщика ИИ — только для вашего профиля, и условия поставщика — ваш договор с ним. Удалить аккаунт можно когда угодно; аккаунт, которым не пользовались 12 месяцев, удаляется. Договор правит право Техаса, а спор слушают суды округа Бексар, Техас, если закон места, где вы живёте, не даёт вам права подать его по месту жительства."
  storage-consent:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "You switch on keeping this learner's works, such as drawings and essays, on our server, as the device holds them, never their read text. An essay may tell something personal, about health too: you give explicit consent to our keeping it. ALT EdTech LLC keeps them on our server in the United States so that they are not lost. Nobody reads the works, and they never go to an AI provider. Switching off is one step, and it erases the copies on our server."
          ru: "Вы включаете хранение работ этого ученика — рисунков, сочинений — на нашем сервере, в том виде, в каком их держит устройство, без прочитанного текста. В сочинении может оказаться личное, в том числе о здоровье: вы даёте явное согласие на то, что мы это храним. ALT EdTech LLC хранит их на нашем сервере в США, чтобы они не пропали. Работ никто не читает, и к поставщику ИИ они не уходят. Выключить хранение можно в один шаг, и это стирает копии на сервере."
  parent-consent:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-11"
        summary:
          en: "You ask NovaTrail to let your child learn with it. ALT EdTech LLC, in Texas, is the controller. We keep a pseudonym, an avatar, the age category and country, the profile's settings and what your child has done — never a name, a date of birth or a photo — in the United States. Your child's work stays on the device; to be checked, a picture of it goes, with no name or ID, to OpenAI or Anthropic. Your child's data goes to our service providers alone, and to no one else, but where the law requires it or a life is at risk. Your child is told that the tutor is an AI, that you see their progress, and where to turn for help. You sign a form with your name and upload its scan in the app; the operator checks it before the profile is made. Write no details of your child in an email. You can withdraw in one step, in the section for adults: that deletes the profile and its data; the record of consent and the scan stay 5 years, a report of a problem a year."
          ru: "Вы просите NovaTrail разрешить вашему ребёнку учиться. Контролёр — ALT EdTech LLC, Техас. Мы храним псевдоним, аватар, возрастную категорию и страну, настройки профиля и то, что ребёнок сделал, — никогда имя, дату рождения или фото — в США. Работа ребёнка остаётся на устройстве; на проверку её картинка, без имени и идентификаторов, уходит OpenAI или Anthropic. Данные ребёнка получают только наши поставщики услуг, и больше никто, кроме случаев, когда этого требует закон или под угрозой жизнь. Ребёнку говорят, что наставник — ИИ, что вы видите его успехи и куда обратиться за помощью. Вы подписываете форму со своим именем и загружаете её скан в приложении; оператор проверяет его до того, как появится профиль. Не пишите о ребёнке в письмах. Отозвать согласие можно в один шаг, в разделе для взрослых: это удаляет профиль с данными; запись о согласии и скан остаются на 5 лет, сообщение о проблеме — на год."
  teen-consent:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-11"
        summary:
          en: "You have reached the age at which you decide about your data, so NovaTrail asks you; if a parent consented before, you confirm or withdraw it here. ALT EdTech LLC, in Texas, is the controller. We keep a pseudonym, an avatar, your age category and country, your settings and what you have done — never your name, date of birth or school — in the United States. Your work stays on your device; to be checked, a picture of it goes, with no name or ID, to OpenAI or Anthropic. The tutor is an AI, and the adult of the account sees your progress. Keeping your works on our server is your own choice, asked separately, even when the adult had switched it on; if you say no, you are not asked again for a year. You can withdraw in one step, in your profile: that deletes your profile and its data; the adult can delete it too."
          ru: "В твоём возрасте закон твоей страны даёт тебе решать о своих данных, поэтому NovaTrail спрашивает тебя; если раньше согласие дал родитель, здесь ты его подтверждаешь или отзываешь. Контролёр — ALT EdTech LLC, Техас. Мы храним псевдоним, аватар, возрастную категорию и страну, настройки и то, что пройдено в учёбе, — никогда имя, дату рождения или школу — в США. Работа остаётся на твоём устройстве; на проверку её картинка, без имени и идентификаторов, уходит OpenAI или Anthropic. Наставник — ИИ, а взрослый аккаунта видит твои успехи. Хранить ли работы на нашем сервере — решаешь ты, отдельным вопросом, даже если взрослый уже включил хранение; если откажешься, год тебя снова не спросят. Отозвать согласие можно в один шаг, в своём профиле: это удаляет профиль с данными; удалить его может и взрослый."
  child-notice:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-11"
        summary:
          en: "You write and draw your answers, and a computer program checks them. The tutor is an AI: a computer program, not a person. It gets a picture of your work, but not your name, so do not write your name, or the names of people you know, on your work. On NovaTrail you have a made-up name. We keep what you did, to give you the right next task, and your grown-up can delete it. The grown-up of your account can see how you are doing, and nobody else; if your grown-up tells us the tutor said something wrong, a person at NovaTrail reads what it said. If something makes you sad or scared, tell a grown-up you trust, or call the helpline on the \"Help\" page. If you are in danger right now, tell a grown-up near you, or call the emergency number."
          ru: "Ты пишешь и рисуешь ответы, а компьютерная программа их проверяет. Наставник — ИИ, компьютерная программа, а не человек. Он получает картинку твоей работы, но не твоё имя, поэтому не пиши на работе своё имя и имена знакомых. В NovaTrail у тебя придуманное имя. Мы храним, что ты делаешь, чтобы давать тебе подходящие задачи, а твой взрослый может это удалить. Как у тебя дела, видит взрослый твоего аккаунта, и больше никто; если взрослый скажет нам, что наставник сказал что-то не то, человек из NovaTrail прочитает, что тот сказал. Если тебе грустно или страшно, скажи взрослому, которому доверяешь, или позвони по телефону помощи со страницы «Помощь». Если тебе грозит опасность прямо сейчас, скажи взрослому рядом или позвони в экстренную службу."
  teen-notice:
    place: app
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-11"
        summary:
          en: "What you write stays on your device; to be checked, a picture of it goes, with no name or ID, to an AI provider, OpenAI or Anthropic, and our server does not keep it unless keeping your works there is switched on. So do not write your name or the real names of people you know. A program decides whether an answer is right, and the tutor is an AI. We keep a pseudonym, an avatar, your age category and country, your settings and what you have done. The adult of the account sees your progress; the operator, ALT EdTech LLC, reads a report the adult sends; no one buys your data. Until the age of digital consent of your country, that adult decides about your data; then you are asked to confirm or withdraw that consent, and you decide. If something is wrong, tell an adult you trust or call a helpline; if anyone is in danger now, call the emergency number."
          ru: "То, что ты пишешь, остаётся на твоём устройстве; на проверку его картинка, без имени и идентификаторов, уходит поставщику ИИ — OpenAI или Anthropic, — а наш сервер её не хранит, если не включено хранение твоих работ. Поэтому не пиши своё имя и настоящие имена знакомых. Верен ли ответ, решает программа, а наставник — ИИ. Мы храним псевдоним, аватар, возрастную категорию и страну, настройки и то, что пройдено в учёбе. Взрослый аккаунта видит твои успехи; оператор, ALT EdTech LLC, читает сообщение о проблеме, которое пришлёт взрослый; твоих данных никто не покупает. До возраста цифрового согласия твоей страны о твоих данных решает взрослый, а потом тебя спросят, подтвердить ли это согласие или отозвать, и решать будешь ты. Если что-то не так, скажи взрослому, которому доверяешь, или позвони по телефону помощи; если кому-то грозит опасность сейчас, звони в экстренную службу."
  measure-notice:
    place: samples_page
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "Your samples test how well AI reads handwriting. A sample holds your strokes with the history of your writing — the pointer, the time and course of the pen and what you erased, with no pressure, which we treat as biometric data — the crops, their markup and your writer code, never your name. The organizer, NovaTrail's measuring program and Anthropic see it; it is never published, and nobody tells writers apart by their handwriting. You send the file by a one-day upload link; it lies in the operator's closed storage in the United States for 2 years. You can withdraw by your writer code, to the organizer or to the operator: your samples are erased within 30 days. The operator is ALT EdTech LLC, in Texas."
          ru: "Ваши образцы проверяют, как ИИ читает почерк. В образце — штрихи с историей письма: чем писали, время и ход пера и что стёрто, без нажима, — с ней мы обходимся как с биометрией, вырезки, их разметка и код писавшего, но не имя. Его видят организатор, программа NovaTrail, которая меряет чтение, и Anthropic; он не публикуется, и почерк никто не сравнивает, чтобы узнать, кто писал. Файл вы отправляете по ссылке на загрузку на сутки; он лежит в закрытом хранилище оператора в США 2 года. Отозвать можно по коду писавшего — организатору или оператору: образцы сотрут за 30 дней. Оператор — ALT EdTech LLC, Техас."
      - version: 2
        status: in_force
        in_force_since: "2026-11-11"
        summary:
          en: "Your samples test how well AI reads handwriting. A sample holds your strokes with the history of your writing — the pointer, the time and course of the pen and what you erased, with no pressure, which we treat as biometric data — the crops, their markup and your writer code, never your name. The organizer, NovaTrail's measuring program and Anthropic see it; it is never published, and nobody tells writers apart by their handwriting. You send the file by a one-day upload link; it lies in the operator's closed storage in the United States for 2 years. You can withdraw by your writer code, to the organizer or to the operator: your samples are erased within 30 days. The organizer takes no form from someone who lives in Colorado or Washington. The operator is ALT EdTech LLC, in Texas."
          ru: "Ваши образцы проверяют, как ИИ читает почерк. В образце — штрихи с историей письма: чем писали, время и ход пера и что стёрто, без нажима, — с ней мы обходимся как с биометрией, вырезки, их разметка и код писавшего, но не имя. Его видят организатор, программа NovaTrail, которая меряет чтение, и Anthropic; он не публикуется, и почерк никто не сравнивает, чтобы узнать, кто писал. Файл вы отправляете по ссылке на загрузку на сутки; он лежит в закрытом хранилище оператора в США 2 года. Отозвать можно по коду писавшего — организатору или оператору: образцы сотрут за 30 дней. Форм у тех, кто живёт в Колорадо или Вашингтоне, организатор не берёт. Оператор — ALT EdTech LLC, Техас."
  measure-form:
    place: form
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "Consent to write samples for a measurement of how well AI reads handwriting: explicit consent to the history of your writing, treated as biometric data; the organizer, NovaTrail's measuring program and Anthropic receive the samples, which are never published; 2 years from the session, the form 5 years after the samples are erased; withdrawal by your writer code, to the organizer or the operator, within 30 days. The operator is ALT EdTech LLC, in Texas. You declare that you are 18 or older, may make this agreement where you live, and do not live in the EU, the EEA or the UK, and sign with your name and the date."
          ru: "Согласие писать образцы для замера того, как ИИ читает почерк: явное согласие на историю письма, с которой обходятся как с биометрией; образцы получают организатор, программа NovaTrail, которая меряет чтение, и Anthropic, и они не публикуются; 2 года от сеанса, форма — 5 лет после того, как стёрты образцы; отзыв по коду писавшего — организатору или оператору — за 30 дней. Оператор — ALT EdTech LLC, Техас. Вы заявляете, что вам 18 или больше, по законам места, где вы живёте, вы вправе заключить этот договор и живёте не в ЕС, ЕЭЗ и Великобритании, и подписываете его с именем и датой."
      - version: 2
        status: in_force
        in_force_since: "2026-11-11"
        summary:
          en: "Consent to write samples for a measurement of how well AI reads handwriting: explicit consent to the history of your writing, treated as biometric data; the organizer, NovaTrail's measuring program and Anthropic receive the samples, which are never published; 2 years from the session, the form 5 years after the samples are erased; withdrawal by your writer code, to the organizer or the operator, within 30 days. The operator is ALT EdTech LLC, in Texas. You declare that you are 18 or older, may make this agreement where you live, and do not live in the EU, the EEA, the UK, Colorado or Washington, and sign with your name and the date."
          ru: "Согласие писать образцы для замера того, как ИИ читает почерк: явное согласие на историю письма, с которой обходятся как с биометрией; образцы получают организатор, программа NovaTrail, которая меряет чтение, и Anthropic, и они не публикуются; 2 года от сеанса, форма — 5 лет после того, как стёрты образцы; отзыв по коду писавшего — организатору или оператору — за 30 дней. Оператор — ALT EdTech LLC, Техас. Вы заявляете, что вам 18 или больше, по законам места, где вы живёте, вы вправе заключить этот договор и живёте не в ЕС, ЕЭЗ, Великобритании, Колорадо и Вашингтоне, и подписываете его с именем и датой."
  eval-set-notice:
    place: samples_page
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "Your samples join a module's eval set, by which every new AI model is tested. A sample holds the final shapes of what you wrote (not the history of the writing), its crops, its markup and the Apache-2.0 license — no writer code, no name. Write on made-up topics. The organizer checks each sample by hand and erases one with a name. Samples are published with the module, and a published version keeps them for ever; withdrawing takes a sample out before it is added, or out of the module's next version after. In its tests they run at Anthropic and OpenAI. You send the file by a one-day upload link. The operator is ALT EdTech LLC, in Texas."
          ru: "Ваши образцы войдут в eval-набор модуля, по которому проверяют каждую новую модель ИИ. В образце — итоговые штрихи без истории письма, вырезки, разметка и лицензия Apache-2.0, без кода писавшего и имени. Пишите на выдуманные темы. Организатор проверяет каждый образец руками и стирает образец с именем. Образцы публикуются с модулем, и вышедшая версия хранит их навсегда; отзыв убирает образец до того, как он внесён, или из следующей версии модуля — после. В тестах модуля они идут к Anthropic и OpenAI. Файл вы отправляете по ссылке на загрузку на сутки. Оператор — ALT EdTech LLC, Техас."
  volunteer-form:
    place: form
    versions:
      - version: 1
        status: in_force
        in_force_since: "2026-11-10"
        summary:
          en: "The volunteer's agreement for a module's eval set: your samples, without the history of the writing, are published with the module under Apache-2.0, and a published version keeps them for ever: withdrawing takes a sample out before it is added, or out of the module's next version after; they run at Anthropic and OpenAI in its tests; an essay is marked by two people, a third deciding where they differ; NovaTrail trains no model of its own on them, but once published anyone may use them as Apache-2.0 allows. The form and the record of your samples' digests are kept while any of them is published, or 12 months if none was added. It carries the Developer Certificate of Origin 1.1, whose point (a) you certify, and your declaration that you are 18 or older, may make this agreement where you live, and do not live in the EU, the EEA or the UK. The operator is ALT EdTech LLC, in Texas."
          ru: "Договор добровольца eval-набора модуля: ваши образцы, без истории письма, публикуются с модулем под Apache-2.0, и вышедшая версия хранит их навсегда: отзыв убирает образец до того, как он внесён, или из следующей версии модуля — после; в его тестах они идут к Anthropic и OpenAI; сочинение оценивают двое, а где они разошлись, решает третий; своей модели NovaTrail на них не учит, но опубликованные любой может брать, как позволяет Apache-2.0. Форма и запись с дайджестами ваших образцов хранятся, пока хоть один из них опубликован, а если ни один не внесён — 12 месяцев. В ней — Developer Certificate of Origin 1.1, пункт (a) которого вы заверяете, и заявление, что вам 18 или больше, по законам места, где вы живёте, вы вправе заключить этот договор и живёте не в ЕС, ЕЭЗ и Великобритании. Оператор — ALT EdTech LLC, Техас."
  child-sample-notice:
    place: samples_page
    versions:
      - version: 1
        status: draft
        summary:
          en: "A child writes samples in a session you lead, to test how well AI reads children's handwriting; the parent has signed the parent's form first. A sample holds the final shapes of the writing (not its history), the crops, the markup you write from the child's words, and the child's writer code — no name, grade or age. Only the organizer sees it; it is never published and goes to no AI provider until the platform may give one the work of a child under 13. Send the file by the one-day upload link, check that Safari does not save to iCloud Drive, and erase the file from the device afterwards. It is kept 2 years; the parent can withdraw by the code, within 30 days."
          ru: "Ребёнок пишет образцы в сеансе, который ведёте вы, чтобы проверить, как ИИ читает детский почерк; родитель заранее подписал свою форму. В образце — итоговые штрихи без истории письма, вырезки, разметка, которую вы пишете со слов ребёнка, и код писавшего — без имени, класса и возраста. Его видит только организатор; он не публикуется и не уходит к поставщику ИИ, пока платформа не может отдать тому работу ребёнка младше 13. Отправьте файл по ссылке на загрузку на сутки, проверьте, что Safari не сохраняет в iCloud Drive, а потом сотрите файл с устройства. Он хранится 2 года; родитель может отозвать согласие по коду, за 30 дней."
  child-sample-form:
    place: form
    versions:
      - version: 1
        status: draft
        summary:
          en: "The parent's consent for a child's samples: the final shapes of the writing (not its history), the crops, the markup from the child's words and the child's writer code — no name, grade or age; the band of grades only in the organizer's record. Only the organizer sees them; they are never published and go to no AI provider until the platform may give one the work of a child under 13. Kept 2 years from the session; withdrawal by the code or the form within 30 days; the form kept 5 years after the samples are erased. Signed with the child's writer code, the parent's name and the date."
          ru: "Согласие родителя на образцы ребёнка: итоговые штрихи без истории письма, вырезки, разметка со слов ребёнка и код писавшего — без имени, класса и возраста; полоса классов — только в записи организатора. Видит их только организатор; они не публикуются и не уходят к поставщику ИИ, пока платформа не может отдать тому работу ребёнка младше 13. Хранятся 2 года от сеанса; отзыв по коду или форме — за 30 дней; форма хранится 5 лет после того, как стёрты образцы. Подписывается с кодом писавшего ребёнка, именем родителя и датой."
