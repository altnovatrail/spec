# Parts that break legal.set-texts.

cases:
  # The set names version 2 of its form, which does not exist.
  - passport:
      format: 1
      texts:
        privacy-policy:
          place: app
          versions:
            - version: 1
              status: in_force
              in_force_since: "2026-11-20"
              summary:
                en: We keep the least data we need.
                ru: Мы храним минимум данных.
        measure-notice:
          place: samples_page
          versions:
            - version: 1
              status: in_force
              in_force_since: "2026-11-20"
              summary:
                en: Your writing history goes to the organizer.
                ru: История письма уходит организатору.
        measure-form:
          place: form
          versions:
            - version: 1
              status: in_force
              in_force_since: "2026-11-20"
              summary:
                en: You consent to your writing history.
                ru: Вы соглашаетесь на историю письма.
      sets:
        measure:
          versions:
            - version: 1
              status: in_force
              in_force_since: "2026-11-20"
              notice:
                text: measure-notice
                version: 1
              form:
                text: measure-form
                version: 2
    files:
      texts/measure-form/1.md: |
        # Measurement: form of consent

        The words of this version.
      texts/measure-notice/1.md: |
        # Measurement: notice

        The words of this version.
      texts/privacy-policy/1.md: |
        # Privacy policy

        The words of this version.
    refused_by: legal.set-texts
    names:
      - sets.measure
