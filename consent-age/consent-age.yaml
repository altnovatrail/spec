  "IT":
    - age: 14
      from: "2018-09-19"
      law: "Decreto legislativo 30 giugno 2003, n. 196 (Codice in materia di protezione dei dati personali), come modificato dal decreto legislativo 10 agosto 2018, n. 101"
      provision: "Art. 2-quinquies, comma 1"
      quote: "In attuazione dell'articolo 8, paragrafo 1, del Regolamento, il minore che ha compiuto i quattordici anni può esprimere il consenso al trattamento dei propri dati personali in relazione all'offerta diretta di servizi della società dell'informazione. Con riguardo a tali servizi, il trattamento dei dati personali del minore di età inferiore a quattordici anni, fondato sull'articolo 6, paragrafo 1, lettera a), del Regolamento, è lecito a condizione che sia prestato da chi esercita la responsabilità genitoriale."
      source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2003-06-30;196~art2quinquies"
      read: "2026-11-10"
      note: "Below 14, Legge 23 settembre 2025, n. 132, art. 4, comma 4, in force from 2025-10-10, also asks the consent of the holder of parental responsibility for a minor's access to technologies of artificial intelligence and the processing that follows it."
