      read: "2026-11-10"
      note: "In force from 2018-07-20, the day GDPR applies in the EEA. A consultation of the Ministry of Justice of 2025-07-07 proposes 15; no law has been adopted."
  "PL":
    - age: 16
      from: "2018-05-25"
      law: "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016"
      provision: "Article 8(1)"
      quote: "Where the child is below the age of 16 years, such processing shall be lawful only if and to the extent that consent is given or authorised by the holder of parental responsibility over the child."
      source: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679"
      read: "2026-11-10"
      note: "The Ustawa z dnia 10 maja 2018 r. o ochronie danych osobowych (https://api.sejm.gov.pl/eli/acts/DU/2019/1781/text.html), with its amendments up to 2026, sets no age: GDPR's own applies."
  "PT":
    - age: 13
      from: "2019-08-09"
      law: "Lei n.º 58/2019, de 8 de agosto (Diário da República n.º 151/2019, Série I, de 2019-08-08)"
      provision: "Artigo 16.º, n.º 1 (n.º 2 for below 13)"
      quote: "Nos termos do artigo 8.º do RGPD, os dados pessoais de crianças só podem ser objeto de tratamento com base no consentimento previsto na alínea a) do n.º 1 do artigo 6.º do RGPD e relativo à oferta direta de serviços da sociedade de informação quando as mesmas já tenham completado 13 anos de idade."
      source: "https://files.diariodarepublica.pt/1s/2019/08/15100/0000300040.pdf"
      read: "2026-11-10"
      note: "Below 13, article 16.º, n.º 2, asks the consent of the legal representatives, preferably by secure authentication. In force from 2019-08-09 (article 68.º)."
  "RO":
