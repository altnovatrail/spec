  "IS":
    - age: 13
      from: "2018-07-15"
      law: "Lög um persónuvernd og vinnslu persónuupplýsinga, nr. 90/2018 (Lagasafn, útgáfa 158a, Íslensk lög 1. október 2026)"
      provision: "10. gr., 5. mgr."
      quote: "Þegar barni er boðin þjónusta í upplýsingasamfélaginu með beinum hætti og vinnsla persónuupplýsinga byggist á samþykki þess telst vinnslan því aðeins lögmæt ef barnið hefur náð 13 ára aldri. Sé barnið undir 13 ára aldri telst vinnslan aðeins lögmæt að því marki sem forsjáraðili þess heimilar samþykki."
