  "SE":
    - age: 13
      from: "2018-05-25"
      law: "Lag (2018:218) med kompletterande bestämmelser till EU:s dataskyddsförordning (ändrad t.o.m. SFS 2026:1589)"
      provision: "2 kap. 4 §"
      quote: "Vid erbjudande av informationssamhällets tjänster direkt till ett barn som bor i Sverige ska behandling av personuppgifter vara tillåten med stöd av barnets samtycke, om barnet är minst 13 år. Om barnet är under 13 år, ska sådan behandling vara tillåten endast om samtycke ges eller godkänns av den som har föräldraansvar för barnet."
      source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-2018218-med-kompletterande-bestammelser_sfs-2018-218/"
