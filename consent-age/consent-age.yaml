      law: "Zakon o varstvu osebnih podatkov (ZVOP-2), Uradni list RS, št. 163/22 (amended by 40/25 – ZInfV-1, Art. 23 only)"
      provision: "8. člen, prvi odstavek"
      quote: "Privolitev otroka za uporabo storitev informacijske družbe, ki se ponujajo neposredno otrokom oziroma za katere se lahko verjetno domneva, da jih bodo uporabljali otroci, je veljavna, če je otrok star 15 let ali več. Če je otrok mlajši od 15 let, je privolitev veljavna le, če jo da ali odobri eden od staršev otroka, njegov skrbnik ali oseba, ki ji je podeljena starševska skrb."
