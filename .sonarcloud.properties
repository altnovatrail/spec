# SonarQube Cloud's automatic analysis of spec (R30). Its quality gate is a required check.
# The tests are tools/*/test/ and the Go tests, *_test.go, read as tests; everything else is read
# as code.
# Left out: the prototype, which the documents overrule (draft/README.md), and the trial files
# the tests of docs-check and format-check are run on. The paths in sonar.sources and sonar.tests are plain
# paths; the patterns are in the inclusions and exclusions. Whether the analysis honours both is
# read on the first analysis (RUN.md, T15).
sonar.sources=.
sonar.tests=.
sonar.exclusions=draft/**,tools/*/test/**,**/*_test.go
sonar.test.inclusions=tools/*/test/**,**/*_test.go
sonar.test.exclusions=tools/docs-check/test/fixtures/**,tools/format-check/test/fixtures/**
