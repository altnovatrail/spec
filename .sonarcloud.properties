# SonarQube Cloud's automatic analysis of spec (R30). Its quality gate is a required check.
# The tests are tools/*/test/ and the Go tests, *_test.go, read as tests; everything else is read
# as code.
# Left out: the prototype, which the documents overrule (draft/README.md), and the trial files
# the tests of docs-check and format-check are run on, and the files of real releases that
# release-verify's tests verify. The paths in sonar.sources and sonar.tests are plain
# paths; the patterns are in the inclusions and exclusions. Whether the analysis honours both is
# read on the first analysis (RUN.md, T15).
# The types of the module format under types/ are generated from its schemas (R72), and the open
# view of a part repeats the fields of the part that it keeps: they are code, but no duplication of
# theirs counts. The code buf generates from the contracts is left out, as contracts-check holds
# it to what buf generates (R83), and so are the trial contracts contracts-check's tests run on.
sonar.sources=.
sonar.tests=.
sonar.exclusions=draft/**,tools/*/test/**,**/*_test.go,contracts/**/*.pb.go,contracts/**/*.connect.go,contracts/**/*_pb.js,contracts/**/*_pb.d.ts
sonar.test.inclusions=tools/*/test/**,**/*_test.go
sonar.test.exclusions=tools/docs-check/test/fixtures/**,tools/format-check/test/fixtures/**,tools/release/test/fixtures/**,tools/contracts/test/fixtures/**
sonar.cpd.exclusions=types/**
