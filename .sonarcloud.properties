# SonarQube Cloud's automatic analysis of spec (R30). Its quality gate is a required check.
# The tests are tools/*/test/, read as tests; everything else is read as code.
# Left out: the prototype, which the documents overrule (draft/README.md), and the trial
# documents docs-check's tests are run on. The paths in sonar.sources and sonar.tests are plain
# paths; the patterns are in the inclusions and exclusions. Whether the analysis honours both is
# read on the first analysis (RUN.md, T15).
sonar.sources=.
sonar.tests=.
sonar.exclusions=draft/**,tools/*/test/**
sonar.test.inclusions=tools/*/test/**
sonar.test.exclusions=tools/docs-check/test/fixtures/**
