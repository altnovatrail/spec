# CodeQL over the repository's workflows and its JavaScript (R03 .github, R09 .github), pinned to
# a release of .github: the code of tools/. The prototype in draft/ is left out, as SonarCloud
# leaves it out: its scripts are the loader a design tool built, not the platform's code, and every
# new prototype would bring the same findings back (R33 and its amendment of 2026-10-22). The
# analysis of actions reads every workflow all the same. The job gives the shared workflow what it
# needs to upload its results. Its checks, one per language, are required checks in the ruleset of
# main, and the ruleset holds a merge on what they find (R30).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10
    with:
      languages: javascript-typescript
      paths-ignore: draft/**
