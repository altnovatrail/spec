# CodeQL over the repository's workflows, its JavaScript and its Go, pinned to a release of .github:
# the code of tools/, the Go module spec ships with the check of its zip, and the code buf generates
# from the contracts, in Go and in JavaScript. Go is read from a build, with the Go of the
# toolchain stage of .devcontainer/Dockerfile, in /usr/local/go.
# The prototype in draft/ is left out, as SonarCloud leaves it out: its scripts are the loader a
# design tool built, not the platform's code, and every new prototype would bring the same findings
# back. The analysis of actions reads every workflow all the same. The job gives the shared
# workflow what it needs to upload its results. Its checks, one per language, are required checks
# in the ruleset of main, and the ruleset holds a merge on what they find.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@c0234058dc1a85edd7b5d579b90f8fdb98ea826b # v0.1.22
    with:
      languages: javascript-typescript go
      paths-ignore: draft/**
