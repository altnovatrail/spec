# spec's release (R31): what a green main produces. Nobody tags by hand: the version is the next
# patch of the line the releases are numbered in, and the tag is created with the release. A
# line of its own comes from raising RELEASE_LINE in the change that deserves it. A change that
# gives the module format a new version always does, so that a line never spans two of them
# (R44), and release-version refuses one that does not; so does a new version of the admission
# table (R96), of the deployment configuration (R85), of the legal texts (R130) or of the table of
# the age of digital consent (R134) or of the format of the export (R135) and a new major
# package of a contract (R83), and a change that brings a new kind of file into the release, so
# that a release of an earlier line, run again, builds the files it got.
#
# Other repositories take the tag as a submodule for spec's documents and rules (R21), and their
# code takes the release's files (R64). From the line 0.3 on, a release carries each normative part
# with a version of its own as a file, <part>-<version>.tar.gz — the module format,
# format-<version>.tar.gz, from the line 0.8 on the admission table, admission-<version>.tar.gz
# (R96), from the line 0.11 on the deployment configuration, deployment-<version>.tar.gz, its
# version an integer (R85), from the line 0.13 on the legal texts, legal-<version>.tar.gz, its
# version an integer too (R130), and from the line 0.14 on the table of the age of digital consent,
# consent-age-<version>.tar.gz, an integer as well (R134), and the format of the export,
# export-<version>.tar.gz, an integer too (R135) — and from the line 0.4 on the npm package of the format's types
# for TypeScript as well, altnovatrail-spec-<X.Y.Z>.tgz, the archive npm takes (R73), which from
# the line 0.5 on holds the types of the element <novatrail-canvas> too (R74), from the line 0.8
# on the admission table's, from the line 0.11 on the deployment configuration's, and from the
# line 0.13 on the legal texts' passport's, from the line 0.14 on the table of the age of
# digital consent's and the format of the export's, and from the line 0.15 on those of the legal
# texts' version 2, legalv2, in place of legalv1 (R141), and from the line 0.17 on those of its
# version 3, legalv3, in place of legalv2 (R130).
# From the line 0.7 on, it carries the npm package of the API contracts' code as well,
# altnovatrail-contracts-<X.Y.Z>.tgz (R83). Each is signed without a key, with its bundle
# <file>.sigstore.json beside it, as the shared release of .github signs its callers' files. Go code
# takes the same tag as the version of spec's Go module, which the Go module proxy and its checksum
# database then hold to its bytes, and from the line 0.7 on the tag contracts/<tag> as the version
# of the Go module of the contracts, which the release sets once it is out (R83). The repository's
# releases are immutable, so the tag stays on its commit for good and no file is added or swapped
# once a release is out, and GitHub signs each release with an attestation of its tag, its commit
# and its files, which `gh release verify` and `gh release verify-asset` check. A release of an
# earlier line carries no files.
#
# The release also publishes its npm packages to npm, each the same file, once the release is out
# and verified: the package of the types, @altnovatrail/spec (R37, R73), and from the line 0.7 on
# the package of the contracts' code, @altnovatrail/contracts (R83). npm takes them by trusted
# publishing, with no token kept anywhere: the registry trusts this workflow by its file name, as
# each package's trusted publisher names it — the repository altnovatrail/spec, release.yml, no
# environment, npm publish allowed — and npm trades the job's OIDC token for a short-lived one
# and makes the version's provenance itself. The steps are those of the shared release of
# .github at v0.1.10, which spec cannot call, since it runs spec's recipes from a spec submodule
# (architecture 3.11), and which takes one package where spec's take each package of the release.
# A version npm holds already is not published again, and one below the highest goes out with the
# tag previous. A commit that is no longer the tip is published too: its provenance, like the
# certificate of its files, names the commit of the run, main's tip, and its release's attestation
# names its own. The first version of each package — 0.4.0 of the types, 0.7.0 of the contracts'
# code — was published by hand, as a trusted publisher is set on a package the registry has.
#
# The button releases the tip of main when it has no release yet — after a release run that
# failed, say. It works on main alone, and only once CI has passed on that commit.

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The line the releases are numbered in: the major and minor version every release carries, the
# patch counting up within it. just release-version reads it from here.
env:
  RELEASE_LINE: "0.17"

jobs:
  release:
    name: Release
    # Releases queue rather than overlap: each has to see the version the one before it
    # published before it can work out the next, and every commit of main gets its own.
    # queue: max keeps up to 100 runs pending, where the default keeps one (GitHub Docs, Workflow
    # syntax, read 2026-10-19). actionlint does not know the key yet: .github/actionlint.yaml.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    # Only from a commit the checks have passed on, and only when that commit is this
    # repository's own: the branch filter above matches the name of a fork's branch as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    # The image is built twice over, the Go module proxy is given 36 rounds a minute apart to
    # serve the release's version of both Go modules, which outlast the 30 minutes it remembers a
    # failed fetch for, and the npm registry twenty to show the packages', which the publish step
    # waits for together; five more go to the second package — its dry run, its publish and, on a
    # run again, its release-verify.
    timeout-minutes: 85
    # With pipefail: a runner's default, bash -e, lets a failed command inside a pipe pass.
    defaults:
      run:
        shell: bash
    # The commit the checks ran on, named by its SHA alone; by the button, the tip of main.
    env:
      TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      # Creating the release, and its tag with it.
      contents: write
      # Reading whether CI passed on the commit the button would release.
      actions: read
      # Signing the release's files: cosign trades the job's OIDC token for a certificate that
      # names this workflow (R64). npm trades it for a token that may publish an npm package
      # (R37).
      id-token: write
    steps:
      # Asked before anything of the repository is fetched: a run on another branch publishes
      # nothing, and neither does a commit whose CI on main has not finished green.
      - name: Whether this commit may be released by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is published from main alone, and this run is on ${GITHUB_REF}."
              exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
              --jq '.total_count')
          if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on ${GITHUB_SHA}. A release waits for its checks, and follows them by itself once they pass."
              exit 1
          fi

      # main as it stands, with its whole history and every tag: the next version is counted from
      # them. On workflow_run the checkout without a ref is "Last commit on default branch"
      # (GitHub Docs, Events that trigger workflows, read 2026-10-20). The commit the checks ran
      # on is named below by its SHA alone: it is in main's history, which the ruleset of main
      # keeps from being rewritten, and the recipe reads its RELEASE_LINE from its own
      # release.yml. Checking that commit out by the event's head_sha is what Scorecard's
      # Dangerous-Workflow flags: a workflow_run trigger "in conjunction with an explicit pull
      # request checkout", whatever the if: above lets through (Scorecard, docs/checks.md, read
      # 2026-10-20; RUN.md, T17). The cost: the image and the recipe are the tip's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # In the toolchain stage, as CI runs it, with the Node and just of the devcontainer, by
      # tools/toolchain/toolchain.sh, which CI runs and another repository's release runs from
      # its spec submodule: it mounts the runner's temporary directory, read-only and at the same
      # path, where gh leaves the error of a refused release for the publish step. In spec the
      # script, the recipes and their tests are one commit, so the dry run of release-refusal that
      # another repository's release asks first is not asked here. The recipe prints the step's
      # outputs: version — empty when there is nothing to release — previous, where the notes
      # start, released, the release this commit has already, and behind, the newest release when
      # this commit is older than it. The recipe refuses a commit that gives the module format
      # another version than the release before it in the same line (R44). A tag with no release
      # behind it was pushed by hand, against R31: on this commit, or as the newest "release" off
      # main's history, it would stop every release quietly, so the run stops on it instead.
      #
      # Every container the script starts has the folder it runs from mounted read-write, .git
      # and all, so the script runs from a copy of the checkout, in RUNNER_TEMP, taken before the
      # first container. The runner's own git reads the checkout alone, which no container
      # mounts: the fetch of the publish step and the post step of actions/checkout, which runs
      # git config and git submodule foreach there. No script runs from this copy after its
      # container, so the copy needs no check of the script's sum (the 2026-10-22 amendment to
      # R31; В25 .github).
      #
      # The stage is built from the Dockerfile, never from the cache that CI fills: the step sets
      # no TOOLCHAIN_IMAGE_FILE, so the image of the job that signs is what the Dockerfile builds
      # (the 2026-11-09 amendment to R31).
      - id: version
        name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -a . "$RUNNER_TEMP/checkout"
          (
              cd "$RUNNER_TEMP/checkout"
              tools/toolchain/toolchain.sh build
              tools/toolchain/toolchain.sh spec release-version "$TARGET" > "$RUNNER_TEMP/release-version"
          )
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/release-version"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release-version")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release-version")
          behind=$(sed -n 's/^behind=//p' "$RUNNER_TEMP/release-version")
          for tag in $released $behind; do
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null; then
                  echo "::error::${tag} has no release behind it: a tag pushed by hand. Tags come from this workflow alone (R31)."
                  exit 1
              fi
          done
          if [ -n "$version" ]; then
              echo "releasing $version"
          else
              echo "::notice::Nothing to publish: this commit is released already, or is older than the newest release."
          fi

      # The files of TARGET, built by the tip's recipe from TARGET's objects alone — git archive of
      # the commit, never the working tree of the checkout — and checked against git ls-tree. They
      # are built in a copy of the checkout of their own: the version step's container has had its
      # copy, and no script runs from a copy after its container (the 2026-10-22 amendment to
      # R31). The recipe reads TARGET's line, so a commit of a line before 0.3, whose checks
      # finished after a later one was merged, gets no files. What the container wrote is checked
      # here on the runner, as the shared release of .github checks its callers' files: plain
      # files, named as release-files names them, none a bundle. A run again of a commit released
      # already builds them too, to know which files its release has to hold. The npm packages are
      # of the release's version, which the recipe takes with the commit: the types', and from
      # the line 0.7 on the contracts' code's. The step's output npm names their archives, a space
      # between, empty when the files hold none, and the steps of npm below run on it alone. The
      # output contracts names the archive of the contracts' code alone: the release tags the Go
      # module of the contracts when its files hold it.
      - id: files
        name: Build the files
        if: steps.version.outputs.version != '' || steps.version.outputs.released != ''
        env:
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          cp -a . "$RUNNER_TEMP/checkout-files"
          (
              cd "$RUNNER_TEMP/checkout-files"
              tools/toolchain/toolchain.sh spec release-files "$TARGET" dist "$VERSION"
          )
          dist="$RUNNER_TEMP/checkout-files/dist"
          if [ -L "$dist" ] || [ ! -d "$dist" ]; then
              echo "::error::release-files left no folder dist/, or dist/ is a link."
              exit 1
          fi
          # find stops at the first, rather than feed grep -q, which would close the pipe early:
          # find then dies of SIGPIPE, and with pipefail a failed pipe lets everything pass.
          if [ -n "$(find "$dist" -mindepth 1 ! -type f -print -quit)" ]; then
              echo "::error::dist/ holds something besides files: a release takes files alone."
              exit 1
          fi
          count=0
          npm=""
          contracts=""
          for path in "$dist"/*; do
              if [ ! -e "$path" ]; then continue; fi
              name="${path##*/}"
              if [ "$name" = "altnovatrail-spec-${VERSION#v}.tgz" ]; then
                  npm="${npm:+${npm} }${name}"
              elif [ "$name" = "altnovatrail-contracts-${VERSION#v}.tgz" ]; then
                  npm="${npm:+${npm} }${name}"
                  contracts="$name"
              # The parts as release-verify knows them (tools/release/verify.mjs, PART_FILE): the
              # format and the admission table by MAJOR.MINOR, the deployment configuration, the
              # legal texts, the table of the age of digital consent and the format of the export by an
              # integer.
              elif ! [[ "$name" =~ ^(format|admission)-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.tar\.gz$ ||
                  "$name" =~ ^(deployment|legal|consent-age|export)-[1-9][0-9]*\.tar\.gz$ ]]; then
                  echo "::error::A file of dist/ is named ${name}, neither format-<MAJOR.MINOR>.tar.gz, admission-<MAJOR.MINOR>.tar.gz, deployment-<integer>.tar.gz, legal-<integer>.tar.gz, consent-age-<integer>.tar.gz, export-<integer>.tar.gz, altnovatrail-spec-${VERSION#v}.tgz nor altnovatrail-contracts-${VERSION#v}.tgz as release-files names its files."
                  exit 1
              fi
              count=$((count + 1))
          done
          mv "$dist" "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          {
              echo "count=${count}"
              echo "npm=${npm}"
              echo "contracts=${contracts}"
          } >> "$GITHUB_OUTPUT"

      # cosign at an exact version, checked against the sum in cosign_checksums.txt of its
      # release, the version and sum of the shared release of .github (R08 .github). Signing alone
      # needs it: a run again checks the npm packages it takes from its release by release-verify.
      - name: cosign
        if: steps.version.outputs.version != '' && steps.files.outputs.count != '0'
        env:
          COSIGN_VERSION: "3.1.4"
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          cosign="$RUNNER_TEMP/cosign"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$cosign" \
              "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${cosign}" | sha256sum --check --strict
          chmod +x "$cosign"

      # Node at an exact version, with the npm it ships, checked against the sum in SHASUMS256.txt
      # of its release, as cosign is: 24.22.1 with npm 11.19.1, the version and sum of the shared
      # release of .github (R08 .github), rather than the Node of the toolchain stage, which comes
      # before Node's security release of 2026-10-20 (RUN.md, T51). Trusted publishing takes npm
      # 11.5.1 and Node 22.14.0 or newer (R37). npm runs on the runner, not in the toolchain
      # stage: the job's OIDC token never goes into a container.
      #
      # npm-isolated, which the check and the publish below both run, is npm kept from every
      # setting this workflow did not choose: from an empty folder, so no package.json or .npmrc
      # of a project is read; with no user or global config and no npm_config_ variables,
      # NODE_OPTIONS or NPM_ID_TOKEN; with the registry named on its command line, which no
      # publishConfig overrides; and with no scripts. That guards against stray settings, not
      # against code that ran on the runner before (В23 .github). The containers that run after
      # this step — release-verify's on a run again, release-refusal's after a refusal, and the
      # check of the Go module — see RUNNER_TEMP read-only outside the folder each mounts, a copy
      # of the checkout of its own, so nothing but this workflow writes the script.
      - name: Node and npm
        if: steps.files.outputs.npm != ''
        env:
          NODE_VERSION: "24.22.1"
          NODE_SHA256: 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
        run: |
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$archive" \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/node"
          tar -C "$RUNNER_TEMP/node" --strip-components=1 -xJf "$archive"
          "$RUNNER_TEMP/node/bin/node" --version
          jq -r '"npm " + .version' "$RUNNER_TEMP/node/lib/node_modules/npm/package.json"
          cat > "$RUNNER_TEMP/npm-isolated" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          unset NODE_OPTIONS NPM_ID_TOKEN
          for variable in $(compgen -e); do
              case "${variable,,}" in npm_config_*) unset "$variable" ;; esac
          done
          work="$RUNNER_TEMP/npm"
          mkdir -p "$work"
          cd "$work"
          exec "$RUNNER_TEMP/node/bin/node" "$RUNNER_TEMP/node/lib/node_modules/npm/bin/npm-cli.js" "$@" \
              --prefix "$work" --userconfig "$work/no-userconfig" --globalconfig "$work/no-globalconfig" \
              --cache "$RUNNER_TEMP/npm-cache" --registry=https://registry.npmjs.org/ \
              --@altnovatrail:registry=https://registry.npmjs.org/ --ignore-scripts
          EOF
          chmod +x "$RUNNER_TEMP/npm-isolated"

      # A run again of a commit released already publishes the archives its release holds, not the
      # ones built anew above. It downloads each with its bundle into a folder of their own, apart
      # from the files built anew, and checks both before npm sees them. The release's attestation
      # is checked here on the runner. The signature is checked by release-verify, the one way a
      # file of a NovaTrail release enters CI (R77; RULES.md, Hard rules): this workflow at main, in
      # this repository, and the version in the archive's package.json, which ties it to its tag,
      # since the certificate names main's tip as the run that signed began. The recipe runs in the
      # toolchain stage, as the shared release.yml of .github runs it (R18 .github), once for each
      # archive and each time from a new copy of the checkout, since no script runs from a copy
      # after its container (the 2026-10-22 amendment to R31). It reads Sigstore, GitHub and the
      # npm registry: when one cannot be read, it refuses, and the job is run again. Only this step
      # has the token, which neither the recipe's container nor npm, which reads an archive the
      # toolchain stage built, ever sees.
      - name: The npm package of the release
        if: steps.version.outputs.released != '' && steps.files.outputs.npm != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.version.outputs.released }}
          FILES: ${{ steps.files.outputs.npm }}
        run: |
          folder="$RUNNER_TEMP/npm-release"
          mkdir "$folder"
          read -r -a archives <<< "$FILES"
          patterns=()
          for file in "${archives[@]}"; do
              patterns+=(--pattern "$file" --pattern "${file}.sigstore.json")
          done
          gh release download "$RELEASED" --repo "$GITHUB_REPOSITORY" --dir "$folder" "${patterns[@]}" || true
          for file in "${archives[@]}"; do
              if [ ! -f "$folder/$file" ] || [ ! -f "$folder/${file}.sigstore.json" ]; then
                  echo "::error::${RELEASED} holds no ${file} with its bundle ${file}.sigstore.json to publish to npm."
                  exit 1
              fi
          done
          for file in "${archives[@]}"; do
              gh release verify-asset "$RELEASED" "$folder/$file" --repo "$GITHUB_REPOSITORY"
              copy="$RUNNER_TEMP/checkout-verify-${file%.tgz}"
              cp -a "$GITHUB_WORKSPACE" "$copy"
              if ! (cd "$copy" && env -u GH_TOKEN tools/toolchain/toolchain.sh spec release-verify spec "$RELEASED" "$folder/$file"); then
                  echo "::error::release-verify refused ${file} of ${RELEASED}; the lines above say why, and nothing goes to npm. If Sigstore, GitHub or the npm registry could not be read, run the job again (R77)."
                  exit 1
              fi
          done

      # Each archive npm would publish, checked before the GitHub release exists, which is
      # immutable, so that a package that fails here leaves no release behind, and none of the
      # packages goes out:
      # - every entry lies under package/, with one package/package.json, whose name is the
      #   package's — @altnovatrail/<name> for altnovatrail-<name>-<version>.tgz, as npm pack names
      #   the archive of a package of a scope — and version the release's number without v;
      # - it is not private, and has no publishConfig and no tag of its own, which would change
      #   where and how npm publishes it;
      # - its repository is an object whose url is this repository, as the registry asks of a
      #   package with provenance.
      # The registry is read by its packument, with write=true, as npm reads one before it writes:
      # so the registry's CDN serves no copy cached for minutes. A package it lacks stops the run:
      # its first version was published by hand, and a trusted publisher is set on it. So does a
      # package unpublished as a whole, which the registry answers with 200 and a packument with
      # no versions, whose time has unpublished, and which npm view takes for a 404 (npm/cli
      # v11.19.1, lib/commands/view.js, read 2026-11-01): it takes no new version for 24 hours — "If
      # you entirely unpublish all versions of a package, you may not publish any new versions of
      # that package until 24 hours have passed" (docs.npmjs.com/policies/unpublish, read
      # 2026-11-02) — and then its next one is published by hand too. A version it held keeps its
      # time even then, and the numbers it held last lie under time.unpublished.versions too (the
      # packuments of asdasd, aaaaaaa and test-unpublish, read 2026-11-02). A version it holds
      # with this archive's integrity is published already. With another, or with none, or a
      # version it held once and that was unpublished, which its time still lists, the number is
      # gone:
      # "Once package@version has been used, you can never use it again" (npm/documentation,
      # content/policies/unpublish.mdx, read 2026-10-29). Before the release that stops every
      # release of the line, which would take the same number again, until RELEASE_LINE is raised;
      # after it, the next release has a new number. A version below the highest one npm holds
      # goes out with the tag previous, since npm 11 refuses to put it under latest by default
      # (npm/cli v11.19.1, lib/commands/publish.js, read 2026-10-29), and latest is never named;
      # the highest is of the versions MAJOR.MINOR.PATCH, not deprecated, as npm counts it there,
      # so the placeholder 0.0.0-stage the registry made with the package counts for nothing.
      # Then npm's own dry run, npm-isolated, reads the archive, and has to read the same file and
      # integrity. The check's own files lie apart from the empty folder npm runs in, in a folder
      # of each archive. The step's output plan names, for each package, its archive, its
      # integrity, and what the last step does with it — publish, with the tag previous or none,
      # or skip — as a JSON array.
      # This step has no token and no OIDC variables, so the dry run, which tries npm's token
      # exchange too, gets nothing to exchange: npm gets a token in the last step alone.
      - id: npm
        name: Check the npm package
        if: steps.files.outputs.npm != ''
        env:
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
          RELEASED: ${{ steps.version.outputs.released }}
          FILES: ${{ steps.files.outputs.npm }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          version="${VERSION#v}"
          if [ -n "$RELEASED" ]; then
              gone="The next release, with a new number, publishes the package."
          else
              gone="No release has that number yet, and every release of the line would take it again: raise RELEASE_LINE, so that the next release gets a number npm has never held."
          fi
          read -r -a archives <<< "$FILES"
          plan="[]"
          for archive in "${archives[@]}"; do
              name="${archive#altnovatrail-}"
              package="@altnovatrail/${name%-"${version}".tgz}"
              files="$RUNNER_TEMP/npm-files/${archive%.tgz}"
              mkdir -p "$files"
              file="$RUNNER_TEMP/dist/${archive}"
              if [ -n "$RELEASED" ]; then file="$RUNNER_TEMP/npm-release/${archive}"; fi
              if [ -L "$file" ] || [ ! -f "$file" ]; then
                  echo "::error::There is no ${file}, the archive npm pack makes of ${package} ${version}."
                  exit 1
              fi
              entries=$(tar -tzf "$file")
              if grep -qv '^package/' <<< "$entries" || [ "$(grep -cx 'package/package.json' <<< "$entries")" != 1 ]; then
                  echo "::error::${file##*/} is no archive npm pack makes: every entry lies under package/, with one package/package.json."
                  exit 1
              fi
              manifest="$files/package.json"
              tar -xzOf "$file" package/package.json > "$manifest"
              if ! jq -e 'type == "object"' "$manifest" > /dev/null; then
                  echo "::error::The package.json of ${file##*/} is no JSON object."
                  exit 1
              fi
              if [ "$(jq -r '.name' "$manifest")" != "$package" ] || [ "$(jq -r '.version' "$manifest")" != "$version" ]; then
                  echo "::error::${file##*/} holds $(jq -r '"\(.name)@\(.version)"' "$manifest"), not ${package}@${version}: the release's number, without v, is the package's version."
                  exit 1
              fi
              if jq -e '.private == true or has("publishConfig") or has("tag")' "$manifest" > /dev/null; then
                  echo "::error::The package.json of ${file##*/} is private, or has a publishConfig or a tag of its own, which would change how npm publishes it."
                  exit 1
              fi
              url=$(jq -r 'if (.repository | type) == "object" then .repository.url // "" else "" end' "$manifest")
              url="${url#git+}"
              url="${url%.git}"
              if [ "$url" != "https://github.com/${GITHUB_REPOSITORY}" ]; then
                  echo "::error::The package.json of ${file##*/} names its repository as \"${url}\", not as an object whose url is git+https://github.com/${GITHUB_REPOSITORY}.git: the registry refuses provenance from another repository."
                  exit 1
              fi
              integrity="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
              packument="$files/packument.json"
              code=$(curl -sS --proto "=https" --retry 3 -o "$packument" -w '%{http_code}' \
                  "https://registry.npmjs.org/${package/\//%2f}?write=true")
              tag=""
              action=""
              case "$code" in
                  404)
                      echo "::error::${package} is not in the npm registry. Its first version is published by hand and a trusted publisher set on it; only then does a release publish (R37)."
                      exit 1
                      ;;
                  200)
                      published=$(jq -r --arg v "$version" '(.versions // {}) | if has($v) then .[$v].dist.integrity // "none" else "" end' "$packument")
                      whole=""
                      if jq -e '((.time // {}) | has("unpublished")) and ((.versions // {}) | length == 0)' "$packument" > /dev/null; then
                          whole="${package} was unpublished from the npm registry as a whole, and takes no new version for 24 hours. Then its next version is published by hand, as its first version was, and a trusted publisher set on it again if it has none: npm's documentation does not say whether one outlives the package."
                      fi
                      if [ "$published" = none ]; then
                          echo "::error::${package}@${version} is in the npm registry with no integrity, so it is not this archive. npm never takes a version back. ${gone}"
                          exit 1
                      elif [ -n "$published" ] && [ "$published" != "$integrity" ]; then
                          echo "::error::${package}@${version} is in the npm registry with the integrity ${published}, and this archive's is ${integrity}. npm never takes a version back. ${gone}"
                          exit 1
                      elif [ -z "$published" ] && jq -e --arg v "$version" '((.time // {}) | has($v)) or ((.time.unpublished.versions? // []) | index($v) != null)' "$packument" > /dev/null; then
                          echo "::error::${package}@${version} was in the npm registry and was unpublished, and npm never takes a number it has held. ${gone}${whole:+ ${whole}}"
                          exit 1
                      elif [ -n "$published" ]; then
                          echo "::notice::${package}@${version} is in the npm registry already, with this archive's integrity."
                          action=skip
                      elif [ -n "$whole" ]; then
                          echo "::error::${whole} Only then does a release publish (R37)."
                          exit 1
                      else
                          highest=$(jq -r '(.versions // {}) | to_entries[] | select(.value.deprecated == null) | .key | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$packument" | sort -V | tail -n 1)
                          if [ -n "$highest" ] && [ "$(printf '%s\n' "$version" "$highest" | sort -V | tail -n 1)" = "$highest" ]; then
                              tag=previous
                          fi
                          action=publish
                      fi
                      ;;
                  *)
                      echo "::error::The npm registry answered ${code} for ${package}."
                      exit 1
                      ;;
              esac
              if [ "$action" = publish ]; then
                  tag_args=()
                  if [ -n "$tag" ]; then tag_args=(--tag "$tag"); fi
                  "$RUNNER_TEMP/npm-isolated" publish "$file" --dry-run --json --access public "${tag_args[@]}" \
                      --loglevel verbose > "$files/dry-run.json"
                  if ! jq -e --arg n "$package" --arg f "${file##*/}" --arg i "$integrity" \
                      '.[$n].filename == $f and .[$n].integrity == $i' "$files/dry-run.json" > /dev/null; then
                      echo "::error::npm's dry run did not read ${file##*/} with the integrity ${integrity}."
                      exit 1
                  fi
              fi
              echo "${package}@${version}: ${integrity}, ${action}${tag:+, tag ${tag}}"
              plan=$(jq -c --arg package "$package" --arg file "$file" --arg integrity "$integrity" \
                  --arg action "$action" --arg tag "$tag" \
                  '. + [{package: $package, file: $file, integrity: $integrity, action: $action, tag: $tag}]' <<< "$plan")
          done
          echo "plan=${plan}" >> "$GITHUB_OUTPUT"

      # Every file gets its bundle, the signature and the certificate that names the workflow that
      # made it, and every bundle is checked before anything is published: the identity is this
      # workflow at main, issued to GitHub Actions, in this repository, in a run of main's tip, the
      # commit the workflow file is read from on workflow_run. The step runs on the runner alone,
      # with no container: the job's OIDC token never goes into one.
      - name: Sign the files
        if: steps.version.outputs.version != '' && steps.files.outputs.count != '0'
        run: |
          cosign="$RUNNER_TEMP/cosign"
          cd "$RUNNER_TEMP/dist"
          shopt -s nullglob
          files=(*.tar.gz *.tgz)
          for file in "${files[@]}"; do
              "$cosign" sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          for file in "${files[@]}"; do
              "$cosign" verify-blob --bundle "${file}.sigstore.json" \
                  --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
                  --certificate-github-workflow-sha "$GITHUB_SHA" \
                  "$file"
          done
          ls -l

      # Latest is the release of the newest commit of main: a commit whose checks finished after
      # a newer one was pushed comes out without the mark. The notes run from the release before
      # this one. The Releases API refuses GITHUB_TOKEN a commit whose workflow files differ from
      # main's: "Otherwise, this endpoint returns 404 Not Found; some authentication paths surface
      # 403 Resource not accessible by integration instead" (GitHub Docs, REST API endpoints for
      # releases, read 2026-10-20). A commit that is no longer the tip then waits for the next
      # release, which covers it.
      #
      # With files, gh "creates a draft release, uploads each asset, and then publishes the
      # release", in "separate API requests" that "do not form a single atomic operation" (gh
      # manual, gh release create, read 2026-10-28), and deletes its draft when a step fails. A
      # draft of this version that a run stopped halfway left behind — gh's own delete failed, or
      # the job was cancelled between the requests — is deleted before the release is created and
      # after a failure, so that none is left beside the release or in its place.
      - id: publish
        name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          files=()
          if [ -d "$RUNNER_TEMP/dist" ]; then
              for path in "$RUNNER_TEMP/dist"/*; do
                  if [ -e "$path" ]; then files+=("$path"); fi
              done
          fi
          drafts() {
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                  --jq '.[] | select(.draft and .tag_name == env.VERSION) | .id' |
                  while read -r id; do
                      echo "::warning::Deleting the draft ${id} of ${VERSION}, which a run stopped halfway left."
                      gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
                  done
          }
          drafts || echo "::warning::The drafts of ${VERSION} could not be listed or deleted."
          git fetch --quiet --no-tags origin refs/heads/main
          tip=$(git rev-parse FETCH_HEAD)
          newest=false
          if [ "$tip" = "$TARGET" ]; then newest=true; fi
          if ! gh release create "$VERSION" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --latest="$newest" \
              --generate-notes "${start[@]}" 2> "$RUNNER_TEMP/release-create.err"; then
              cat "$RUNNER_TEMP/release-create.err" >&2
              drafts || echo "::warning::The drafts of ${VERSION} could not be listed or deleted."
              # Only the documented refusal is let pass, of a commit that is no longer the tip and
              # "adds or modifies any file under .github/workflows/ relative to the repository's
              # default branch" (the same page). The rule is the recipe release-refusal, the one
              # copy of it, which another repository's release workflow runs too (R31). main is
              # fetched again after the refusal: a commit merged meanwhile is what makes this one
              # older. The recipe runs in a new copy of the checkout, taken after the fetch: the
              # version step's copy has no new tip, and its container may have changed it. No
              # container has had the checkout, so the new copy's script is the one checked out.
              git fetch --quiet --no-tags origin refs/heads/main
              tip=$(git rev-parse FETCH_HEAD)
              cp -a . "$RUNNER_TEMP/checkout-tip"
              if ! (cd "$RUNNER_TEMP/checkout-tip" &&
                  tools/toolchain/toolchain.sh spec release-refusal \
                      "$TARGET" "$tip" "$RUNNER_TEMP/release-create.err"); then
                  exit 1
              fi
              echo "::warning::${TARGET} is no longer the tip of main (${tip}) and adds or modifies its workflow files, and the Releases API refused it; the release of the tip covers it."
              exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The release is immutable and attested, and so is every file in it; the attestation may take
      # a moment to appear. The files are those the release holds, downloaded: exactly the files
      # built above, each with its bundle, and each verified against the attestation. A run again
      # of a commit released already verifies its release, so that a run that failed here does not
      # turn green on a second try without it.
      - name: Verify the release
        if: steps.publish.outputs.published == 'true' || steps.version.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          wanted=()
          if [ -d "$RUNNER_TEMP/dist" ]; then
              for path in "$RUNNER_TEMP/dist"/*.tar.gz "$RUNNER_TEMP/dist"/*.tgz; do
                  if [ -e "$path" ]; then wanted+=("${path##*/}" "${path##*/}.sigstore.json"); fi
              done
          fi
          held=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected=$(printf '%s\n' "${wanted[@]}" | sed '/^$/d' | sort)
          if [ "$held" != "$expected" ]; then
              echo "::error::${VERSION} holds the files [${held//$'\n'/, }], and its commit's are [${expected//$'\n'/, }]."
              exit 1
          fi
          released="$RUNNER_TEMP/released"
          mkdir "$released"
          if [ ${#wanted[@]} -gt 0 ]; then
              gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$released"
          fi
          for attempt in 1 2 3 4 5; do
              verified=true
              gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY" || verified=false
              for file in "${wanted[@]}"; do
                  if [ "$verified" = true ]; then
                      gh release verify-asset "$VERSION" "$released/$file" --repo "$GITHUB_REPOSITORY" || verified=false
                  fi
              done
              if [ "$verified" = true ]; then exit 0; fi
              echo "attempt $attempt: not verified yet"
              sleep 10
          done
          echo "::error::${VERSION} is published, but its attestation does not verify it and its files."
          exit 1

      # Go code takes the contracts' code from the Go module of contracts/, and a module in a folder
      # of the repository has tags of its own: "each tag name must be prefixed with the module
      # subdirectory, followed by a slash" (Go Modules Reference, go.dev/ref/mod, read
      # 2026-11-02). Its tag is the release's behind the folder, contracts/<tag>, on the same commit
      # (R83). It is set once the release is out and verified, so that no such tag stands without a
      # release: the ruleset v-tags forbids moving or deleting it, as it does a release's own tag
      # (R31, R77). It is a plain tag of TARGET, as the release's is, set through the API with the
      # job's token. A run again of a released commit sets it if a run before stopped short of it;
      # one of that name on another commit was set by hand, against R31, and stops the run. The API
      # may refuse GITHUB_TOKEN a ref to a commit that is no longer the tip and whose workflow files
      # differ from main's, as the Releases API does: then release-refusal, run as the publish step
      # runs it, lets it pass, the tag stays unset — the release of the tip, and its tag, cover it —
      # and the check of the Go module leaves the module of the contracts out. gh api words a 403 as
      # "Resource not accessible by integration (HTTP 403)", so its line is put as the recipe reads
      # it. Its output tagged says whether the tag names the commit.
      - id: contracts-tag
        name: Tag the Go module of the contracts
        if: >-
          steps.files.outputs.contracts != '' &&
          (steps.publish.outputs.published == 'true' || steps.version.outputs.released != '')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
        run: |
          tag="contracts/${VERSION}"
          held() {
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
                  --jq '[.object.type, .object.sha] | join(" ")' 2> "$RUNNER_TEMP/contracts-tag.err"
          }
          if found=$(held); then
              echo "${tag} is there already"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/contracts-tag.err"; then
              if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f "ref=refs/tags/${tag}" -f "sha=${TARGET}" > /dev/null 2> "$RUNNER_TEMP/contracts-create.err"; then
                  cat "$RUNNER_TEMP/contracts-create.err" >&2
                  sed 's/^gh: Resource not accessible by integration (HTTP 403)$/HTTP 403: Resource not accessible by integration/' \
                      "$RUNNER_TEMP/contracts-create.err" > "$RUNNER_TEMP/contracts-refusal.err"
                  git fetch --quiet --no-tags origin refs/heads/main
                  tip=$(git rev-parse FETCH_HEAD)
                  rm -rf "$RUNNER_TEMP/checkout-contracts"
                  cp -a . "$RUNNER_TEMP/checkout-contracts"
                  if ! (cd "$RUNNER_TEMP/checkout-contracts" &&
                      tools/toolchain/toolchain.sh spec release-refusal \
                          "$TARGET" "$tip" "$RUNNER_TEMP/contracts-refusal.err"); then
                      echo "::error::The tag ${tag} could not be set; the lines above say why. Running the job again tries again."
                      exit 1
                  fi
                  echo "::warning::${TARGET} is no longer the tip of main (${tip}) and adds or modifies its workflow files, and the API refused it the tag ${tag}; the release of the tip and its tag cover it."
                  echo "tagged=false" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              found=$(held)
          else
              cat "$RUNNER_TEMP/contracts-tag.err" >&2
              echo "::error::The tag ${tag} could not be read; the lines above say why. Running the job again asks again."
              exit 1
          fi
          if [ "$found" != "commit ${TARGET}" ]; then
              echo "::error::The tag ${tag} names ${found}, not the commit ${TARGET} of ${VERSION}: a tag set by hand, against R31. Tags come from this workflow alone."
              exit 1
          fi
          echo "${tag} names ${TARGET}"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # The packages go to npm once their release is out and verified, each the same archive, by
      # trusted publishing: npm exchanges the job's OIDC token for one that may publish the
      # package, since a trusted publisher of the package names this repository and release.yml,
      # and makes its provenance itself. npm-isolated runs it as in the check above, but with the
      # OIDC variables, for each package of the plan to publish, one after another. Its exit
      # status is not the verdict, the registry is: npm may end well with a version only staged, or
      # fail on a version that went out (npm/cli#9889, open when read on 2026-10-29). And a
      # version npm took is not readable at once: the registry answers the upload with 202 and
      # "Your package is being processed and may take a few minutes to become available" (its
      # notice in the run of v0.6.7, 2026-11-02), since it scans the package first, with "a short
      # delay between publishing and availability, typically around five minutes. It may take
      # longer, up to 15 minutes or more, at peak times" (GitHub Changelog, npm publish-time
      # malware scanning, 2026-07-28, read 2026-11-02). Nor does a version the packument shows
      # have its archive at once: the packument of @altnovatrail/spec showed 0.7.2 at 04:17:35 UTC
      # on 2026-11-03, and its archive answered 404 until 04:22:50 (the run of v0.7.2,
      # 41576700224, and a read every half minute). So the step asks the packument of each, with
      # write=true, until its version is there, and then its archive, until the registry serves
      # it — all of them together, a round every ten seconds, for twenty minutes at most, or half
      # a minute for a package npm failed on that the packument does not show — and the archive
      # has to be its file, byte for byte. A package that fails here does not keep the others
      # from being checked, and the step fails once all are.
      # A version npm holds already is not published again, and a refusal release-refusal lets
      # pass leaves the step out: no release, nothing in npm, and the release of the tip covers it.
      # If npm fails after the release is out, running the job again publishes the release's files
      # that npm lacks. The step comes before the check of the Go module, so that waiting for the
      # proxy holds nothing up here.
      - name: Publish to npm
        if: >-
          steps.npm.outputs.plan != '' &&
          (steps.publish.outputs.published == 'true' || steps.version.outputs.released != '')
        env:
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
          PLAN: ${{ steps.npm.outputs.plan }}
        run: |
          version="${VERSION#v}"
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          if ! jq -e 'type == "array" and length > 0' <<< "$PLAN" > /dev/null; then
              echo "::error::The check of the npm packages gave no plan to publish by."
              exit 1
          fi
          mapfile -t packages < <(jq -r '.[].package' <<< "$PLAN")
          mapfile -t files < <(jq -r '.[].file' <<< "$PLAN")
          mapfile -t integrities < <(jq -r '.[].integrity' <<< "$PLAN")
          mapfile -t actions < <(jq -r '.[].action' <<< "$PLAN")
          mapfile -t tags < <(jq -r '.[].tag' <<< "$PLAN")
          entries=$(jq length <<< "$PLAN")
          for list in packages files integrities actions tags; do
              declare -n held="$list"
              if [ "${#held[@]}" != "$entries" ]; then
                  echo "::error::The plan names $entries packages, but its ${list} are ${#held[@]}: each field is one line per package."
                  exit 1
              fi
              unset -n held
          done
          # Each package's exit status of npm publish, empty for one it holds already; the
          # integrity the registry shows for its version, empty until it shows one; the address of
          # its archive in the packument; and the archive: true once downloaded, no when it is not
          # to be — another integrity, another host —, empty until then.
          statuses=()
          published=()
          tarballs=()
          served=()
          for i in "${!packages[@]}"; do
              statuses[i]=""
              published[i]=""
              tarballs[i]=""
              served[i]=""
              if [ "${actions[i]}" != publish ]; then
                  echo "::notice::${packages[i]}@${version} is in the npm registry already: nothing to publish."
                  continue
              fi
              tag_args=()
              if [ -n "${tags[i]}" ]; then tag_args=(--tag "${tags[i]}"); fi
              status=0
              "$RUNNER_TEMP/npm-isolated" publish "${files[i]}" --access public "${tag_args[@]}" --loglevel verbose || status=$?
              statuses[i]=$status
          done
          # A publish npm reports as done may take a while to show; one npm reports as failed is
          # looked for briefly, in case it went out all the same, and once its packument shows
          # it, its archive is waited for like any other. The rounds end at twenty minutes of the
          # clock, however long the registry takes to answer: a read of a packument tries four
          # times, half a minute at most each, and of an archive once, a minute at most, since the
          # next round tries it again.
          deadline=$((SECONDS + 1200))
          for round in $(seq 1 120); do
              looking=false
              for i in "${!packages[@]}"; do
                  if [ -z "${statuses[i]}" ] || [ -n "${served[i]}" ]; then continue; fi
                  if [ "${statuses[i]}" != 0 ] && [ -z "${published[i]}" ] && [ "$round" -gt 3 ]; then continue; fi
                  archive="${files[i]##*/}"
                  folder="$RUNNER_TEMP/npm-files/${archive%.tgz}"
                  packument="$folder/packument.json"
                  if [ -z "${published[i]}" ]; then
                      code=$(curl -sS --proto "=https" --retry 3 --max-time 30 -o "$packument" -w '%{http_code}' \
                          "https://registry.npmjs.org/${packages[i]/\//%2f}?write=true") || code=""
                      if [ "$code" = 200 ]; then
                          published[i]=$(jq -r --arg v "$version" '(.versions // {})[$v].dist.integrity // ""' "$packument") || published[i]=""
                      fi
                  fi
                  if [ -n "${published[i]}" ] && [ "${published[i]}" != "${integrities[i]}" ]; then
                      served[i]=no
                  elif [ -n "${published[i]}" ]; then
                      tarballs[i]=$(jq -r --arg v "$version" '.versions[$v].dist.tarball // ""' "$packument")
                      case "${tarballs[i]}" in
                          https://registry.npmjs.org/*)
                              code=$(curl -sS --proto "=https" --proto-redir "=https" -L --max-time 60 \
                                  -o "$folder/registry.tgz" -w '%{http_code}' "${tarballs[i]}") || code=""
                              if [ "$code" = 200 ]; then served[i]=true; fi
                              ;;
                          *) served[i]=no ;;
                      esac
                  fi
                  if [ -z "${published[i]}" ]; then
                      echo "round ${round}: ${packages[i]}@${version} is not in the registry yet"
                      looking=true
                  elif [ -z "${served[i]}" ]; then
                      echo "round ${round}: the registry shows ${packages[i]}@${version}, and does not serve its archive yet"
                      looking=true
                  fi
              done
              if [ "$looking" = false ] || [ "$round" = 120 ] || [ "$SECONDS" -ge "$deadline" ]; then break; fi
              sleep 10
          done
          failed=false
          for i in "${!packages[@]}"; do
              if [ -z "${statuses[i]}" ]; then continue; fi
              package="${packages[i]}"
              archive="${files[i]##*/}"
              folder="$RUNNER_TEMP/npm-files/${archive%.tgz}"
              packument="$folder/packument.json"
              if [ -z "${published[i]}" ] && [ "${statuses[i]}" = 0 ]; then
                  echo "::error::npm publish ended well, but ${package}@${version} is not in the registry after twenty minutes. The registry may be processing it still, past its delay at peak times: run the job again later, and the check of the npm package finds it by its integrity. Or it may be only staged, by a trusted publisher that allows npm stage publish alone, or npm/cli#9889: then approve or reject it on npmjs.com, let the trusted publisher publish, and run the job again."
                  failed=true
                  continue
              elif [ -z "${published[i]}" ]; then
                  echo "::error::npm publish failed with ${statuses[i]}, and ${package}@${version} is not in the registry; the lines above say why. The package's trusted publisher names the repository ${GITHUB_REPOSITORY}, the workflow ${workflow##*/}, no environment, and allows npm publish."
                  failed=true
                  continue
              elif [ "${published[i]}" != "${integrities[i]}" ]; then
                  echo "::error::${package}@${version} is in the registry with the integrity ${published[i]}, and the release's file has ${integrities[i]}."
                  failed=true
                  continue
              fi
              if [ "${served[i]}" = no ]; then
                  echo "::error::The registry serves ${package}@${version} from \"${tarballs[i]}\", not from https://registry.npmjs.org/."
                  failed=true
                  continue
              elif [ "${served[i]}" != true ]; then
                  echo "::error::The registry shows ${package}@${version}, but did not serve its archive ${tarballs[i]} in twenty minutes. It may serve it later: run the job again later, and the check of the npm package finds the version by its integrity."
                  failed=true
                  continue
              fi
              if ! cmp "${files[i]}" "$folder/registry.tgz"; then
                  echo "::error::The archive the registry serves for ${package}@${version} is not the release's file."
                  failed=true
                  continue
              fi
              if [ "${statuses[i]}" != 0 ]; then
                  echo "::warning::npm publish failed with ${statuses[i]}, but the registry holds ${package}@${version}, the release's file byte for byte."
              fi
              if ! jq -e --arg v "$version" '.versions[$v].dist.attestations.provenance' "$packument" > /dev/null; then
                  echo "::warning::${package}@${version} has no provenance in the registry."
              fi
              echo "${package}@${version} is published${tags[i]:+ with the tag ${tags[i]}}: ${published[i]}"
          done
          if [ "$failed" = true ]; then exit 1; fi

      # Go code takes the release's tag as the version of spec's Go module (R64): the Go module
      # proxy builds its zip from the tag when it is first asked, and the checksum database records
      # its hash for good. The step asks for it, through the proxy alone — with GOPROXY's default, a
      # go command that the proxy answers 404 fetches from GitHub instead, and would hide it — so
      # that the release's run says whether the module came out: a zip Go refuses fails the run
      # here, after the release, which is out already. A version is served "within one minute" of
      # being asked for, unless it was asked for before its tag existed, which the proxy remembers
      # for up to 30 minutes (proxy.golang.org, FAQ, read 2026-10-28 and again 2026-11-03). A fetch
      # of its own that fails it remembers as long: on 2026-11-03 it could not reach GitHub for the
      # contracts' v0.7.9, "Could not resolve host: github.com", and answered that 404 again, with
      # "cache-control: public", until 30 minutes after it was first asked. So the step asks for
      # each module it has not got yet, in rounds a minute apart, 36 of them for all the modules
      # together, which outlast that memory, and a run again asks again. From the line 0.7 on it
      # asks for the Go module of the contracts too, at its tag contracts/<tag>, as Go asks for it,
      # when the step above set it: the version is the release's. It runs in the toolchain stage,
      # from an empty folder, which is all the container mounts, by the checkout's script, which no
      # container has had.
      - name: Verify the Go module
        if: >-
          (steps.publish.outputs.published == 'true' || steps.version.outputs.released != '') &&
          steps.files.outputs.count != '0'
        env:
          VERSION: ${{ steps.version.outputs.version || steps.version.outputs.released }}
          CONTRACTS: ${{ steps.contracts-tag.outputs.tagged }}
        run: |
          major="${VERSION#v}"
          major="${major%%.*}"
          suffix=""
          if [ "$major" -ge 2 ]; then suffix="/v${major}"; fi
          modules=("github.com/altnovatrail/spec${suffix}")
          if [ "$CONTRACTS" = true ]; then modules+=("github.com/altnovatrail/spec/contracts${suffix}"); fi
          empty=$(mktemp -d -p "$RUNNER_TEMP")
          cd "$empty"
          rounds=36
          round=0
          while [ "${#modules[@]}" -gt 0 ] && [ "$round" -lt "$rounds" ]; do
              if [ "$round" -gt 0 ]; then sleep 60; fi
              round=$((round + 1))
              waiting=()
              for module in "${modules[@]}"; do
                  if ! "$GITHUB_WORKSPACE/tools/toolchain/toolchain.sh" run \
                      env GOPROXY=https://proxy.golang.org go mod download -json "${module}@${VERSION}"; then
                      echo "round ${round}: the Go module proxy does not serve ${module}@${VERSION} yet"
                      waiting+=("$module")
                  fi
              done
              modules=("${waiting[@]}")
          done
          if [ "${#modules[@]}" -gt 0 ]; then
              for module in "${modules[@]}"; do
                  echo "::error::${VERSION} is published, but the Go module proxy does not serve ${module}@${VERSION} after ${rounds} rounds a minute apart; the lines above say why. Running the job again asks again."
              done
              exit 1
          fi
