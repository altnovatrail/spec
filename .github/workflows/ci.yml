# spec's own checks: the documents, the module format, the admission table, the deployment
# configuration, the legal texts, the age of digital consent, the format of the export, the types
# of each in Go and TypeScript, the Go module code takes from a release and its zip, the licenses
# of the packages of tools/, the version the next release takes and the files it carries. The
# tests of tools/ run in three jobs, and one job of its own sends their coverage to Codecov; the
# Go tests run in "Go / test", and the shared workflow's "Go / coverage" sends their profile.
# Everything runs in the toolchain stage of .devcontainer/Dockerfile, so a check green locally is
# green here; the image is built from the Dockerfile or loaded from the Actions cache, and
# published nowhere. Three of the checks every repository shares come from .github: secrets, DCO
# and the Go code, by the ci- recipes of the justfile. The fourth, the documents of a repository
# with spec as its submodule, spec does not take: its own job checks its documents.
#
# The required checks of the ruleset of main are named after these jobs: "Documents and tools",
# which passes only when the checks and every part of the tests have, and for a shared check the
# job here and the job of the shared workflow, "Secrets / gitleaks", "DCO / sign-off", and "Go /
# lint", "Go / test", "Go / vuln" and "Go / licenses". Renaming either breaks the ruleset.
# "Coverage" is not one of them: codecov/patch, which Codecov sets from the upload, answers for
# coverage, and the ruleset requires it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history, with every tag: release-version counts the next version from them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # tools/toolchain/toolchain.sh builds the toolchain stage and runs each check below in it,
      # for release.yml too and for another repository's workflows from their spec submodule.
      #
      # The image is a file of docker save in the Actions cache, keyed by the sha256 of the
      # Dockerfile, which pins everything it fetches: on a hit the Dockerfile does not run, so an
      # outage of nodejs.org, GitHub or the Ubuntu snapshot fails no check. The file is saved only
      # on a miss, since an entry never changes. The scope of main is filled by the runs on main; a
      # pull request's entry serves only its own re-runs (GitHub Docs, Dependency caching reference,
      # read 2026-11-09). A broken entry stays until it is deleted: toolchain.sh warns of it and
      # builds. release.yml takes no cache; the job "Go" runs .github's go.yml, which caches by its
      # own release.
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - id: image
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: tools/toolchain/toolchain.sh build

      # When docker save wrote no file, the save only warns: it turns its errors into warnings
      # (src/saveImpl.ts of v6.1.0, read 2026-11-09). The key is the one the restore asked for.
      - name: Toolchain image to the cache
        if: ${{ steps.image.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The file is loaded into the image, and the checks need the disk.
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"

      # Each check runs even when the one before it failed, so that a run names every failure.
      - name: Documents
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec docs-check

      - name: Module format
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec format-check

      # admission/: its schemas, the table and the documents it cites, its examples, and its test
      # vectors, whose answers the check computes.
      - name: Admission table
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec admission-check

      # deployment/: its schemas, its examples, and its test vectors, read as deployment/README.md
      # has a reader read them.
      - name: Deployment configuration
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec deployment-check

      # legal/: its schemas, its examples, its test vectors, read as legal/README.md has a reader
      # read them, and the part against the part of the release before, which the whole history of
      # the checkout holds.
      - name: Legal texts
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec legal-check

      # consent-age/: its schemas, its examples, its test vectors of reading and of the category,
      # computed as consent-age/README.md has them, and the table against the table of the release
      # before.
      - name: Age of digital consent
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec consent-age-check

      # export/: its schemas, its examples and its test vectors of reading, read as export/README.md
      # has a reader read them.
      - name: Export format
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec export-check

      # The types of the module format: those its schemas give, file for file, and each value of
      # format/ read by its Go type and written back as it was, and taken by tsc as a value of its
      # TypeScript type, from the npm package packed of the checkout.
      - name: Types
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec types-check

      # contracts/: buf.yaml and buf.gen.yaml, buf format, buf lint, rules of its own, buf breaking
      # against the previous release of spec by its tag, which the whole history above holds, and
      # the code buf generates, which contracts/ holds file for file. buf is the toolchain stage's;
      # the Go generators come through the Go module proxy, as the module of go-check does.
      - name: Contracts
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec contracts-check

      # spec's Go module, with the types of the module format, with no requirement, and its zip
      # built of the commit as the Go module proxy will build it from the release's tag; and the
      # module of the contracts, contracts/, with the runtime of protobuf and Connect alone, and its
      # zip too. go fetches golang.org/x/mod, which builds the zips, by tools/gomod/go.sum. Their
      # vet and their tests are the job Go's, below.
      - name: Go module
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec go-check

      - name: Licenses
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec licenses-check

      # What release.yml will publish once this is on main, by the recipes it runs. The version,
      # which a commit that gives the module format a new version without a new line does not get,
      # and the files, built into the container's /tmp and thrown away with it: release-files checks
      # each against the commit. The npm package among the files is of the version, which the recipe
      # prints as the step's outputs, as for release.yml; pipefail makes a failed recipe fail the
      # step. A commit that gets no release — older than the newest one, when its checks are run
      # again — gets no files from release.yml either, and none are built.
      - id: release-version
        name: Release version
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: bash
        run: tools/toolchain/toolchain.sh spec release-version | tee -a "$GITHUB_OUTPUT"

      - name: Release files
        if: ${{ !cancelled() && steps.release-version.outcome == 'success' }}
        env:
          TAG: ${{ steps.release-version.outputs.version || steps.release-version.outputs.released }}
        run: |
          if [ -z "$TAG" ]; then
              echo "::notice::This commit gets no release, so release.yml builds no files of it."
              exit 0
          fi
          tools/toolchain/toolchain.sh spec release-files HEAD /tmp/release-files "$TAG"

  # The tests of tools/ in three parts, a job each and apart from the checks, for the time they
  # take: every third test file, from the part's own (coverage-part). The number stands in the
  # matrix, the job's name, the recipe's call and the files of the job Coverage, which change
  # together. Each part writes the coverage of the code its tests load to coverage/lcov.info, for
  # the job Coverage. The image is the one the job Checks builds and saves: a part loads it from the
  # cache on a hit, and on a miss builds it and writes no file, so that one job saves the entry; on
  # a miss the four jobs build at once, each from the network. Each part runs even when another
  # fails, so that a run names every failure.
  tests:
    name: Tests (${{ matrix.part }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      # The whole history, with every tag: the tests of the release and of the contracts read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ steps.cache.outputs.cache-hit == 'true' && format('{0}/novatrail-toolchain.tar', runner.temp) || '' }}
        run: tools/toolchain/toolchain.sh build

      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"

      - name: Tests
        run: tools/toolchain/toolchain.sh spec coverage-part ${{ matrix.part }} 3

      # The report goes to the job that uploads it, the one job here that may ask for an OIDC
      # token. It is kept a week, so that the job can be run again after an outage of Codecov.
      - name: Coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.part }}
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  # The required check: it passes only when the checks and every part of the tests have, and when
  # every module of tools/ is in the report of some part — a module that no test loads is in none,
  # and codecov/patch would never count its lines (tools/coverage/untested.sh). It runs whatever
  # the jobs before it gave, always(), so that a failed or cancelled one fails it rather than
  # leave it skipped, which a required check would count as passed; the price is a red job on a
  # commit whose run a newer push cancelled. untested.sh runs on the runner itself: git, sed, sort
  # and comm are all it takes, and the toolchain image would cost a load for them.
  tools:
    name: Documents and tools
    needs: [checks, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The checks and the tests
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          if [ "$CHECKS" != success ] || [ "$TESTS" != success ]; then
              echo "::error::The checks gave ${CHECKS}, and the tests ${TESTS}: each must succeed."
              exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: Every module of tools/ in a report
        run: tools/coverage/untested.sh coverage/coverage-*/lcov.info

  # Codecov takes the reports of tools/, one of each part of the tests, by OIDC, with no secret.
  # This job alone here may ask GitHub for the token, which only Codecov accepts and which grants
  # nothing in the repository, and it runs none of the repository's code. A pull request from a
  # fork gets no token: the action then sends the report without one, as Codecov takes it from a
  # fork's branch. The profile of Go goes up from "Go / coverage", the same way, and Codecov waits
  # for both uploads before it sets codecov/patch (.github/codecov.yml).
  #
  # Any failure of the job fails a pull request, so that a missing codecov/patch has its reason
  # in sight. On main it does not fail the run: the release waits for CI to pass, and an outage
  # of Codecov must not hold it back. continue-on-error "Prevents a workflow run from failing
  # when a job fails" (GitHub Docs, Workflow syntax, read 2026-10-23).
  coverage:
    name: Coverage
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The files of the commit, which the upload lists so that Codecov can match the report's
      # paths to them. Which commit and pull request the report is for, the action takes from the
      # event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each part's report in a folder of its own, by its artifact's name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      # The Codecov CLI at an exact version, checked against its sha256 here, as the archives of
      # the Dockerfile are, rather than against a key that the action would fetch from Keybase
      # during the run. Dependabot moves the action's SHA alone: the version and its sum are
      # raised by hand, together.
      - name: Codecov CLI
        env:
          CLI_VERSION: v11.3.2
          CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
        run: |
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$RUNNER_TEMP/codecov" "https://cli.codecov.io/${CLI_VERSION}/linux/codecov"
          echo "${CLI_SHA256}  ${RUNNER_TEMP}/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"

      # The three reports alone: no search for others, and no plugins, which would run coverage
      # tools of their own. The CLI sends every file it is given in one upload, so Codecov still
      # waits for two uploads, this one and Go's (.github/codecov.yml). A failed upload fails the
      # job, as any of its steps does.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: coverage/coverage-1/lcov.info,coverage/coverage-2/lcov.info,coverage/coverage-3/lcov.info
          disable_search: true
          plugins: noop
          disable_telem: true
          fail_ci_if_error: true

  # The shared checks, pinned to a release of .github by SHA with its version beside it;
  # Dependabot moves both.
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # The Go code — spec's Go module, the module of the contracts and the modules of tools/ — by
  # the ci- recipes of the justfile, in the toolchain stage, as in every Go repository. go.yml's
  # job coverage sends the profile ci-test writes to Codecov by OIDC, as "Go / coverage", and a
  # nested job has no more than this one gives it: without id-token: write the run would not
  # start at all.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34
