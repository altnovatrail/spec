# spec's own checks (R30): the documents, the module format (R45), the admission table (R96), the
# deployment configuration (R85), the legal texts (R130), the age of digital consent (R134), the
# format of the export (R135), the types of each in Go and TypeScript (R72, R73), the Go module code takes from a release and its
# zip, the licenses of the packages of tools/, the version the next release takes (R31) and the
# files it carries (R64). The tests of tools/ and of the Go
# modules run once here, with their coverage, and a job of its own sends that of tools/ to Codecov
# (R48). The Go tests run again in "Go / test", and the shared workflow's job "Go / coverage"
# sends their profile (R16 .github).
# They run in the toolchain stage of .devcontainer/Dockerfile, with the Node, Go and just of the
# devcontainer, so a check that is green locally is green here. The image is built from the
# Dockerfile, or loaded from the cache of GitHub Actions by its sha256, and published nowhere. Beside them, three of the checks every repository shares, from
# .github: secrets, DCO and the Go code, by the ci- recipes of the justfile (R03, R16 .github).
# The fourth, the documents of a repository with spec as its submodule, spec does not take: its
# own job checks its documents.
#
# The required checks of the ruleset of main are named after these jobs: "Documents and tools",
# and for a shared check the job here and the job of the shared workflow, "Secrets / gitleaks",
# "DCO / sign-off", and "Go / lint", "Go / test", "Go / vuln" and "Go / licenses". Renaming
# either breaks that rule. "Coverage" is not one of them: the check that answers for coverage is
# codecov/patch, which Codecov sets from the upload, and the ruleset requires it once a pull
# request of Dependabot has shown that it comes (R30).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Documents and tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history, with every tag: release-version counts the next version from them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The toolchain stage, built once; every check below runs one command in it. How it is built
      # and how a command runs in it is tools/toolchain/toolchain.sh, which release.yml runs too,
      # and another repository's workflows from their spec submodule (R31).
      #
      # The image comes from the cache of GitHub Actions, as a file of docker save, by the sha256
      # of the Dockerfile, which pins everything it fetches (R34, R40): on a hit the Dockerfile
      # does not run, and a failure of nodejs.org, GitHub or the Ubuntu snapshot fails no check.
      # toolchain.sh loads the file, or builds the stage and writes it; the file is saved only on
      # a miss, since an entry never changes. The scope of main is filled by the runs on main; a
      # pull request's entry serves only its own re-runs (GitHub Docs, Dependency caching
      # reference, read 2026-11-09). A broken entry stays until it is deleted: toolchain.sh warns
      # of it and builds. release.yml takes no cache (R31). The job "Go" runs .github's go.yml,
      # which takes the cache with its own release.
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - id: image
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: tools/toolchain/toolchain.sh build

      # A file that docker save could not write is no file, and the save only warns of it: its
      # errors become warnings (src/saveImpl.ts of v6.1.0, read 2026-11-09). The key is the one the
      # restore asked for.
      - name: Toolchain image to the cache
        if: ${{ steps.image.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The file is in the image now, and the checks need the disk.
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"

      # Each check runs even when the one before it failed, so that a run names every failure.
      - name: Documents
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec docs-check

      - name: Module format
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec format-check

      # The admission table in admission/ (R96): its schemas, the table and the documents it cites,
      # its examples, and its test vectors, whose answers the check computes.
      - name: Admission table
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec admission-check

      # The format of the deployment configuration in deployment/ (R85): its schemas, its examples,
      # and its test vectors, which the check reads as section 5 of its text does.
      - name: Deployment configuration
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec deployment-check

      # The legal texts in legal/ (R130): its schemas, its examples, its test vectors, which the
      # check reads as section 5 of its text does, and the part itself, against the part of the
      # release before, which the whole history of the checkout holds.
      - name: Legal texts
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec legal-check

      # The table of the age of digital consent in consent-age/ (R134): its schemas, its examples,
      # its test vectors of reading and of the category, which the check computes as sections 5 and 6
      # of its text do, and the table itself, against the table of the release before.
      - name: Age of digital consent
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec consent-age-check

      # The format of the export in export/ (R135): its schemas, its examples and its test vectors of
      # reading, which the check reads as section 5 of its text does.
      - name: Export format
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec export-check

      # The types of the module format (R72, R73): those its schemas give, file for file, and each
      # value of format/ read by its Go type and written back as it was, and taken by tsc as a value
      # of its TypeScript type, from the npm package packed of the checkout.
      - name: Types
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec types-check

      # The API contracts in contracts/ (R83): buf.yaml and buf.gen.yaml as R83 has them, buf
      # format, buf lint, R83's own rules, buf breaking against the previous release of spec by
      # its tag, which the whole history above holds, and the code buf generates, which
      # contracts/ holds file for file. buf is the toolchain stage's; the Go generators come
      # through the Go module proxy, as the module of go-check does.
      - name: Contracts
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec contracts-check

      # spec's Go module (R64), with the types of the module format (R72): with no requirement,
      # and its zip built of the commit as the Go module proxy will build it from the release's
      # tag; and the module of the contracts, contracts/ (R83), with the runtime of protobuf and
      # Connect alone, and its zip too. go fetches the module the zips are built with,
      # golang.org/x/mod, by tools/gomod/go.sum. Their vet and their tests are the job Go's, below.
      - name: Go module
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec go-check

      - name: Licenses
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec licenses-check

      # What release.yml will publish once this is on main: the recipes it runs, run here first.
      # The version, which a commit that gives the module format a new version without a new
      # line does not get (R44), and the files, built into the container's /tmp and thrown away
      # with it: release-files checks each against the commit. The npm package among the files is
      # of the version (R73), which the recipe prints as the step's outputs, as it does for
      # release.yml; with pipefail, so that a failed recipe fails the step. A commit that gets no
      # release — older than the newest one, when its checks are run again — gets no files from
      # release.yml either, and none are built.
      - id: release-version
        name: Release version
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: bash
        run: tools/toolchain/toolchain.sh spec release-version | tee -a "$GITHUB_OUTPUT"

      - name: Release files
        if: ${{ !cancelled() && steps.release-version.outcome == 'success' }}
        env:
          TAG: ${{ steps.release-version.outputs.version || steps.release-version.outputs.released }}
        run: |
          if [ -z "$TAG" ]; then
              echo "::notice::This commit gets no release, so release.yml builds no files of it."
              exit 0
          fi
          tools/toolchain/toolchain.sh spec release-files HEAD /tmp/release-files "$TAG"

      # The tests of every tool in one run, which names every test that fails, with the coverage
      # of the code they test in coverage/lcov.info. The recipe fails on a module of tools/ that
      # no test loads, since codecov/patch would never count its lines. Then the tests of the Go
      # modules, as "Go / test" runs them, with their profile in coverage/go.out, which stays
      # here: "Go / coverage" sends the profile of its own run.
      - id: tests
        name: Tests
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: tools/toolchain/toolchain.sh spec coverage

      # The report goes to the job that uploads it, the one job here that may ask for an OIDC
      # token. It is kept a week, so that the job can be run again after an outage of Codecov.
      - name: Coverage report
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  # Codecov takes the report of tools/ by OIDC, with no secret (R48). This job alone here may ask
  # GitHub for the token, which only Codecov accepts and which grants nothing in the repository,
  # and it runs none of the repository's code. A pull request from a fork gets no token: the action
  # then sends the report without one, as Codecov takes it from a fork's branch. The profile of Go
  # goes up from "Go / coverage", the same way, and Codecov waits for both uploads before it sets
  # codecov/patch (.github/codecov.yml).
  #
  # Any failure of the job fails a pull request, so that a missing codecov/patch has its reason
  # in sight. On main it does not fail the run: the release waits for CI to pass (R31), and an
  # outage of Codecov must not hold it back. continue-on-error "Prevents a workflow run from
  # failing when a job fails" (GitHub Docs, Workflow syntax, read 2026-10-23).
  coverage:
    name: Coverage
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The files of the commit, which the upload lists so that Codecov can match the report's
      # paths to them. Which commit and pull request the report is for, the action takes from the
      # event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      # The Codecov CLI at an exact version, checked against its sha256 here, as R34 checks the
      # archives of the Dockerfile, rather than against a key that the action would fetch from
      # Keybase during the run (R48). Dependabot moves the action's SHA alone: the version and its
      # sum are raised by hand, together.
      - name: Codecov CLI
        env:
          CLI_VERSION: v11.3.2
          CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
        run: |
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 --retry-all-errors \
              -o "$RUNNER_TEMP/codecov" "https://cli.codecov.io/${CLI_VERSION}/linux/codecov"
          echo "${CLI_SHA256}  ${RUNNER_TEMP}/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"

      # The one report alone: no search for others, and no plugins, which would run coverage
      # tools of their own. A failed upload fails the job, as any of its steps does.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          plugins: noop
          disable_telem: true
          fail_ci_if_error: true

  # The shared checks, pinned to a release of .github by SHA with its version beside it;
  # Dependabot moves both (R04 .github).
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@c0234058dc1a85edd7b5d579b90f8fdb98ea826b # v0.1.22

  # The Go code — spec's Go module, the module of the contracts and the modules of tools/ — by
  # the ci- recipes of the justfile, in the toolchain stage, as in every Go repository (R16
  # .github; R30). From v0.1.12 on, the job coverage of go.yml sends the profile ci-test writes to
  # Codecov by OIDC, as "Go / coverage", and a nested job has no more than this one gives it:
  # without id-token: write the run would not start at all (R30).
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15
