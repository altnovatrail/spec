# OpenSSF Scorecard (R03 .github, R09 .github), pinned to a release of .github. Like the shared
# file, it has no env or defaults and only read permission at the top, as the Scorecard server
# asks of a workflow that publishes. It holds no merge (R30): it runs on main and once a week.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: altnovatrail/.github/.github/workflows/scorecard.yml@26f61993abadd564cce5e0498b31c686a61f9646 # v0.1.3
