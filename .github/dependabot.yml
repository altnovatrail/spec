# Dependabot proposes new versions of what it can see (R30): the actions of the workflows and
# the references to .github's shared workflows, each with the version comment beside its SHA
# (R04 .github); the base image of the devcontainer, tag and digest; the packages of tools/; and
# the Go module of tools/gomod, the check of the zip of spec's own Go module. That module,
# go.mod at the root, requires nothing, and `just go-check` keeps it so (R64): there is nothing
# there to raise. Nor in tools/types/roundtrip, the check of the types, which requires spec's own
# module alone, from the working tree (R72).
# For npm a pull request rewrites the lock file too, with whatever packages the new version
# brings along: licenses-check reads every one of them in CI.
#
# Raised by hand, before each new tag of spec, because no ecosystem here reads them: the ARGs of
# .devcontainer/Dockerfile, each version with the sha256 of its archives (R34), the VS Code
# extensions in .devcontainer/devcontainer.json and in repo-template/kinds.json. Every new
# repository copies this devcontainer at a tag of spec. So is the Codecov CLI of ci.yml, its
# version with its sha256 (R48): Dependabot moves the SHA of the action that runs it, not the CLI.
#
# Every ecosystem waits three days after a release before proposing it. That is Dependabot's own
# default, written down so that it stays: a bad release gets time to be noticed. The weekly
# schedule runs on Mondays, and at most five pull requests are open per ecosystem, both by
# default. Security updates are a setting of the repository, not of this file.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The packages docs-check and format-check run on. A new mermaid is read against the one the
  # Markdown preview of the devcontainer carries (bierner.markdown-mermaid): a diagram that only
  # one of them accepts passes docs-check and does not open in the preview, or the other way round.
  # A new ajv or yaml is read against the tests of format-check, which pin how ajv names an error
  # and how yaml reads a file.
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # Routine bumps travel together. A major version arrives on its own, because it is the
      # one that has to be read before it is merged.
      tools:
        patterns: ["*"]
        update-types: [minor, patch]

  # golang.org/x/mod, which builds spec's module zip as the Go module proxy builds it. A new
  # version is read against the tests of tools/gomod, which pin what the zip leaves out.
  - package-ecosystem: gomod
    directory: /tools/gomod
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
