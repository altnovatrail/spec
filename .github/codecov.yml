# What Codecov does with the coverage of the tests of tools/ and of the Go modules (R48). There are
# two reports, each with an upload of its own, and both leave the tests out by themselves. Node's,
# coverage/lcov.info, which the job "Coverage" of ci.yml uploads, leaves node_modules/ out too, and
# `just coverage`, which writes it, fails on a module of tools/ that no test loads. Go's,
# coverage/go.out, which ci-test writes and the job "Go / coverage" of .github's shared go.yml
# uploads, holds every package of every Go module, one that no test runs at zero; it names a file
# by its import path, which Codecov cuts down to the path in the repository by a default rule of
# its own, "Golang specific rule to strip out the github portion of a file path" (Codecov docs,
# Fixing paths, read 2026-11-01). The generated types of types/ hold no statement, so nothing here
# needs ignoring. Node measures JavaScript and Go measures Go, so the shell of toolchain.sh and of
# the justfile's recipes counts nowhere.

# Both uploads, before any status: "How many uploaded reports Codecov should wait to receive before
# sending statuses", 1 by default (Codecov docs, codecov.yml reference, read 2026-11-04). With one,
# codecov/patch would come from whichever upload came first, on half the changed lines. A run that
# sends one upload alone, because a check before the other failed, gets no codecov/patch; the red
# check holds the merge anyway. An outage of Codecov holds it too, as it does with one upload.
codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    # New and changed lines are covered at 90 % at least, as R38 standalone. The ruleset of main
    # requires this check once a pull request of Dependabot has shown that it comes (R30). A pull
    # request that changes no line of the report, the documents alone, passes as "Coverage not
    # affected".
    patch:
      default:
        target: 90%
    # On the plan Codecov gives a public repository, it sets no project status (R48). Should it
    # ever set one, it only informs: the badge shows the coverage of the whole.
    project:
      default:
        informational: true

# As standalone's: a comment only when the coverage changes, with the diff and the files.
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
