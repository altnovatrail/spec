# A worked example on a workbook: the example's lines with their boxes, which the demo fills one
# part at a time, here the quotient before the remainder. The lines and their values hold numbers,
# which the leak check does not search: it finds a leak only where a line of the example solves a
# line of a task of the lesson.
id: remainders
title: Remainders
skills: [counting-gaps]
segments:
  - worked_example:
      statement:
        - text: Share the apples into equal heaps, and say how many are left over.
      canvas:
        kind: workbook
      lines:
        - line:
            - text: "23 ÷ 4 ="
            - binding: box
              value: "5"
            - text: r
            - binding: box
              value: "3"
      demo:
        - text: Take the largest number of heaps that fit, then count what is left.
        - fill: {line: 1, box: 1}
        - fill: {line: 1, box: 2}
  - task: remainders-1
