# The technique catalog of the module of short essays: ways of writing that a task names when they
# help.
techniques:
  start-in-the-middle:
    title: Start in the middle
    description: Begin where something is already happening, and let the reader catch up.
  read-it-aloud:
    title: Read it aloud
    description: "Read the essay aloud: where you stumble, the reader will too."
