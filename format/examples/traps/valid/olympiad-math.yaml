traps:
  off-by-one:
    description: Off by one when counting gaps, floors or saw cuts.
    trap_advice: "Before answering, draw a quick sketch: the posts as dots and the gaps between them, then count both."
  missed-case:
    description: "Missed an option while enumerating: a case left out, or a shorter way than the one found."
    trap_advice: List the cases in a fixed order, smallest first, and tick each one off so that none is left out.
  double-count:
    description: Counted the same option twice.
    trap_advice: Write each option down once, in a fixed order, and look for repeats before counting them.
  ignored-not:
    description: Did not notice the word "not" in the question.
    trap_advice: Read the question aloud and circle the word “not” before solving it.
  answered-other-question:
    description: "Answered a different question: asked how many are left, answered how many were taken."
    trap_advice: Before answering, say in your own words what the question asks for, and check the answer against it.
  stopped-early:
    description: Stopped at an intermediate result instead of finishing the solution.
    trap_advice: After each step, ask whether that is what the question wants, or only a step towards it.
  wrong-operation:
    description: "Used the wrong operation: added instead of subtracting, multiplied instead of dividing."
    trap_advice: Act the story out with small objects or a drawing to see whether things are added, taken away or shared.
  reversed-relation:
    description: "Reversed a comparison: taller and shorter, before and after, more and less."
    trap_advice: Draw the comparison as a line from the smallest to the largest before reading off the answer.
  best-case-not-worst:
    description: Counted the lucky case instead of the worst case when the answer must be certain.
    trap_advice: Ask what the unluckiest possible way would be, and make sure the answer holds even then.
  trusted-statement:
    description: Took a statement as true without checking whether the speaker may be lying.
    trap_advice: "For each speaker, try both: what follows if they tell the truth, and what follows if they lie."
  time-unit-mixup:
    description: Mixed up hours and minutes, or counted 100 minutes in an hour.
    trap_advice: Draw a clock face and count on in minutes, remembering that an hour has 60 of them, not 100.
  number-from-text:
    description: Answered with a number from the question without computing anything.
    trap_advice: "Before writing a number down, say which calculation it comes from: a number copied from the question is rarely the answer."
  wrong-parity:
    description: Got the parity wrong, for example thought that odd plus odd is odd.
    trap_advice: Check parity on small numbers first, such as 1 + 3 and 3 + 5, then say the rule out loud.
  ignored-condition:
    description: Ignored one of the conditions, such as "different", "exactly once" or "at both ends".
    trap_advice: Reread the question and mark every condition, such as “different” or “exactly once”, then check the answer against each.
  percent-wrong-base:
    description: "Took the percentage of the wrong quantity: of the new price instead of the old one."
    skills: [percent-basic, ratio-sharing]
    trap_advice: "Ask first: a percentage of what? Write that whole amount down before taking the percentage."
  part-whole-swap:
    description: "Swapped the part and the whole, either way: answered with one when the other was asked for, or took a fraction of one as if it were a fraction of the other; a percentage of the wrong quantity is percent_wrong_base instead."
    skills: [fractions-parts, percent-basic]
    trap_advice: Draw the whole as a bar and shade the part, then check which of the two the question asks for.
  ratio-total-confusion:
    description: Treated a share of a ratio as a share of the total, or added the parts of the ratio wrongly.
    skills: [ratio-sharing]
    trap_advice: Draw the ratio as equal boxes, count all the boxes for the total, then work out what one box holds.
  remainder-vs-quotient:
    description: Gave the quotient where the remainder was asked for, or the other way round.
    skills: [number-divisibility]
    trap_advice: Share real objects into groups, then say aloud which number is the groups and which is what is left over.
  area-perimeter-swap:
    description: Counted the perimeter where the area was asked for, or the other way round.
    skills: [geometry-grid]
    trap_advice: Trace the edge with a finger for the perimeter and colour the inside for the area, then reread which one is asked for.
  first-move-assumed:
    description: Assumed that whoever moves first always wins, without checking the position.
    skills: [games-strategy]
    trap_advice: Play the game a few times from small positions and see who wins each one before deciding.
