# The skill graph of the official module of school mathematics for grade 3, on a workbook. Its
# tiers have no names, so the skill map shows them by number. Three of its skills teach anchor
# skills of the shared taxonomy, which other modules build on.
skills:
  numbers-to-1000:
    title: Numbers to 1000
    description: Reads, writes and compares whole numbers up to 1000, and splits each into hundreds, tens and ones.
    assessability: verdict
  adding-within-1000:
    title: Adding within 1000
    description: Adds two whole numbers whose sum is at most 1000, carrying from the ones and from the tens.
    prerequisites: [numbers-to-1000]
    assessability: verdict
  subtracting-with-borrowing:
    title: Subtracting with borrowing
    description: Subtracts a whole number from a larger one up to 1000, borrowing from the tens and from the hundreds.
    prerequisites: [numbers-to-1000]
    assessability: verdict
  times-tables:
    title: Times tables
    description: Knows the products of the whole numbers from 1 to 10 and the quotients they give.
    teaches: [core.multiplication-table]
    assessability: verdict
  division-with-remainder:
    title: Division with a remainder
    description: Divides a whole number by a number from 1 to 10 and gives the quotient and the remainder.
    prerequisites: [times-tables]
    teaches: [core.division-with-remainder]
    assessability: verdict
  fractions-of-a-whole:
    title: Fractions of a whole
    description: Names the fraction of a shape split into equal parts, and finds a fraction of a number, such as 2/3 of 12.
    prerequisites: [times-tables]
    teaches: [core.fractions-of-a-whole]
    assessability: verdict
  comparing-fractions:
    title: Comparing fractions
    description: Compares two fractions with the same denominator or with the same numerator.
    prerequisites: [fractions-of-a-whole]
    assessability: verdict
