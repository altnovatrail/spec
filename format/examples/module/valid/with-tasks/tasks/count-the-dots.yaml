# A task with a picture from media/, answered anywhere on the sheet.
id: count-the-dots
statement:
  - text: How many dots does the picture show?
  - picture: pictures/dot.png
    alt: One dot.
    width: 120
    height: 120
canvas:
  kind: handwriting_sheet
  grid: dots
  grid_step: 40
items:
  - answer_slots:
      - binding: anywhere
        check: {kind: number, key: "1"}
skills:
  primary: [times-tables]
band: grade-3
difficulty: 1
