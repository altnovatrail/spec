# A page of the workbook: lines of text and boxes, and a line that trains a skill of its own.
id: tables-page
statement:
  - text: Write the missing numbers.
canvas:
  kind: workbook
items:
  - line:
      - text: "7 ×"
      - binding: box
        check: {kind: number, key: "8"}
      - text: "= 56"
  - line:
      - text: "47 ÷ 6 ="
      - binding: box
        check: {kind: number, key: "7"}
      - text: r
      - binding: box
        check: {kind: number, key: "5"}
    skills:
      primary: [division-with-remainder]
      supporting: [times-tables]
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
