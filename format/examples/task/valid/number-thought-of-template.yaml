id: number-thought-of
template:
  parameters:
    to_ben: {from: 2, to: 6}
    left: {from: 2, to: 9}
  derived:
    before_ben: left + to_ben
    forgot_ben: "2 * left"
  constraint: left != to_ben
  solver:
    program: |
      # For "I thought of a number": try every whole number and keep the ones the
      # steps of the story turn into the result. Keep to whole numbers: where the
      # story halves, check that the half is whole with % 2 == 0 and take it with //.

      def fits(sweets, to_ben, left):
          return sweets % 2 == 0 and sweets - sweets // 2 - to_ben == left

      def solve(numbers):
          fitting = [n for n in range(1001) if fits(n, numbers["to_ben"], numbers["left"])]
          if len(fitting) != 1:
              fail("%d whole numbers fit the story" % len(fitting))
          return {"sweets": fitting[0]}
    results: [sweets]
statement:
  - text: Masha had some sweets. She gave half of them to Ann, and then she gave {to_ben} sweets to Ben. Now she has {left} sweets. How many sweets did Masha have at first?
givens:
  - Masha gave half of her sweets to Ann.
  - Then she gave {to_ben} sweets to Ben.
  - Now she has {left} sweets.
unknown: How many sweets Masha had at first.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{sweets}"
          units: [sweet, sweets]
          trap_values:
            - value: "{before_ben}"
              trap: stopped-early
              text: That is how many sweets Masha had after she gave half to Ann. How many did she have before that?
            - value: "{forgot_ben}"
              trap: ignored-condition
              text: Masha gave some sweets to Ben too. Give them back to her before you undo the half.
    simpler_case: Suppose Masha gave no sweets to Ben. How would you find how many she had at first?
solution:
  - text: Go backwards. Before Masha gave Ben his sweets, she had {left} + {to_ben} = {before_ben} sweets.
  - text: That was the half she kept, so at first she had {before_ben} × 2 = {sweets} sweets.
techniques: [backwards]
traps: [number-from-text]
leak_phrases: ["{sweets} sweets at first"]
skills:
  primary: [arithmetic-tricks]
band: grades-1-2
difficulty: 2
