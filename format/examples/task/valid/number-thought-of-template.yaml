# A template of the module of olympiad mathematics whose key its solver finds (section 24): the
# solver of mathtrail-standalone content/solvers/arithmetic.tricks/number-thought-of.star, at commit
# 4dece74, made a solver of the template. Its capitals TO_BEN and LEFT are the numbers that the
# statement shows, which solve gets as left and to_ben, and it tries every whole number from 0 to 1000
# and keeps the one the steps of the story turn into what is left. The key has a formula, twice
# left and to_ben, but the solver finds it as standalone's does, by search. The two trap values are
# derived numbers: stopping before doubling, and forgetting the sweets given to Ben; the constraint
# keeps them apart. The solver's result stands in the key, the solution and the leak phrase, and
# nowhere that the learner sees before the task is solved. The solver carries this notice:
