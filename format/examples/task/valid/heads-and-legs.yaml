# A task of the module of olympiad mathematics whose key stands in its statement: a chicken has 2
# legs, and there are 2 rabbits. The leak check does not search for the key 2, which any word on the
# legs would hold, and the task's leak phrases give the answer away instead (format text, section
# 20). The way in is to suppose that the animals are all the same; 4 is the chickens, the answer to
# another question, and 8 is the legs halved, after which the learner reads the trap's advice. AI may
# suggest from the work that the learner copied a number from the question: a trap that a trap value
# shows is not named again among the traps that AI may suggest.
id: heads-and-legs-1
statement:
  - text: A farmyard has chickens and rabbits, 6 heads and 16 legs in all. A chicken has 2 legs, and a rabbit has 4. How many rabbits are there?
givens:
  - "6 heads in all"
  - "16 legs in all"
  - A chicken has 2 legs.
  - A rabbit has 4 legs.
unknown: How many rabbits there are.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "2"
          units: [rabbit, rabbits]
          trap_values:
            - value: "4"
              trap: answered-other-question
              text: That is how many chickens there are. How many of the animals are rabbits?
            - value: "8"
              trap: wrong-operation
    simpler_case: Try 3 heads and 8 legs first. How many rabbits are there then?
solution:
  - text: If all 6 animals were chickens, they would have 6 × 2 = 12 legs.
  - text: "There are 16 − 12 = 4 legs more, and a rabbit has 2 legs more than a chicken: 4 ÷ 2 = 2 rabbits."
techniques: [all-the-same]
traps: [number-from-text]
leak_phrases: ["2 rabbits", two rabbits, "4 chickens", four chickens]
skills:
  primary: [arithmetic-tricks]
band: grades-3-4
difficulty: 3
