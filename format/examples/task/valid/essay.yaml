# A task of the module of short essays on an invented topic: the whole sheet is the answer, read and
# given feedback as one work.
id: undiscovered-island-1
statement:
  - text: Imagine an island that nobody has found yet. Write a short essay about your first morning there.
canvas:
  kind: handwriting_sheet
  grid: lines
items:
  - answer_slots:
      - binding: sheet
        check:
          kind: rubric
          criteria:
            - text: It is written in paragraphs, each about one part of the morning.
            - text: Its ending closes the story of the first morning.
            - text: It tells what can be seen, heard or felt on the island.
skills:
  primary: [paragraphs, endings]
  supporting: [writing-a-first-sentence]
band: whole-essays
difficulty: 2
