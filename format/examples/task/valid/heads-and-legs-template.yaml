# The task heads-and-legs.yaml as a template of the module of olympiad mathematics: each attempt gets
# one of its 72 instances, the chickens and the rabbits from 1 to 9 and never as many of each, so that
# the trap value of the chickens is never the key. The heads and the legs are derived numbers, which
# the statement and the givens show; the givens hold no number that the statement does not, so the
# key is found in them only when it stands in the statement too. The simpler case holds no number:
# every key of an instance is searched for in it.
id: heads-and-legs-2
template:
  parameters:
    chickens: {from: 1, to: 9}
    rabbits: {from: 1, to: 9}
  derived:
    heads: chickens + rabbits
    legs: "2 * chickens + 4 * rabbits"
    half_legs: chickens + 2 * rabbits
    chicken_legs: "2 * chickens + 2 * rabbits"
    extra_legs: "2 * rabbits"
  constraint: chickens != rabbits
statement:
  - text: A farmyard has chickens and rabbits, {heads} heads and {legs} legs in all. A chicken has 2 legs, and a rabbit has 4. How many rabbits are there?
givens:
  - "{heads} heads in all"
  - "{legs} legs in all"
  - A chicken has 2 legs.
  - A rabbit has 4 legs.
unknown: How many rabbits there are.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{rabbits}"
          units: [rabbit, rabbits]
          trap_values:
            - value: "{chickens}"
              trap: answered-other-question
              text: That is how many chickens there are. How many of the animals are rabbits?
            - value: "{half_legs}"
              trap: wrong-operation
    simpler_case: Suppose first that every animal is a chicken. How many legs would they have, and how many legs are then left over?
solution:
  - text: If all {heads} animals were chickens, they would have {heads} × 2 = {chicken_legs} legs.
  - text: "There are {legs} − {chicken_legs} = {extra_legs} legs more, and a rabbit has 2 legs more than a chicken: {extra_legs} ÷ 2 = {rabbits} rabbits."
techniques: [all-the-same]
traps: [number-from-text]
leak_phrases: ["{rabbits} rabbits", "{chickens} chickens"]
skills:
  primary: [arithmetic-tricks]
band: grades-3-4
difficulty: 3
