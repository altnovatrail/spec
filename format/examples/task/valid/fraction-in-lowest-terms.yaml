# A line of the workbook of school mathematics whose box takes a fraction in lowest terms: 2 of 8
# slices are 1/4 of the pizza, and 2/8, of the right value, is not yet right. The statement says so.
id: pizza-left-1
statement:
  - text: Write the fraction in lowest terms.
canvas:
  kind: workbook
items:
  - line:
      - text: "2 of 8 slices of the pizza are left: that is"
      - binding: box
        check:
          kind: fraction
          key: "1/4"
          form: reduced
          trap_values:
            - value: "2/8"
              trap: not-in-lowest-terms
              text: Your fraction is right in value. Can its top and its bottom both be divided by the same number?
      - text: of the pizza.
solution:
  - text: "2 of 8 slices is 2/8 of the pizza, and dividing both 2 and 8 by 2 gives 1/4."
skills:
  primary: [fractions-of-a-whole]
band: grade-3
difficulty: 3
