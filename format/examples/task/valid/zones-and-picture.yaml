# A task with a picture and two items, each answered in its own zone of the sheet. The zones touch at
# an edge, which is no overlap.
id: clock-walk-1
statement:
  - text: The clock shows when Anna leaves home.
  - picture: pictures/clock-quarter-past-three.png
    alt: A clock face whose hands show a quarter past three.
    width: 240
    height: 240
  - text: a) When does Anna leave? b) She walks for 25 minutes. When does she arrive?
canvas:
  kind: handwriting_sheet
items:
  - text: a)
    answer_slots:
      - binding: zone
        zone: {left: 100, top: 1000, width: 400, height: 200}
  - text: b)
    answer_slots:
      - binding: zone
        zone: {left: 500, top: 1000, width: 400, height: 200}
skills:
  primary: [time-clocks]
band: grades-1-2
difficulty: 3
