# error: required at #/template/solver
# A solver names its results: without them, no placeholder could name what it finds.
id: solver-without-results
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  solver:
    program: |
      def solve(numbers):
          return {"factor": numbers["product"] // numbers["a"]}
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check: {kind: number, key: "{b}"}
      - text: "= {product}"
solution:
  - text: "{a} × {b} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
