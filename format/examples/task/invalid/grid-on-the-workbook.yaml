# error: not at #/canvas
# A grid belongs to a handwriting sheet; a workbook lays out its lines itself.
id: grid-on-the-workbook
statement:
  - text: How many rungs are there?
canvas:
  kind: workbook
  grid: squares
items:
  - line:
      - text: "7 ×"
      - binding: box
        check: {kind: number, key: "8"}
      - text: "= 56"
solution:
  - text: "7 × 8 = 56, so the missing number is 8."
skills:
  primary: [counting-gaps]
band: grades-3-4
difficulty: 2
