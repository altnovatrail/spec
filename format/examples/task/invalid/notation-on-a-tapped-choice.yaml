# error: not at #/items/0/answer_slots/0/check
# A choice by tapping takes only its options, so its check has no notation.
id: notation-on-a-tapped-choice
statement:
  - text: Kim is taller than Lea. Who is shorter?
canvas:
  kind: handwriting_sheet
  grid: lines
items:
  - answer_slots:
      - binding: choice
        options: [Kim, Lea]
        check:
          kind: choice
          notation: word
          key: Lea
solution:
  - text: "Kim is taller than Lea, so Lea is the shorter one."
skills:
  primary: [ordering]
band: first-steps
difficulty: 1
