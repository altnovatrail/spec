# error: required at #/template/parameters/b
# A domain has both its ends: the integers from from to to.
id: domain-without-to
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2}
  derived:
    product: a * b
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check: {kind: number, key: "{b}"}
      - text: "= {product}"
solution:
  - text: "{a} × {b} = {product}."
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
