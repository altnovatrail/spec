# error: pattern at #/items/0/answer_slots/0/check/key
# The key of a time is H:MM, with no leading zero: 7:30, not 07:30. The learner may write either.
id: time-with-a-leading-zero
statement:
  - text: It is 7 o'clock. What time will it be in half an hour?
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check: {kind: time, key: "07:30"}
solution:
  - text: "Half an hour is 30 minutes, and 7:00 and 30 minutes is 7:30."
skills:
  primary: [time-clocks]
band: grades-1-2
difficulty: 1
