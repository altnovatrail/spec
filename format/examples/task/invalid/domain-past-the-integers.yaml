# error: maximum at #/template/parameters/b/to
# A domain lies within the integers of YAML (section 4): written with an exponent, 1e20 passes as an
# integer, and its numbers would be past what a canonical view writes (section 25).
id: domain-past-the-integers
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 1e20}
  derived:
    product: a * b
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check: {kind: number, key: "{b}"}
      - text: "= {product}"
solution:
  - text: "{a} × {b} = {product}."
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
