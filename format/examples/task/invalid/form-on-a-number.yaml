# error: not at #/items/0/line/1/check
# The form of a fraction is a parameter of the kind fraction; a number has none.
id: form-on-a-number
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "7 ×"
      - binding: box
        check: {kind: number, key: "8", form: reduced}
      - text: "= 56"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 1
