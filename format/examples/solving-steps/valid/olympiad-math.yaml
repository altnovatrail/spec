# The solving steps of the module of olympiad mathematics: Pólya's four steps, as the coach of the
# prototype shows them. The learner ticks what is known and what to find, gets the task's technique
# when the plan begins, and leaves the solving once every answer slot holds an answer. Each step says
# how to go through it, with no number: every task of the module goes through it.
steps:
  - title: Understand the task
    description: Read the task again, and tick what is known and what you are to find.
    gives: [givens]
    exit_condition: givens_ticked
  - title: Make a plan
    gives: [techniques]
    exit_condition: none
  - title: Solve it
    exit_condition: answer_slots_filled
  - title: Check the answer
    description: Put your answer back into the task, and see whether everything fits.
    exit_condition: none
