# The numbers and the table of widths of the workbook's page (section 14): canvas lays every page out
# by them, and task.workbook-page holds every task on a workbook to them. Units are those of the
# page, 1000 × 1400, as the handwriting sheet's; a width of a character is in whole hundredths of the
# type size. They are canvas's, R35 canvas at its commit 73807f2: each width the mean of Liberation
# Sans and Liberation Serif, rounded. A change of a number or a width is a version of the format.
sheet: {width: 1000, height: 1400}
numbers: {size: 30, box_width: 100, box_height: 100, line: 46, lead: 12, gap: 16, apart: 32, items: 32, gutter: 40, margin: 40}
most_items: 99
widths:
  digits: {characters: "0123456789", width: 53}
  signs: {characters: "+−×÷=<>≤≥≠±≈", width: 56}
  space: 26
  characters:
    - {width: 19, characters: "'"}
    - {width: 23, characters: "|"}
    - {width: 25, characters: "ijl"}
    - {width: 26, characters: ",."}
    - {width: 28, characters: "/:;t\\‘’∶"}
    - {width: 31, characters: "!I[]f"}
    - {width: 32, characters: "²³"}
    - {width: 33, characters: "()-`r·⋅"}
    - {width: 38, characters: "\""}
    - {width: 39, characters: "г„“”"}
    - {width: 40, characters: "°"}
    - {width: 41, characters: "{}"}
    - {width: 43, characters: "з"}
    - {width: 44, characters: "*Js"}
    - {width: 45, characters: "т"}
    - {width: 46, characters: "к"}
    - {width: 47, characters: "^czсэ"}
    - {width: 49, characters: "ь"}
    - {width: 50, characters: "?aekvxyавеухяё"}
    - {width: 51, characters: "ч"}
    - {width: 53, characters: "#$_bdghnopquор«»–"}
    - {width: 54, characters: "блнп"}
    - {width: 55, characters: "Здийц"}
    - {width: 56, characters: "~Г"}
    - {width: 57, characters: "ъ"}
    - {width: 58, characters: "FL"}
    - {width: 61, characters: "PSTZРТ"}
    - {width: 62, characters: "БКЬ"}
    - {width: 64, characters: "EЕЁ"}
    - {width: 66, characters: "Чм"}
    - {width: 67, characters: "BВЛУ"}
    - {width: 68, characters: "Дж"}
    - {width: 69, characters: "ACKRVXYАСХЭЯ"}
    - {width: 70, characters: "ы"}
    - {width: 72, characters: "&DHNUwИЙНП"}
    - {width: 73, characters: "Ц"}
    - {width: 74, characters: "ф"}
    - {width: 75, characters: "GOQОЪю"}
    - {width: 78, characters: "Ф"}
    - {width: 79, characters: "ш½¼¾⅓⅔⅛"}
    - {width: 80, characters: "щ"}
    - {width: 81, characters: "m"}
    - {width: 86, characters: "%MМ"}
    - {width: 88, characters: "Ы"}
    - {width: 91, characters: "Ж"}
    - {width: 94, characters: "W"}
