    - {width: 100, characters: "—…"}
    - {width: 101, characters: "№"}
    - {width: 102, characters: "Ю"}
  spaces:
    - {code_point: U+00A0, width: 26}
    - {code_point: U+2007, width: 53}
    - {code_point: U+202F, width: 20}
  zero:
    - U+0000–U+0008
    - U+000E–U+001F
    - U+007F–U+009F
    - U+00AD
    - U+0300–U+036F
    - U+0483–U+0489
    - U+1AB0–U+1AFF
    - U+1DC0–U+1DFF
    - U+200B–U+200F
    - U+202A–U+202E
