# Placeholders of parameters stand in the path of a picture of the statement, and every instance
# names its own file: the path is open, so it holds no result of a solver, and task.no-leaks searches
# it for the instance's keys. The seeds pick each of the three instances.
task:
  id: apples-in-rows
  template:
    parameters:
      total:
        from: 6
        to: 8
      rows:
        from: 2
        to: 3
    derived:
      each: total // rows
    constraint: total % rows == 0
  statement:
    - text: The apples lie in equal rows. How many apples are in each row?
    - picture: pictures/apples-{total}-in-{rows}-rows.png
      alt: Apples, {total} of them, in {rows} equal rows
      width: 320
      height: 160
  canvas:
    kind: handwriting_sheet
  items:
    - answer_slots:
        - binding: anywhere
          check:
            kind: number
            key: "{each}"
  solution:
    - text: "{total} ÷ {rows} = {each}: each row has {each} apples."
  skills:
    primary:
      - equal-sharing
  band: grade-3
  difficulty: 1
count: 3
attempts:
  - seed: "0"
    numbers:
      rows: 2
      total: 6
      each: 3
    open_view_digest: sha256:85c723826fc12544f058b58c19b009abce667702478aa9c06bf171ebb939eb5a
    instance:
      id: apples-in-rows
      statement:
        - text: The apples lie in equal rows. How many apples are in each row?
        - picture: pictures/apples-6-in-2-rows.png
          alt: Apples, 6 of them, in 2 equal rows
          width: 320
          height: 160
      canvas:
        kind: handwriting_sheet
      items:
        - answer_slots:
            - binding: anywhere
              check:
                kind: number
                key: "3"
      solution:
        - text: "6 ÷ 2 = 3: each row has 3 apples."
      skills:
        primary:
          - equal-sharing
      band: grade-3
      difficulty: 1
  - seed: "2"
