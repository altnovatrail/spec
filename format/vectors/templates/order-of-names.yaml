# The order of the combinations: the names in the order of their code units — a1, a_1, ab, b — the first
# changing slowest, a domain of negative integers, and a domain of one. Unary - binds tighter than //,
# so -ab // 2 is not -(ab // 2), and % takes the sign of the divisor.
task:
  id: order-of-names
  template:
    parameters:
      b: {from: 1, to: 2}
      ab: {from: 5, to: 6}
      a_1: {from: 0, to: 1}
      a1: {from: -3, to: -1}
    derived:
      neg_first: "-ab // 2"
      neg_after: "-(ab // 2)"
      rem: a1 % 2
      rem_neg: ab % -4
  statement:
    - text: "Numbers {a1}, {a_1}, {ab} and {b} give {neg_first}, {neg_after}, {rem} and {rem_neg}. Which number is b?"
  canvas:
    kind: handwriting_sheet
  items:
    - answer_slots:
        - binding: anywhere
          check: {kind: number, key: "{b}"}
  solution:
    - text: The task says so.
  skills:
    primary: [reading-numbers]
  band: grade-3
  difficulty: 1
count: 24
