      solution:
        - text: "If all 9 animals were chickens, they would have 9 × 2 = 18 legs."
        - text: "There are 34 − 18 = 16 legs more, and a rabbit has 2 legs more than a chicken: 16 ÷ 2 = 8 rabbits."
