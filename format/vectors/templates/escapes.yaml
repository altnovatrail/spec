# Doubled braces are one brace of the text, two placeholders may stand side by side, and placeholders
# stand in the alt of a picture, the text of an item, the options of a choice by tapping and its key.
# The seeds pick three of the four instances.
task:
  id: escapes
  template:
    parameters:
      a: {from: 1, to: 2}
      b: {from: 3, to: 4}
  statement:
    - text: "A set is written in braces, as {{{a}, {b}}}. Which of its numbers is the greater?"
    - picture: pictures/dots.png
      alt: "A row of {a}{b} dots"
      width: 240
      height: 40
  canvas:
    kind: handwriting_sheet
  items:
    - text: "a) {a} or {b}?"
      answer_slots:
        - binding: choice
          options: ["{a}", "{b}"]
          check: {kind: choice, key: "{b}"}
  solution:
    - text: "{b} is greater than {a}."
  skills:
    primary: [reading-numbers]
  band: grade-3
  difficulty: 1
count: 4
attempts:
  - seed: "0"
    numbers: {a: 1, b: 4}
    open_view_digest: sha256:bc95cc3a728714bb441b343f9ec6e219fc9b360e0a66254e4a13c62ec1ae61f9
    instance:
      id: escapes
      statement:
        - text: "A set is written in braces, as {1, 4}. Which of its numbers is the greater?"
        - picture: pictures/dots.png
          alt: A row of 14 dots
