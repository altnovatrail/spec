# The package of a module with a template. The server part holds the template as it is written and,
# in instances, the numbers of its 64 instances in the order of an odometer — first changing slowest,
# each derived number beside its parameters —, from which the server takes the instance of an attempt
# without running an expression.
server_part:
  manifest:
    module_format_version: "0.1"
    id: "example/with-templates"
    version: "0.1.0"
    title: "A module with a template"
    subject: "mathematics"
    audience:
      age_categories:
        - "under_13"
      grades:
        - 3
    bands:
      - id: "grade-3"
        title: "Grade 3"
        grades:
          - 3
    languages:
      explanation: "en"
    authors:
      - name: "The NovaTrail authors"
    license: "Apache-2.0"
    rung_templates:
      - "Which step of your work gave you this answer?"
      - "Read the line again. Which number of the times table gives the product it asks for?"
  skill_graph:
    skills:
      times-tables:
        title: "The times tables"
        assessability: "verdict"
  skill_tiers:
    times-tables: 1
  traps:
    traps:
      times-table-slip:
        description: "Took the next or the previous number of the times table for the one the line asks for."
        skills:
          - "times-tables"
        trap_advice: "Say the times table aloud, one step at a time, and stop where the product is."
  tasks:
    missing-factor:
      id: "missing-factor"
      template:
        parameters:
          first:
            from: 2
            to: 9
          second:
            from: 2
            to: 9
        derived:
          product: "first * second"
          one_more: "second + 1"
      statement:
        - text: "Write the missing number."
      canvas:
        kind: "workbook"
      items:
        - line:
            - text: "{first} ×"
            - binding: "box"
              check:
                kind: "number"
                key: "{second}"
                trap_values:
                  - value: "{one_more}"
                    trap: "times-table-slip"
                    text: "Count up the times table again, one step at a time, and stop at the product the line asks for."
            - text: "= {product}"
      solution:
        - text: "{first} × {second} = {product}, so the missing number is {second}."
      skills:
        primary:
          - "times-tables"
      band: "grade-3"
      difficulty: 2
  lessons:
    missing-factors:
      id: "missing-factors"
      title: "Missing factors"
      skills:
        - "times-tables"
      segments:
        - explanation:
            - text: "To find a missing factor, go through the times table of the number you know, and stop at the product the line gives."
        - task: "missing-factor"
  instances:
    missing-factor:
