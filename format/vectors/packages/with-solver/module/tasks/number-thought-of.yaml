# its techniques: Masha has some sweets, gives half to Ann and then to_ben to Ben, and has left. Its
# solver finds how many sweets she had at first, which no expression of the template gives, by
# standalone's solver number-thought-of.star. The solver and the trap carry the MIT License of
# mathtrail-standalone, whose notice the module's NOTICE holds, since a comment does not reach the
