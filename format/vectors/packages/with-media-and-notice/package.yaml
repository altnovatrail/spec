# The package of a module with a picture, notices and an eval set. The device part holds LICENSE,
# NOTICE and the picture, by its path from media/. The eval set is no part of the package, and neither
# is .editor-notes, whose name begins with a dot: the digests are those of the module without them,
# whatever order its folder lists its files in.
