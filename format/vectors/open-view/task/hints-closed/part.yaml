# What the statement gives and asks is open: the learner ticks it at a solving step. The techniques,
# the traps that AI may suggest, the trap values of the check, the simpler case of the item, the
# leak phrases and the solution are closed: the server gives them when the program says so.
id: gaps-ladder-1
statement:
  - text: The rungs of a ladder are 30 cm apart. From the lowest rung to the highest it is 180 cm. How many rungs are there?
givens:
  - The rungs are 30 cm apart.
  - It is 180 cm from the lowest rung to the highest.
unknown: How many rungs there are.
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "7"
          trap_values:
            - value: "6"
              trap: off-by-one
              text: That is how many gaps there are between the rungs. How many rungs hold those gaps?
    simpler_case: Try a short ladder first, 60 cm from the lowest rung to the highest, with the rungs 30 cm apart. How many rungs has it?
solution:
  - text: "From the lowest rung to the highest there are 180 ÷ 30 = 6 gaps of 30 cm, and a ladder has one more rung than gaps: 7 rungs."
techniques: [draw, small-numbers]
traps: [ignored-condition]
leak_phrases: [seven rungs]
skills:
  primary: [counting-gaps]
band: grades-3-4
difficulty: 2
