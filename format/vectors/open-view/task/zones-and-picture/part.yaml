# A picture of the statement and the zones of the answer slots are open, with every field of them;
# the checks of the answer slots are closed.
id: clock-walk-1
statement:
  - text: The clock shows when Anna leaves home.
  - picture: pictures/clock-quarter-past-three.png
    alt: A clock face whose hands show a quarter past three.
    width: 240
    height: 240
canvas:
  kind: handwriting_sheet
items:
  - text: a)
    answer_slots:
      - binding: zone
        zone: {left: 100, top: 1000, width: 400, height: 200}
        check: {kind: number, key: "15", units: [minute, minutes]}
  - text: b)
    answer_slots:
      - binding: zone
        zone: {left: 500, top: 1000, width: 400, height: 200}
        check: {kind: number, key: "40", units: [minute, minutes]}
solution:
  - text: The clock shows a quarter past three, so Anna leaves 15 minutes past three.
  - text: "She walks for 25 minutes, and 15 + 25 = 40: she arrives 40 minutes past three."
skills:
  primary: [time-clocks]
band: grades-1-2
difficulty: 3
