# The open view of a task leaves out its skills, its band and its difficulty, and the check of its
# answer slot: the learner's app does not get the key.
id: gaps-ladder-1
statement:
  - text: The rungs of a ladder are 30 cm apart. From the lowest rung to the highest it is 180 cm. How many rungs are there?
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "7"
          units: [rung, rungs]
skills:
  primary: [counting-gaps]
  supporting: [core.division-with-remainder]
band: grades-3-4
difficulty: 2
