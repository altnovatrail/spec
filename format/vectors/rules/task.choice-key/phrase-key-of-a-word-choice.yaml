# A choice with notation: word whose key is a phrase: one of the options, but not one word of letters.
id: kim-and-lea
statement:
  - text: Kim is taller than Lea. Who is shorter? Write the name, or write that it is impossible to tell.
canvas:
  kind: handwriting_sheet
  grid: lines
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: choice
          notation: word
          options: [Kim, Lea, Lea and Kim]
          key: Lea and Kim
solution:
  - text: "Kim is taller than Lea, so Lea is the shorter one."
skills:
  primary: [ordering]
band: first-steps
difficulty: 1
