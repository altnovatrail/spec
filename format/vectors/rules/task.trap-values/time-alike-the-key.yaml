# A time is compared by its hours and minutes, so the trap value 07:30 is the key 7:30, and right.
id: half-past-seven
statement:
  - text: It is 7 o'clock. What time will it be in half an hour? Write the time as hours and minutes, like 9:15.
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: time
          key: "7:30"
          trap_values:
            - {value: "07:30", trap: hundred-minutes-in-an-hour}
solution:
  - text: "Half an hour is 30 minutes, and 7:00 and 30 minutes is 7:30."
skills:
  primary: [time-clocks]
band: grades-1-2
difficulty: 1
