# A supporting anchor skill that a skill of the module teaches: the task names that skill instead.
id: forty-seven-by-six
statement:
  - text: How many times does 6 go into 47, leaving a remainder?
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check: {kind: number, key: "7"}
solution:
  - text: "6 × 7 = 42 and 6 × 8 = 48, which is more than 47: 6 goes into 47 seven times, and 5 is left."
skills:
  primary: [division-with-remainder]
  supporting: [core.multiplication-table]
band: grade-3
difficulty: 1
