# solve returns no factor: a dict without one of its results.
id: missing-result
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  solver:
    program: |
      def solve(numbers):
          return {}
    results: [factor]
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{factor}"
      - text: "= {product}"
solution:
  - text: "{a} × {factor} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
