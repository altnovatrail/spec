# The program calls gcd, a helper of mathtrail-standalone's sandbox, which is no built-in name of
# Starlark.
id: unknown-name
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  solver:
    program: |
      def solve(numbers):
          return {"factor": numbers["product"] // gcd(numbers["a"], numbers["product"])}
    results: [factor]
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{factor}"
      - text: "= {product}"
solution:
  - text: "{a} × {factor} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
