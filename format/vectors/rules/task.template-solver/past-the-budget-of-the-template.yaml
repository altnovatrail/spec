# Each call of solve takes a fraction of the budget: a loop of 2 000 000 turns, 20 000 020 steps as
# go.starlark.net v0.0.0-20261021141710-4f4267fb140d counts them. The 64 instances together would
# take far more than 100 000 000 steps, and the count reaches the budget in the fifth call: the budget
# is the template's, not each instance's.
id: past-the-budget-of-the-template
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  solver:
    program: |
      def solve(numbers):
          for turn in range(2000000):
              pass
          return {"factor": numbers["product"] // numbers["a"]}
    results: [factor]
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{factor}"
      - text: "= {product}"
solution:
  - text: "{a} × {factor} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
