# The result lies past 2^53 − 1, beyond an integer of YAML.
id: result-past-the-limit
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  solver:
    program: |
      def solve(numbers):
          return {"factor": 9007199254740992 + numbers["product"] // numbers["a"]}
    results: [factor]
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{factor}"
      - text: "= {product}"
solution:
  - text: "{a} × {factor} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
