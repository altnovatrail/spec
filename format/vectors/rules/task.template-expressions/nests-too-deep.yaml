# 65 parentheses around a * b: an expression nests at most 64 levels, below the depth that
# go.starlark.net parses, about 75 parentheses.
id: nests-too-deep
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: "(((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((a * b)))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))"
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{b}"
      - text: "= {product}"
solution:
  - text: "{a} × {b} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
