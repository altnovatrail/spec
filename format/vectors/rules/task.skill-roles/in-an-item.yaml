# A skill both primary and supporting in an item of its own skills.
id: tables-page
statement:
  - text: What is 7 × 8?
canvas:
  kind: workbook
items:
  - line:
      - text: "47 ÷ 6 ="
      - binding: box
        check: {kind: number, key: "7"}
      - text: r
      - binding: box
        check: {kind: number, key: "5"}
    skills:
      primary: [division-with-remainder]
      supporting: [division-with-remainder]
solution:
  - text: "6 × 7 = 42, and 47 − 42 = 5, so 47 ÷ 6 = 7 r 5."
skills:
  primary: [times-tables]
band: grade-3
difficulty: 1
