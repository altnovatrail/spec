# A predicate that is no Starlark expression: an assignment is a statement.
id: divisible-by-twelve
statement:
  - text: Write a number that divides by 3 and by 4.
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check: {kind: predicate, predicate: "value = 12"}
solution:
  - text: "A number that divides by 3 and by 4 divides by 3 × 4 = 12: 12 is one."
skills:
  primary: [number-divisibility]
band: grades-3-4
difficulty: 2
