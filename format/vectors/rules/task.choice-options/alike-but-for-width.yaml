# Two options of a choice written by hand that differ only in width: NFKC makes the full-width sign
# U+FF1C the sign <.
id: fifty-six-and-sixty-five
statement:
  - text: Write the sign <, > or = between the two numbers.
canvas:
  kind: workbook
items:
  - line:
      - text: "56"
      - binding: box
        check: {kind: choice, options: ["<", "＜", ">", "="], key: "<"}
      - text: "65"
solution:
  - text: "56 has 5 tens and 65 has 6, so 56 is less than 65: 56 < 65."
skills:
  primary: [numbers-to-1000]
band: grade-3
difficulty: 1
