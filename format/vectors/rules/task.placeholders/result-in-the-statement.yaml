# The statement shows {factor}, a result of the solver, which stands only in closed fields: the
# learner would see what only the solver finds.
id: result-in-the-statement
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  solver:
    program: |
      def solve(numbers):
          for factor in range(1, 101):
              if numbers["a"] * factor == numbers["product"]:
                  return {"factor": factor}
          fail("no factor fits")
    results: [factor]
statement:
  - text: Write the missing number, {factor}.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{factor}"
      - text: "= {product}"
solution:
  - text: "{a} × {factor} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
