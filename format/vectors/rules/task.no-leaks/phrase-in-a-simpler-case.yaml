# A simpler case that holds a leak phrase of the task, seven rungs.
id: gaps-ladder
statement:
  - text: The rungs of a ladder are 30 cm apart. From the lowest rung to the highest it is 180 cm. How many rungs are there?
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check: {kind: number, key: "7"}
    simpler_case: A ladder of seven rungs has six gaps. How many gaps has a ladder of three rungs?
solution:
  - text: "180 ÷ 30 = 6 gaps, and a ladder has one more rung than gaps: 7 rungs."
leak_phrases: [seven rungs]
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
