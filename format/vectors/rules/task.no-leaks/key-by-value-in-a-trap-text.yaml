# A trap text that repeats the learner's value: 2/8 has the key's value, so it gives 1/4 away.
id: pizza-left
statement:
  - text: Write the fraction in lowest terms.
canvas:
  kind: workbook
items:
  - line:
      - text: "2 of 8 slices of the pizza are left: that is"
      - binding: box
        check:
          kind: fraction
          key: "1/4"
          form: reduced
          trap_values:
            - value: "2/8"
              trap: not-in-lowest-terms
              text: "2/8 is right in value, and it can still be reduced."
      - text: of the pizza.
solution:
  - text: "2 of 8 slices is 2/8 of the pizza, and dividing both 2 and 8 by 2 gives 1/4."
skills:
  primary: [fractions-of-a-whole]
band: grade-3
difficulty: 3
