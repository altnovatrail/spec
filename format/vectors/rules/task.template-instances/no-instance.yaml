# No combination meets the constraint: a is never above 9.
id: no-instance
template:
  parameters:
    a: {from: 2, to: 9}
    b: {from: 2, to: 9}
  derived:
    product: a * b
  constraint: a > 9
statement:
  - text: Write the missing number.
canvas:
  kind: workbook
items:
  - line:
      - text: "{a} ×"
      - binding: box
        check:
          kind: number
          key: "{b}"
      - text: "= {product}"
solution:
  - text: "{a} × {b} = {product}"
skills:
  primary: [times-tables]
band: grade-3
difficulty: 2
