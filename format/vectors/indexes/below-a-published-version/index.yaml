# The release builds the times tables 0.1.1, a fix of 0.1.0, after 0.2.0 is published: a version that
# the previous index does not name, and below one of its module that it does. The index refuses it,
# as diff would have refused the new version: a release whose CI did not compare the versions is
# caught here (section 27). Another version of the line of 0.2.0, above it, fixes 0.1.0 instead.
previous:
  module_format_version: "0.3"
  modules:
    example/times-tables:
      "0.1.0":
        module_format_version: "0.3"
        package_digest: sha256:860ba9ff55af668cb068de2cb8b6e99d86f8739ed40e00d3c40bba34d71f7555
        release: v0.1.0
        teaches: [core.division-with-remainder, core.multiplication-table]
      "0.2.0":
        module_format_version: "0.3"
        package_digest: sha256:8b645240171d4e82b3411ce4f09ed0cc13d7c995e4fdb303b719d6837fb993b1
        release: v0.2.0
        teaches: [core.division-with-remainder, core.multiplication-table]
release: v0.3.0
refusal: module-index.version-above
