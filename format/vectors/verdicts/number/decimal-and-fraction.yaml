# A number in any of its notations, compared by its value: a decimal with a point, a simple fraction,
# a full-width digit and the vulgar fraction ½, which NFKC makes 1⁄2.
item:
  answer_slots:
    - binding: anywhere
      check: {kind: number, key: "0.5"}
readings:
  - answer_slots:
      - {value: "0.5", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "0.50", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "1/2", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "3 / 6", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "½", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "０.5", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "0.25", verdict: not_yet}
    verdict: not_yet
  - answer_slots:
      - {value: ".5", verdict: unreadable, reason: notation}
    verdict: unreadable
  - answer_slots:
      - {value: "0,5", verdict: unreadable, reason: notation}
    verdict: unreadable
  - answer_slots:
      - {value: "1/0", verdict: unreadable, reason: notation}
    verdict: unreadable
  - answer_slots:
      - {value: "1 1/2", verdict: unreadable, reason: notation}
    verdict: unreadable
