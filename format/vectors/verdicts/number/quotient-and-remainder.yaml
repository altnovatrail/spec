# Two boxes of one line: the item is right when both are, not yet right when either is clearly wrong,
# whatever the other holds, and unreadable otherwise.
item:
  line:
    - text: "47 ÷ 6 ="
    - binding: box
      check: {kind: number, key: "7"}
    - text: r
    - binding: box
      check: {kind: number, key: "5"}
readings:
  - answer_slots:
      - {value: "7", verdict: correct}
      - {value: "5", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "8", verdict: not_yet}
      - {value: "5", verdict: correct}
    verdict: not_yet
  - answer_slots:
      - {value: "8", verdict: not_yet}
      - {value: null, verdict: unreadable, reason: blank}
    verdict: not_yet
  - answer_slots:
      - {value: "7", verdict: correct}
      - {value: "five", verdict: unreadable, reason: notation}
    verdict: unreadable
