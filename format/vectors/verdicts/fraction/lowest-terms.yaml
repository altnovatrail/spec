# A fraction asked in lowest terms: a fraction of the right value that can be reduced is not yet
# right. ¾ is 3⁄4 under NFKC, and the fraction slash is the slash.
item:
  line:
    - text: "6/8 ="
    - binding: box
      check: {kind: fraction, key: "3/4", form: reduced}
readings:
  - answer_slots:
      - {value: "3/4", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "3 / 4", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "¾", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "6/8", verdict: not_yet}
    verdict: not_yet
  - answer_slots:
      - {value: "0.75", verdict: unreadable, reason: notation}
    verdict: unreadable
