# Words written by hand in a zone: letter case and white space do not count, but a full stop does,
# since a sign can be what the learner chose.
item:
  answer_slots:
    - binding: zone
      zone: {left: 300, top: 1100, width: 400, height: 200}
      check: {kind: choice, options: [even, odd], key: odd}
readings:
  - answer_slots:
      - {value: "odd", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "ODD", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: " Odd ", verdict: correct}
    verdict: correct
  - answer_slots:
      - {value: "even", verdict: not_yet}
    verdict: not_yet
  - answer_slots:
      - {value: "odd.", verdict: unreadable, reason: notation}
    verdict: unreadable
  - answer_slots:
      - {value: "uneven", verdict: unreadable, reason: notation}
    verdict: unreadable
