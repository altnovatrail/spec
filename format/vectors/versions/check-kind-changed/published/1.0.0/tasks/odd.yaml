id: odd
statement:
  - text: Write an odd number between 10 and 20.
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: predicate
          predicate: value % 2 == 1 and 10 < value and value < 20
solution:
  - text: "11, 13, 15, 17 and 19 are odd and lie between 10 and 20."
skills:
  primary: [counting]
band: grades-1-2
difficulty: 1
