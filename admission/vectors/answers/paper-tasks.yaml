# A task from the learner's paper has three capabilities of its own (R162): task_finding, the tasks
# found on the photo of a page; statement_reading, a task's statement read into a formula for the
# solver; and task_solving, a task solved for its key. Each is open to every age category, and the
# function reads its own rule, not that of the reading of handwriting. Past its rule a request goes
# to the cell as any other: a minor's page goes only where the cell's facts hold, minor_safeguards
# among them, as a minor's work does. That the reading of handwriting open does not open them,
# capability-first.yaml shows.
table:
  providers:
    alpha: {name: Alpha}
  facts:
    data_processing_agreement: {description: The platform's data processing agreement with the provider is in force.}
    minimal_retention: {description: The provider keeps none of the content of the platform's requests.}
    minor_safeguards: {description: The safeguards the provider requires for minors are in place.}
  capabilities:
    - {capability: task_finding, age_category: under_13, admission: open, basis: [privacy 6, R162]}
    - {capability: task_finding, age_category: adult, admission: open, basis: [privacy 6, R162]}
    - {capability: statement_reading, age_category: from_13_to_consent, admission: open, basis: [privacy 6, R162]}
    - {capability: statement_reading, age_category: adult, admission: open, basis: [privacy 6, R162]}
    - {capability: task_solving, age_category: from_consent_to_18, admission: open, basis: [privacy 6, R162]}
    - {capability: task_solving, age_category: adult, admission: open, basis: [privacy 6, R162]}
  cells:
    - provider: alpha
      ai_route: platform_ai
      age_category: under_13
      admission: open_with_facts
      facts: [data_processing_agreement, minimal_retention, minor_safeguards]
      terms: [{row: Anthropic, read: "2026-11-15"}]
      basis: [privacy 5.1, R121, R123]
    - provider: alpha
      ai_route: platform_ai
      age_category: from_13_to_consent
      admission: open_with_facts
      facts: [data_processing_agreement, minimal_retention, minor_safeguards]
      terms: [{row: Anthropic, read: "2026-11-15"}]
      basis: [privacy 5.1, R121, R123]
    - provider: alpha
      ai_route: platform_ai
      age_category: from_consent_to_18
      admission: open_with_facts
      facts: [data_processing_agreement, minimal_retention, minor_safeguards]
      terms: [{row: Anthropic, read: "2026-11-15"}]
      basis: [privacy 5.1, R121, R123]
    - provider: alpha
      ai_route: platform_ai
      age_category: adult
      admission: open_with_facts
      facts: [data_processing_agreement]
      terms: [{row: Anthropic, read: "2026-11-15"}]
      basis: [privacy 5.1, R121, R149]
    - provider: alpha
      ai_route: own_key
      age_category: adult
      admission: open
      terms: [{row: Anthropic, read: "2026-11-15"}]
      basis: [privacy 5.2, О-4]
cases:
  # The page of an adult goes under the provider's usual retention: the agreement alone opens it.
  - request: {capability: task_finding, ai_route: platform_ai, provider: alpha, age_category: adult}
    facts:
      alpha:
        data_processing_agreement: [adult]
    answer:
      admitted: true
      cell: {provider: alpha, ai_route: platform_ai, age_category: adult}
  # A child's page goes only where every fact of the cell holds.
  - request: {capability: task_finding, ai_route: platform_ai, provider: alpha, age_category: under_13}
    facts:
      alpha:
        data_processing_agreement: [under_13]
        minimal_retention: [under_13]
        minor_safeguards: [under_13]
    answer:
      admitted: true
      cell: {provider: alpha, ai_route: platform_ai, age_category: under_13}
  # Without minimal retention a child's page does not go.
  - request: {capability: task_finding, ai_route: platform_ai, provider: alpha, age_category: under_13}
    facts:
      alpha:
        data_processing_agreement: [under_13]
    answer:
      admitted: false
      reason: fact_missing
      cell: {provider: alpha, ai_route: platform_ai, age_category: under_13}
      fact: minimal_retention
  # Reading a statement, for a learner below the age of digital consent.
  - request: {capability: statement_reading, ai_route: platform_ai, provider: alpha, age_category: from_13_to_consent}
    facts:
      alpha:
        data_processing_agreement: [from_13_to_consent]
        minimal_retention: [from_13_to_consent]
        minor_safeguards: [from_13_to_consent]
    answer:
      admitted: true
      cell: {provider: alpha, ai_route: platform_ai, age_category: from_13_to_consent}
  # Solving a task, on the own key of an adult: no fact.
  - request: {capability: task_solving, ai_route: own_key, provider: alpha, age_category: adult}
    answer:
      admitted: true
      cell: {provider: alpha, ai_route: own_key, age_category: adult}
  # Solving a task, its rule open and the cell waiting for the minor's last fact.
  - request: {capability: task_solving, ai_route: platform_ai, provider: alpha, age_category: from_consent_to_18}
    facts:
      alpha:
        data_processing_agreement: [from_consent_to_18]
        minimal_retention: [from_consent_to_18]
    answer:
      admitted: false
      reason: fact_missing
      cell: {provider: alpha, ai_route: platform_ai, age_category: from_consent_to_18}
      fact: minor_safeguards
  # This table has no rule of statement_reading for under_13: closed, with no rule to name.
  - request: {capability: statement_reading, ai_route: platform_ai, provider: alpha, age_category: under_13}
    facts:
      alpha:
        data_processing_agreement: [under_13]
        minimal_retention: [under_13]
        minor_safeguards: [under_13]
    answer:
      admitted: false
      reason: capability_closed
