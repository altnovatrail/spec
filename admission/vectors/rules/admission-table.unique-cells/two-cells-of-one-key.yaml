# Two cells of one provider, AI route and age category, which say different things: a reader could
# not tell which holds.
providers:
  example: {name: Example}
facts:
  data_processing_agreement: {description: The platform's data processing agreement with the provider is signed.}
capabilities:
  - {capability: hint, age_category: adult, admission: open, basis: [privacy 3.2]}
cells:
  - provider: example
    ai_route: own_key
    age_category: adult
    admission: open
    terms: [{row: OpenAI, read: "2026-11-03"}]
    basis: [privacy 5.2, О-4]
  - provider: example
    ai_route: own_key
    age_category: adult
    admission: closed
    terms: [{row: OpenAI, read: "2026-11-03"}]
    basis: [П-4]
